<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Merge Café: Cozy Merge Puzzle</title>
<meta name="description" content="Merge coffee, pastries and fruit treats, serve happy customers and unlock new areas of your cozy café. Free relaxing merge puzzle.">
<meta name="theme-color" content="#f6e7d4">
<style>
:root{
--bg:#f6e7d4;--bg2:#efd8bd;--card:#fffaf3;--ink:#4a2e1f;--mute:#9a7a64;--line:#e8d3bb;
--acc:#ff8a3d;--acc2:#e9672a;--good:#3bb273;--goodd:#23864f;--wood:#b8784a;--woodd:#8d5530;
--cell:#fbf1e3;--cell2:#f4e4cf;--r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none;
font-family:"Nunito","Segoe UI Rounded","Arial Rounded MT Bold","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
background:radial-gradient(900px 600px at 50% -10%,#fff4e4 0%,transparent 70%),
radial-gradient(circle at 20% 30%,#f2d9bd 0 2px,transparent 3px) 0 0/34px 34px,
radial-gradient(circle at 70% 80%,#f2d9bd 0 2px,transparent 3px) 0 0/34px 34px,var(--bg)}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:max(8px,env(safe-area-inset-top)) 10px max(8px,env(safe-area-inset-bottom))}
header{width:100%;max-width:1100px;display:flex;align-items:center;gap:8px;height:48px;flex:none}
.logo{font-weight:900;font-size:22px;letter-spacing:.2px;display:flex;align-items:center;gap:6px;white-space:nowrap;color:var(--woodd)}
.logo canvas{width:34px;height:34px}
.sp{flex:1}
.pill{display:flex;align-items:center;gap:5px;background:var(--card);border-radius:999px;padding:4px 12px 4px 5px;font-weight:900;font-size:16px;box-shadow:0 3px 0 #d9bfa2;white-space:nowrap;position:relative}
.pill b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:15px;color:#fff}
.pill .co{background:radial-gradient(circle at 35% 30%,#ffe98f,#f2a900);box-shadow:inset 0 0 0 3px #ffd34d,inset 0 0 0 5px #e09a00}
.pill .st{background:radial-gradient(circle at 35% 30%,#ffcf6b,#ff9f1c)}
.pill .en{background:radial-gradient(circle at 35% 30%,#7fe0a2,#2bb36a)}
.pill small{font-size:10px;color:var(--mute);font-weight:800;position:absolute;bottom:-14px;left:0;right:0;text-align:center}
.pill.plus{cursor:pointer}
.ib{width:40px;height:40px;border-radius:12px;background:var(--card);display:grid;place-items:center;font-size:18px;box-shadow:0 3px 0 #d9bfa2;flex:none}
.ib:active,.pill.plus:active{transform:translateY(2px);box-shadow:0 1px 0 #d9bfa2}
main{flex:1;width:100%;max-width:1100px;display:flex;gap:16px;align-items:center;justify-content:center;min-height:0;padding-top:10px}
.orders{display:flex;gap:8px;flex:none}
.ord{background:var(--card);border-radius:16px;padding:6px;box-shadow:0 4px 0 #dcc2a4;display:flex;align-items:center;gap:6px;position:relative;transition:transform .2s}
.ord .av{width:44px;height:44px;flex:none}
.ord .its{display:flex;gap:3px}
.ord .it{width:40px;height:40px;border-radius:10px;background:var(--cell2);position:relative;display:grid;place-items:center}
.ord .it canvas{width:36px;height:36px}
.ord .it.ok{background:#d9f5e3;box-shadow:inset 0 0 0 2px var(--good)}
.ord .it.ok::after{content:"✓";position:absolute;right:-3px;top:-5px;width:16px;height:16px;border-radius:50%;background:var(--good);color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center}
.ord .rw{font-size:11px;font-weight:900;color:var(--mute);text-align:center;line-height:1.15}
.serve{background:linear-gradient(180deg,#4fd08a,var(--good));color:#fff;font-weight:900;border-radius:10px;padding:7px 9px;font-size:13px;box-shadow:0 3px 0 var(--goodd);animation:bob .8s ease-in-out infinite alternate}
.serve:active{transform:translateY(2px);box-shadow:0 1px 0 var(--goodd)}
@keyframes bob{to{transform:scale(1.07)}}
.ord.out{transform:scale(.2) translateY(-30px);opacity:0;transition:all .35s}
.ord.inn{animation:pop .35s ease-out}
.board-wrap{position:relative;flex:none}
#cv{display:block;touch-action:none;border-radius:22px;box-shadow:0 12px 30px #8d553040}
.zbtn{position:absolute;transform:translate(-50%,-50%);background:linear-gradient(180deg,#ffb067,var(--acc));color:#fff;font-weight:900;border-radius:14px;padding:9px 14px;box-shadow:0 4px 0 var(--acc2),0 8px 20px #0003;font-size:15px;white-space:nowrap;text-align:center;line-height:1.15}
.zbtn small{display:block;font-size:12px;opacity:.95}
.zbtn.no{background:linear-gradient(180deg,#d8c4ae,#bfa58a);box-shadow:0 4px 0 #9c8169,0 8px 20px #0003}
.zbtn:active{transform:translate(-50%,calc(-50% + 2px))}
.info{width:100%;max-width:520px;height:54px;flex:none;margin-top:8px;background:var(--card);border-radius:16px;box-shadow:0 4px 0 #dcc2a4;display:flex;align-items:center;gap:8px;padding:6px 10px}
.info canvas{width:40px;height:40px;flex:none}
.info .tx{flex:1;min-width:0;font-size:14px;font-weight:800;line-height:1.2}
.info .tx small{display:block;font-weight:700;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .tx.tut{color:var(--acc2)}
.sbtn{background:var(--bg2);border-radius:10px;padding:8px 10px;font-weight:900;font-size:13px;box-shadow:0 3px 0 #d0b393;white-space:nowrap}
/* side layout (wide) */
.side{display:flex;flex-direction:column;gap:10px;width:300px;flex:none;align-self:stretch;justify-content:center}
.side h3{margin:0 4px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--mute)}
.side .orders{flex-direction:column}
.side .ord{padding:8px 10px}
.side .ord .av{width:52px;height:52px}
.side .ord .it{width:48px;height:48px}
.side .ord .it canvas{width:42px;height:42px}
.side .ord .rw{margin-left:auto}
.col{display:flex;flex-direction:column;align-items:center;min-height:0}
.top-orders{width:100%;display:flex;justify-content:center;flex:none;margin-bottom:8px;overflow:hidden}
/* overlays */
.ov{position:fixed;inset:0;background:#4a2e1f99;backdrop-filter:blur(4px);display:grid;place-items:center;z-index:20;padding:16px}
.modal{background:var(--card);border-radius:26px;padding:22px 18px;max-width:400px;width:100%;max-height:calc(100vh - 24px);overflow:auto;box-shadow:0 20px 60px #0006;text-align:center;animation:pop .25s ease-out}
.modal h2{margin:0 0 6px;font-size:24px;font-weight:900}
.modal p{margin:6px 0 14px;color:var(--mute);font-weight:700}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;padding:13px 16px;font-weight:900;font-size:17px;background:linear-gradient(180deg,#ffb067,var(--acc));color:#fff;box-shadow:0 5px 0 var(--acc2);width:100%;margin-top:10px;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--acc2)}
.btn.g{background:linear-gradient(180deg,#4fd08a,var(--good));box-shadow:0 5px 0 var(--goodd)}
.btn.sec{background:var(--bg2);color:var(--ink);box-shadow:0 5px 0 #d0b393}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn small{font-size:12px;background:#0002;border-radius:6px;padding:2px 5px}
/* title */
#title{background:radial-gradient(800px 500px at 50% 30%,#fff3e2,#f3d9bb);backdrop-filter:none}
.tbox{display:flex;flex-direction:column;align-items:center;text-align:center;max-width:420px;width:100%}
.tbox canvas.hero{width:180px;height:180px;filter:drop-shadow(0 14px 18px #8d553055);animation:float 2.4s ease-in-out infinite alternate}
@keyframes float{to{transform:translateY(-8px) rotate(-2deg)}}
.tbox h1{font-size:46px;line-height:1;margin:6px 0 4px;font-weight:900;color:var(--woodd);letter-spacing:-.5px;text-shadow:0 3px 0 #fff}
.tbox .sub{font-weight:800;color:var(--mute);margin-bottom:18px}
.tbox .btn{font-size:24px;padding:16px;max-width:300px;animation:bob .9s ease-in-out infinite alternate}
.trow{display:flex;gap:6px;margin-top:22px;flex-wrap:wrap;justify-content:center}
.lb{background:var(--card);border-radius:10px;padding:6px 10px;font-weight:900;font-size:13px;box-shadow:0 3px 0 #d9bfa2;color:var(--mute)}
.lb.on{background:var(--acc);color:#fff;box-shadow:0 3px 0 var(--acc2)}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.day{background:var(--cell2);border-radius:14px;padding:8px 4px;font-weight:900;font-size:13px;position:relative}
.day .v{font-size:15px;margin-top:3px}
.day.done{opacity:.5}
.day.done::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font-size:28px;color:var(--good)}
.day.now{background:#ffe2c6;box-shadow:inset 0 0 0 3px var(--acc)}
.day.big{grid-column:span 2;background:linear-gradient(135deg,#ffe9a8,#ffcf6b)}
#toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:900;padding:10px 18px;border-radius:14px;z-index:40;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
#toast.on{opacity:1}
.fly{position:fixed;z-index:30;font-weight:900;font-size:20px;color:#fff;text-shadow:0 2px 0 #8d5530,0 0 6px #8d5530;pointer-events:none;animation:flyup 1s ease-out forwards}
@keyframes flyup{to{transform:translateY(-60px);opacity:0}}
.pill.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.18)}}
.top-orders .ord{flex-wrap:wrap;justify-content:center;gap:4px;padding:5px 6px;max-width:122px}
.top-orders .ord .av{width:28px;height:28px}
.top-orders .ord .it{width:34px;height:34px;border-radius:9px}.top-orders .ord .it canvas{width:30px;height:30px}
.top-orders .ord .rw,.top-orders .serve{flex-basis:100%}
.top-orders .serve{padding:4px 6px;font-size:12px;border-radius:8px}
.ord .rw b{color:#e08a00}
.side .ord .rw{font-size:14px;display:flex;flex-direction:column;align-items:flex-end}
@media (max-width:420px){.logo span{display:none}.pill{font-size:15px;padding-right:10px}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><canvas id="lg" width="68" height="68"></canvas><span>Merge Café</span></div>
    <div class="sp"></div>
    <div class="pill" id="pSt"><b class="st">★</b><span id="vSt">0</span></div>
    <div class="pill" id="pCo"><b class="co"></b><span id="vCo">0</span></div>
    <div class="pill plus" id="pEn"><b class="en">⚡</b><span id="vEn">0</span><small id="vEt"></small></div>
    <button class="ib" id="bSnd" aria-label="Sound">🔊</button>
    <button class="ib" id="bGift" aria-label="Daily reward">🎁</button>
  </header>
  <main id="main">
    <div class="side" id="side"><h3 id="tOrd">Orders</h3><div class="orders" id="ordS"></div></div>
    <div class="col" id="col">
      <div class="top-orders" id="topO"><div class="orders" id="ordT"></div></div>
      <div class="board-wrap" id="bw"><canvas id="cv"></canvas></div>
      <div class="info" id="info"><canvas id="ic" width="80" height="80"></canvas><div class="tx" id="itx"></div><button class="sbtn" id="iBtn" hidden></button></div>
    </div>
  </main>
</div>

<div class="ov" id="title">
  <div class="tbox">
    <canvas class="hero" id="hero" width="360" height="360"></canvas>
    <h1>Merge Café</h1>
    <div class="sub" id="tSub"></div>
    <button class="btn" id="bPlay">PLAY</button>
    <div class="trow" id="langs"></div>
  </div>
</div>

<div class="ov" id="mDaily" hidden><div class="modal"><h2 id="dT"></h2><p id="dS"></p><div class="days" id="days"></div><button class="btn g" id="dClaim"></button><button class="btn sec" id="dX2" hidden></button></div></div>
<div class="ov" id="mEn" hidden><div class="modal"><h2 id="eT"></h2><p id="eS"></p><button class="btn g" id="eAd"></button><button class="btn" id="eBuy"></button><button class="btn sec" id="eX"></button></div></div>
<div class="ov" id="mMsg" hidden><div class="modal"><canvas id="mIc" width="200" height="200" style="width:100px;height:100px"></canvas><h2 id="mT"></h2><p id="mS"></p><button class="btn" id="mOk">OK</button></div></div>
<div id="toast"></div>

  const its=document.createElement("div");its.className="its";const avail=new Set();
  o.items.forEach(it=>{const e=document.createElement("div");e.className="it";let ok=false;for(let i=0;i<S.board.length;i++){const b=S.board[i];if(b&&!b.g&&b.k===it.k&&b.t===it.t&&!avail.has(i)&&unlocked(i)){avail.add(i);ok=true;break}}
   if(ok)e.classList.add("ok");const ic=document.createElement("canvas");ic.width=ic.height=96;paintIcon(ic,it.k+it.t);e.title=iname(it);e.appendChild(ic);e.onclick=()=>showInfo({k:it.k,t:it.t});its.appendChild(e)});
  d.appendChild(its);
  if(cells){const b=document.createElement("button");b.className="serve";b.textContent=t("serve");b.onclick=()=>serve(oi,d);d.appendChild(b)}
  else{const r=document.createElement("div");r.className="rw";r.innerHTML="🪙"+o.coins+" <b>★"+o.stars+"</b>";d.appendChild(r)}
  box.appendChild(d)})}
function serve(oi,el){const o=S.orders[oi];const cells=o&&matchOrder(o);if(!cells)return;cells.forEach(i=>{S.board[i]=null;burst(i,"#3bb273")});
 S.coins+=o.coins;S.stars+=o.stars;S.served++;SFX.serve();const r=el.getBoundingClientRect();flyText("+"+o.coins+" 🪙  +"+o.stars+"★",r.left+r.width/2,r.top);
 bump("pCo");bump("pSt");el.classList.add("out");S.orders.splice(oi,1);if(S.tut===2)S.tut=3;fillOrders();save();
 setTimeout(()=>{renderOrders();const n=document.querySelector('.ord[data-id="'+S.orders[S.orders.length-1].id+'"]');if(n)n.classList.add("inn");placeZoneBtns()},330);
 dirty=true;hud();info();if(S.served%8===0&&S.tut>=3){const p=K("levelDone",{title:t("bonus"),reward:"+20⚡"});if(p&&p.then)p.then(ok=>{if(ok){S.energy+=20;save();hud();toast(t("bonus"))}})}}

/* ---------- actions ---------- */
function spawn(gi){const g=S.board[gi];const e=emptyNear(gi);if(e<0){toast(t("full"));SFX.err();return}
 if(!useEnergy()){openEnergy();SFX.err();return}
 let k=g.g,tt=1;if(S.tut>=3&&Math.random()<.14)tt=2;S.board[e]={k,t:tt};addPop(e,cellXY(gi));SFX.pop();
 if(S.tut===0&&S.board.filter(b=>b&&b.k==="c"&&b.t===1).length>=2)S.tut=1;discover(k,tt);save();hud();renderOrders();info();dirty=true}
function discover(k,tt){if(!S.disc[k+tt]){S.disc[k+tt]=1;if(tt>1&&S.tut>=3)toast(t("disc",{x:NAMES[lang][k][tt-1]}))}}
function drop(a,b){if(b<0||a===b||!unlocked(b))return;const A=S.board[a],B=S.board[b];
 if(!B){S.board[b]=A;S.board[a]=null;sel=b}
 else if(same(A,B)&&A.t<MAXT[A.k]){S.board[b]={k:A.k,t:A.t+1};S.board[a]=null;addPop(b);burst(b);SFX.merge(A.t);sel=b;if(S.tut===1)S.tut=2;discover(A.k,A.t+1)}
 else{S.board[b]=A;S.board[a]=B;sel=b}
 save();renderOrders();info();dirty=true}
function sell(i){const it=S.board[i];if(!it||it.g)return;const v=Math.pow(2,it.t-1);S.board[i]=null;S.coins+=v;SFX.coin();burst(i,"#ffd23f");sel=-1;save();hud();renderOrders();info();dirty=true}

/* ---------- input ---------- */
function cellAt(ev){const r=cv.getBoundingClientRect(),x=ev.clientX-r.left-PAD,y=ev.clientY-r.top-PAD;if(x<0||y<0||x>=COLS*CS||y>=ROWS*CS)return -1;return idx(Math.floor(y/CS),Math.floor(x/CS))}
cv.addEventListener("pointerdown",e=>{const i=cellAt(e);if(i<0||!unlocked(i))return;if(!S.board[i]){sel=-1;info();dirty=true;return}
 const r=cv.getBoundingClientRect();drag={i,x0:e.clientX,y0:e.clientY,x:e.clientX-r.left,y:e.clientY-r.top,moved:false};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener("pointermove",e=>{if(!drag)return;const r=cv.getBoundingClientRect();drag.x=e.clientX-r.left;drag.y=e.clientY-r.top;if(!drag.moved&&Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)>7)drag.moved=true;dirty=true});
const endDrag=e=>{if(!drag)return;const d=drag;drag=null;if(d.moved)drop(d.i,cellAt(e));else{const it=S.board[d.i];sel=d.i;if(it&&it.g)spawn(d.i);else{SFX.coin()}info()}dirty=true};
cv.addEventListener("pointerup",endDrag);cv.addEventListener("pointercancel",()=>{drag=null;dirty=true});

/* ---------- zones ---------- */
function placeZoneBtns(){document.querySelectorAll(".zbtn").forEach(b=>b.remove());const bw=$("bw");
 for(let z=1;z<ZONES.length;z++){if(S.zones[z])continue;const Z=ZONES[z],b=document.createElement("button");b.className="zbtn"+(S.stars>=Z.cost?"":" no");
  b.innerHTML="🔒 "+t(Z.name)+"<small>"+t("unlock")+" · "+Z.cost+"★</small>";b.style.left=(PAD+COLS*CS/2)+"px";b.style.top=(PAD+((Z.r0+Z.r1+1)/2)*CS)+"px";b.dataset.cost=Z.cost;b.onclick=()=>unlockZone(z);bw.appendChild(b)}}
function unlockZone(z){const Z=ZONES[z];if(S.stars<Z.cost){toast(t("need",{n:Z.cost}));SFX.err();return}if(z>1&&!S.zones[z-1]){toast(t("need",{n:ZONES[z-1].cost}));return}
 S.stars-=Z.cost;S.zones[z]=1;SFX.unlock();K("happytime");for(let r=Z.r0;r<=Z.r1;r++)for(let c=0;c<COLS;c++)burst(idx(r,c),c%2?"#ffd23f":"#ff8a3d");
 let msg,icon;if(z===1){S.board[idx(5,3)]={g:"f"};S.board[idx(6,1)]={k:"f",t:1};S.board[idx(6,5)]={k:"f",t:1};msg=t("zNew",{g:NAMES[lang].g.f});icon="gf"}
 else{[[7,1,"c",3],[7,5,"b",3],[8,3,"f",2]].forEach(a=>S.board[idx(a[0],a[1])]={k:a[2],t:a[3]});msg=t("zGift")+" "+t("soon");icon="b6"}
 save();placeZoneBtns();hud();renderOrders();dirty=true;showMsg(t("zOpen",{z:t(Z.name)}),msg,icon,()=>{const p=K("levelDone",{title:t("bonus"),reward:"+20⚡"});if(p&&p.then)p.then(ok=>{if(ok){S.energy+=20;save();hud();toast(t("bonus"))}})})}

/* ---------- UI ---------- */
function hud(){tickEnergy();$("vSt").textContent=S.stars;$("vCo").textContent=S.coins;$("vEn").textContent=S.energy;
 if(S.energy<E_MAX){const s=E_SEC-Math.floor((Date.now()-S.eTs)/1000)%E_SEC;$("vEt").textContent="+1 0:"+String(s).padStart(2,"0")}else $("vEt").textContent="";
 $("bGift").style.opacity=dailyAvail()?1:.55;document.querySelectorAll(".zbtn").forEach(b=>b.classList.toggle("no",S.stars<+b.dataset.cost))}
function bump(id){const e=$(id);e.classList.remove("bump");void e.offsetWidth;e.classList.add("bump")}
let tT=0;function toast(s){const e=$("toast");e.textContent=s;e.classList.add("on");clearTimeout(tT);tT=setTimeout(()=>e.classList.remove("on"),1900)}
function flyText(s,x,y){const e=document.createElement("div");e.className="fly";e.textContent=s;e.style.left=(x-60)+"px";e.style.top=y+"px";e.style.width="120px";e.style.textAlign="center";document.body.appendChild(e);setTimeout(()=>e.remove(),1000)}
let infoItem=null;function showInfo(it){infoItem=it;sel=-1;info();dirty=true}
function info(){const tx=$("itx"),bt=$("iBtn"),ic=$("ic");bt.hidden=true;tx.className="tx";
 if(S.tut<3){tx.classList.add("tut");tx.textContent=t(["t0","t1","t2"][S.tut]);paintIcon(ic,S.tut===0?"gc":"c1");return}
 let it=sel>=0?S.board[sel]:infoItem;if(sel>=0)infoItem=null;
 if(!it){tx.textContent=t("idle");paintIcon(ic,"c4");return}
 paintIcon(ic,it.g?"g"+it.g:it.k+it.t);
 if(it.g){tx.innerHTML=iname(it)+"<small>"+t("gen")+"</small>";return}
 const nx=it.t<MAXT[it.k]?t("next",{x:NAMES[lang][it.k][it.t]}):t("max");tx.innerHTML=iname(it)+"<small>"+nx+"</small>";
 if(sel>=0){bt.hidden=false;bt.textContent=t("sell")+" +"+Math.pow(2,it.t-1)+" 🪙";const s=sel;bt.onclick=()=>sell(s)}}
$("iBtn").addEventListener("pointerdown",e=>e.stopPropagation());
function showMsg(title,sub,icon,cb){$("mT").textContent=title;$("mS").textContent=sub;paintIcon($("mIc"),icon);$("mOk").textContent=t("ok");$("mMsg").hidden=false;$("mOk").onclick=()=>{$("mMsg").hidden=true;cb&&cb()}}
function openEnergy(){$("eT").textContent=t("noE");$("eS").textContent=t("eS");$("eAd").textContent=t("ad");$("eBuy").innerHTML=t("buy")+" <small>40 🪙</small>";$("eBuy").disabled=S.coins<40;$("eX").textContent=t("close");$("mEn").hidden=false}
$("eAd").onclick=()=>{$("mEn").hidden=true;const p=K("rewarded","energy");Promise.resolve(p).then(ok=>{if(ok){S.energy+=40;save();hud();bump("pEn");toast("+40⚡")}})};
$("eBuy").onclick=()=>{if(S.coins<40)return;S.coins-=40;S.energy+=20;SFX.coin();save();hud();bump("pEn");$("mEn").hidden=true};
$("eX").onclick=()=>$("mEn").hidden=true;$("pEn").onclick=openEnergy;
$("bSnd").onclick=()=>{S.sound=S.sound?0:1;$("bSnd").textContent=S.sound?"🔊":"🔇";save()};

/* ---------- daily ---------- */
const dkey=d=>d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
function dailyAvail(){return S.daily.last!==dkey(new Date())}
function dailyIdx(){const y=new Date();y.setDate(y.getDate()-1);return S.daily.last===dkey(y)?S.daily.streak%7:0}
function openDaily(){const av=dailyAvail(),di=av?dailyIdx():(S.daily.streak-1)%7;$("dT").textContent=t("daily");$("dS").textContent=S.daily.streak>1&&!av?t("streak",{n:S.daily.streak}):t("dS");
 $("days").innerHTML=DAYS.map((d,i)=>'<div class="day'+(i===6?" big":"")+(i<di||(!av&&i===di)?" done":"")+(av&&i===di?" now":"")+'">'+t("day",{n:i+1})+'<div class="v">'+(d.c?"🪙"+d.c:"")+(d.c&&d.e?" ":"")+(d.e?"⚡"+d.e:"")+"</div></div>").join("");
 $("dClaim").textContent=av?t("claim"):t("ok");$("dX2").textContent=t("x2");$("dX2").hidden=!av;$("mDaily").hidden=false;
 const claim=m=>{if(dailyAvail()){const i=dailyIdx(),d=DAYS[i];S.coins+=(d.c||0)*m;S.energy+=(d.e||0)*m;S.daily.streak=i===0?1:S.daily.streak+1;S.daily.last=dkey(new Date());save();hud();bump("pCo");bump("pEn");SFX.serve()}$("mDaily").hidden=true};
 $("dClaim").onclick=()=>claim(1);$("dX2").onclick=()=>{const p=K("rewarded","daily_x2");Promise.resolve(p).then(ok=>claim(ok?2:1))}}
$("bGift").onclick=openDaily;

/* ---------- title / start ---------- */
function applyLang(){document.documentElement.lang=lang;$("tSub").textContent=t("sub");$("bPlay").textContent=t("play");$("tOrd").textContent=t("orders");
 $("langs").innerHTML=LANGS.map(l=>'<button class="lb'+(l===lang?" on":"")+'" data-l="'+l+'">'+l.toUpperCase()+"</button>").join("");
 document.querySelectorAll(".lb").forEach(b=>b.onclick=()=>{lang=b.dataset.l;store.set("lang",lang);applyLang()});renderOrders();placeZoneBtns();info()}
$("bPlay").onclick=()=>{$("title").hidden=true;tone(1,.01,"sine",.001);K("gameplayStart");if(dailyAvail()&&S.tut>=3)openDaily()};
paintIcon($("hero"),"c4");paintIcon($("lg"),"c4");$("bSnd").textContent=S.sound?"🔊":"🔇";
fillOrders();tickEnergy();layout();applyLang();hud();addEventListener("resize",layout);requestAnimationFrame(loop);
window.__mc={S,spawn:i=>spawn(i),drop,unlockZone,serve:oi=>{const el=document.querySelectorAll(".ord")[oi];serve(oi,el||document.body)},render:renderOrders};

})();
</script>
</body>
</html>
