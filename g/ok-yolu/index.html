try{var s=localStorage.getItem('sg_lang');if(s&&SUP.indexOf(s)>=0)lang=s}catch(e){}
if(!lang){var ls=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'']);
  for(var i=0;i<ls.length&&!lang;i++){var p=String(ls[i]||'').toLowerCase().split(/[-_]/)[0];if(p==='in')p='id';if(SUP.indexOf(p)>=0)lang=p}}
if(!lang)lang='en';
window.SG_LANG=lang;document.documentElement.lang=lang;
window.SG_LANGS=SUP;window.SG_LANG_NAMES=NAMES;
window.t=function(key,params){var e=DICT[key],v=e?(e[lang]!=null?e[lang]:e.en!=null?e.en:e.tr):undefined;if(v==null)v=key;
  if(params&&typeof v==='string')v=v.replace(/\{(\w+)\}/g,function(m,k){return params[k]!=null?params[k]:m});return v};
window.SG_setLang=function(c){if(SUP.indexOf(c)<0)return;try{localStorage.setItem('sg_lang',c)}catch(e){}location.reload()};
document.title=t('title');

<script>
(()=>{
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]];
const MAX_LEVEL=60, HINTS=3, LIVES=3;
// Her 5 seviyede bir yeni kademe: zorluk bu sınırlarda belirgin bir sıçrama yapar.
const TIER_NAMES=t('tiers');
const TIERS=TIER_NAMES.map((nm,i)=>[1+i*5,nm]);
const isDark=nm=>TIER_NAMES.indexOf(nm)>=9;
const tierOf=n=>{let r=TIERS[0][1];for(const[s,nm] of TIERS)if(n>=s)r=nm;return r};
const $=id=>document.getElementById(id);

/* ---------- kayıt ---------- */
let save={unlocked:1,stars:{},best:{},sound:true,color:false,level:1};
try{const s=JSON.parse(localStorage.getItem('okyolu')||'null');if(s)save=Object.assign(save,s)}catch(e){}
const persist=()=>{try{localStorage.setItem('okyolu',JSON.stringify(save))}catch(e){}};

/* ---------- seviye üretimi (her zaman çözülebilir) ----------
   Oklar sırayla yerleştirilir; her yeni okun çıkış hattı o ana kadar
   yerleşmiş oklardan boştur. Ters sırayla kaldırmak her zaman çözümdür. */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
/* Zorluk eğrisi: her seviyede ok sayısı, tahta boyu, ok uzunluğu ve
   "zincir derinliği" (kaç tur sırayla açılması gerektiği) yavaşça artar. */
function curve(lvl,fill){
  // Kademe içinde (5 seviye) hafif artış, kademe sınırında büyük sıçrama.
  const st=Math.floor((lvl-1)/5),i=(lvl-1)%5,n=5*st+1+i*.4;
  // Ok sayısı hızlı artar: 1→10, 10→37, 20→73, 30→117, 40→167, 50→225, 60→289
  const target=Math.round(7+2.6*n+.035*n*n);
  const maxLen=Math.min(3+Math.floor(n/8),10);
  const avg=2+.42*(maxLen-2);
  const cols=Math.max(5,Math.ceil(Math.sqrt(target*avg/fill/1.5)));
  return{cols,rows:Math.round(cols*1.5),target,maxLen,
    straight:Math.max(.35,.75-n*.007),
    depth:2+n*.13};
}
function analyse(L){ // açılış sayısı ve zincir derinliği
  const occ=L.occ.slice(),alive=L.arrows.map(()=>true);let left=L.arrows.length,depth=0,free0=0;
  while(left){
    const ready=[];
    for(const a of L.arrows){if(!alive[a.id])continue;
      const[hx,hy]=a.body[a.body.length-1],[dx,dy]=DIRS[a.dir];let x=hx+dx,y=hy+dy,ok=true;
      while(x>=0&&y>=0&&x<L.cols&&y<L.rows){if(occ[y*L.cols+x]!==-1){ok=false;break}x+=dx;y+=dy}
      if(ok)ready.push(a)}
    if(!ready.length)break;
    if(!depth)free0=ready.length;depth++;
    for(const a of ready){alive[a.id]=false;left--;for(const[bx,by]of a.body)occ[by*L.cols+bx]=-1}
  }
  return{depth,free0};
}
function genLevel(n){
  // En sıkı tahtadan başla; hedef ok sayısı sığmazsa tahtayı biraz büyüt.
  for(const fill of (n>25?[.6,.55,.5,.45,.4]:[.8,.72,.64,.56,.48])){
    const c=curve(n,fill);let best=null,bs=-1e9;
    const K=c.cols*c.rows>900?5:c.cols*c.rows>400?8:12;
    for(let k=0;k<K;k++){
      const L=genCandidate(n,k,c);if(L.arrows.length<c.target)continue;
      const A=analyse(L);
      const s=-Math.abs(A.depth-c.depth)*3-(n>15?A.free0/L.arrows.length*6:0);
      if(s>bs){bs=s;best=L}
    }
    if(best)return best;
  }
  return genCandidate(n,0,curve(n,.35));
}
function genCandidate(n,k,c){
  const r=rng(n*9973+17+k*7919);
  const{cols,rows,maxLen,straight,target}=c;
  const occ=new Int16Array(cols*rows).fill(-1);
  const arrows=[];
  const inb=(x,y)=>x>=0&&y>=0&&x<cols&&y<rows;
  const tries=cols*rows*14;
  for(let a=0;a<tries&&arrows.length<target;a++){
    const x0=Math.floor(r()*cols),y0=Math.floor(r()*rows);
    if(occ[y0*cols+x0]!==-1)continue;
    const L=2+Math.floor(Math.pow(r(),1.5)*(maxLen-1));
    const body=[[x0,y0]],set=new Set([y0*cols+x0]);
    let d=Math.floor(r()*4);
    while(body.length<L){
      const nd=r()<straight?d:(d+(r()<.5?1:3))%4;
      let moved=false;
      for(const dd of [nd,(d+1)%4,(d+3)%4,d]){
        const[hx,hy]=body[body.length-1],nx=hx+DIRS[dd][0],ny=hy+DIRS[dd][1],k=ny*cols+nx;
        if(inb(nx,ny)&&occ[k]===-1&&!set.has(k)){body.push([nx,ny]);set.add(k);d=dd;moved=true;break}
      }
      if(!moved)break;
    }
    if(body.length<2)continue;
    const[hx,hy]=body[body.length-1];let ok=true;
    for(let x=hx+DIRS[d][0],y=hy+DIRS[d][1];inb(x,y);x+=DIRS[d][0],y+=DIRS[d][1]){
      const k=y*cols+x;if(occ[k]!==-1||set.has(k)){ok=false;break}
    }
    if(!ok)continue;
    const id=arrows.length;arrows.push({id,body,dir:d,alive:true});
    for(const k of set)occ[k]=id;
  }
  return{cols,rows,arrows,occ};
}

/* ---------- ses ---------- */
let ac=null;
function tone(f,dur,type='sine',vol=.12,slide=0,delay=0){
  if(!save.sound)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur);
  }catch(e){}
}
const sfx={
  go:c=>tone(380+Math.min(c,8)*60,.16,'triangle',.1,2.2),
  bump:()=>{tone(140,.22,'square',.07,.6);tone(90,.25,'sine',.15,.7)},
  hint:()=>{tone(660,.12,'sine',.08);tone(990,.18,'sine',.08,1,.1)},
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.3,'triangle',.1,1,i*.11)),
  lose:()=>[330,262,196].forEach((f,i)=>tone(f,.35,'sine',.12,1,i*.16))
};
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

/* ---------- oyun durumu ---------- */
let G=null;
function start(n){
  n=Math.max(1,Math.min(MAX_LEVEL,n));
  const lv=genLevel(n);
  const maxLives=lv.arrows.length>200?5:lv.arrows.length>100?4:LIVES;
  G={n,...lv,lives:maxLives,maxLives,hints:HINTS+Math.floor(lv.arrows.length/60),movers:[],parts:[],flash:new Map(),hintId:-1,hintT:0,
     t0:performance.now(),elapsed:0,mistakes:0,done:false,shake:0,combo:0,lastClear:0,total:lv.arrows.length,left:lv.arrows.length};
  save.level=n;persist();
  $('lvlName').textContent=t('level',{n});
  const tn=tierOf(n);$('tierName').textContent=tn;$('tierName').className='tier'+(isDark(tn)?' kabus':'');
  renderHearts();updateHud();closeOverlay();
  const tierStart=TIERS.find(t=>t[0]===n&&n>1);
  if(tierStart)toast(t('newTier',{tier:tn,n:G.total}),3200);
  else if(n<=2)toast(n===1?t('tut1'):t('tut2'),4200);
  introCam();
}

function rayInfo(a){ // önündeki boş hücre sayısı, engel id'si
  const[hx,hy]=a.body[a.body.length-1],[dx,dy]=DIRS[a.dir];
  let x=hx+dx,y=hy+dy,free=0;
  while(x>=0&&y>=0&&x<G.cols&&y<G.rows){
    const o=G.occ[y*G.cols+x];if(o!==-1)return{free,blocker:o};
    free++;x+=dx;y+=dy;
  }
  return{free,blocker:-1};
}
function pathFor(a,extra){ // gövde + baş yönünde devam eden noktalar
  const p=a.body.map(c=>c.slice()),[dx,dy]=DIRS[a.dir];let[hx,hy]=p[p.length-1];
  for(let i=1;i<=extra;i++)p.push([hx+dx*i,hy+dy*i]);
  return p;
}

function tap(a){
  if(G.done||!a.alive||G.movers.some(m=>m.a===a))return;
  if(ac&&ac.state==='suspended')ac.resume();
  const{free,blocker}=rayInfo(a);
  if(blocker===-1){
    a.alive=false;for(const[x,y]of a.body)G.occ[y*G.cols+x]=-1;
    const L=a.body.length;
    G.movers.push({a,mode:'exit',t:0,v:9,path:pathFor(a,free+L+3),end:free+L+1,edge:free+.5,burst:false});
    const now=performance.now();G.combo=(now-G.lastClear<1100)?G.combo+1:1;G.lastClear=now;
    if(G.combo>=3)showCombo(G.combo);
    G.left--;sfx.go(G.combo);buzz(8);
    if(G.hintId===a.id)G.hintId=-1;
    updateHud();
  }else{
    G.movers.push({a,mode:'bump',t:0,phase:0,target:free+.32,path:pathFor(a,free+1),blocker});
    G.lives--;G.mistakes++;G.shake=1;G.flash.set(blocker,1);G.flash.set(a.id,1);
    G.combo=0;sfx.bump();buzz([30,40,30]);renderHearts(true);
  }
}

function useHint(){
  if(!G||G.done)return;
  if(G.hints<=0){
    if(window.AdKit)AdKit.offer({title:t('noHintT'),text:t('noHintX'),reward:t('hints2'),button:t('watchAd'),decline:t('noThanks')})
      .then(ok=>{if(ok&&G&&!G.done){G.hints+=2;updateHud();toast(t('hints2Added'),1800)}});
    return;
  }
  // en uzun bekleyen yerine, şu an çıkabilen ve en fazla oku serbest bırakan oku seç
  let best=-1,score=-1;
  for(const a of G.arrows){
    if(!a.alive||G.movers.some(m=>m.a===a))continue;
    if(rayInfo(a).blocker!==-1)continue;
    let s=0;for(const b of G.arrows)if(b.alive&&b!==a&&rayInfo(b).blocker===a.id)s++;
    if(s>score){score=s;best=a.id}
  }
  if(best<0)return;
  G.hints--;G.hintId=best;G.hintT=performance.now();sfx.hint();updateHud();
  const[hx,hy]=G.arrows[best].body.at(-1);if(playS>fitS*1.05)goCam(Math.max(cam.s,playS),hx+.5,hy+.5);
}

/* ---------- HUD ---------- */
const heartSvg=c=>`<svg viewBox="0 0 24 24" class="${c}"><path d="M12 21s-7.5-4.6-9.6-9.3C1 8.4 3 5 6.5 5c2 0 3.3 1 4.1 2.2h2.8C14.2 6 15.5 5 17.5 5 21 5 23 8.4 21.6 11.7 19.5 16.4 12 21 12 21z"/></svg>`;
function renderHearts(lost){
  let h='';for(let i=0;i<G.maxLives;i++)h+=heartSvg(i<G.lives?'on':'off'+(lost&&i===G.lives?' lost':''));
  $('hearts').innerHTML=h;
}
function updateHud(){
  $('left').textContent=G.left;
  $('hintCount').textContent=G.hints;
  $('hintBtn').disabled=false;$('hintBtn').style.opacity=G.hints>0?1:.7;
  $('prog').style.width=(100*(G.total-G.left)/Math.max(1,G.total))+'%';
}
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
let comboTimer;
function showCombo(c){const el=$('combo');el.textContent=t('combo',{n:c});el.style.opacity=1;clearTimeout(comboTimer);comboTimer=setTimeout(()=>el.style.opacity=0,700)}
let toastTimer;
function toast(msg,ms){const t=$('toast');t.textContent=msg;t.hidden=false;t.style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.style.opacity=0;setTimeout(()=>t.hidden=true,400)},ms)}

/* ---------- çizim + kamera ----------
   Küçük tahtalar ekrana tam sığar. Tahta büyüyünce kamera önce tamamını
   gösterir, sonra oynanabilir yakınlığa iner; sürükleyip kaydırılır,
   iki parmakla / tekerlekle yakınlaştırılır. */
const cv=$('cv'),ctx=cv.getContext('2d');
let W=0,H=0,cs=20,ox=0,oy=0,dpr=1;
const PLAY=26;                    // rahat dokunma için en küçük hücre boyu (px)
const cam={s:20,x:0,y:0},camT={s:20,x:0,y:0};let camAnim=false;
let fitS=20,playS=26,maxS=60;
function resize(){
  const r=$('stage').getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,3);
  W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;
  if(!G)return;
  fitS=Math.min((W-16)/G.cols,(H-16)/G.rows);
  playS=Math.max(fitS,PLAY);maxS=Math.max(fitS*1.6,56);
  clampCam(cam);clampCam(camT);updateZoomBtn();
}
addEventListener('resize',resize);
function clampCam(c){
  c.s=Math.max(fitS,Math.min(maxS,c.s));
  const hw=W/2/c.s,hh=H/2/c.s,m=.8;
  c.x=G.cols<=2*hw-.2?G.cols/2:Math.max(hw-m,Math.min(G.cols-hw+m,c.x));
  c.y=G.rows<=2*hh-.2?G.rows/2:Math.max(hh-m,Math.min(G.rows-hh+m,c.y));
}
function goCam(s,x,y){camT.s=s;camT.x=x;camT.y=y;clampCam(camT);camAnim=true}
function introCam(){
  resize();
  cam.s=fitS;cam.x=G.cols/2;cam.y=G.rows/2;camT.s=cam.s;camT.x=cam.x;camT.y=cam.y;camAnim=false;
  if(playS>fitS*1.05){ // büyük tahta: önce bütün tabloyu göster, sonra yaklaş
    setTimeout(()=>{if(G)goCam(playS,G.cols/2,G.rows/2)},900);
    if(!save.zoomTip){save.zoomTip=1;persist();toast(t('zoomTip'),5200)}
  }
  updateZoomBtn();
}
function updateZoomBtn(){const b=$('zoomBtn');if(b)b.hidden=!G||playS<=fitS*1.05}
function toggleZoom(){
  if(!G)return;
  if(cam.s>fitS*1.08)goCam(fitS,G.cols/2,G.rows/2);
  else goCam(playS,cam.x,cam.y);
}
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let C={};
function readColors(){C={ink:css('--ink'),dot:css('--dot'),accent:css('--accent'),danger:css('--danger'),ok:css('--ok'),gold:css('--gold'),paper:css('--paper'),muted:css('--muted'),d:[css('--d0'),css('--d1'),css('--d2'),css('--d3')]}}
readColors();
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readColors)}catch(e){}
new MutationObserver(readColors).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

const px=(x,y)=>[ox+(x+.5)*cs,oy+(y+.5)*cs];
function sample(P,s){
  s=Math.max(0,Math.min(P.length-1.0001,s));const i=Math.floor(s),f=s-i;
  return[P[i][0]+(P[i+1][0]-P[i][0])*f,P[i][1]+(P[i+1][1]-P[i][1])*f,P[i+1][0]-P[i][0],P[i+1][1]-P[i][1]];
}
function drawArrow(P,t,L,color,width){
  const e=t+L-1,pts=[sample(P,t)];
  for(let k=Math.ceil(t+1e-6);k<e;k++)pts.push(P[k]);
  const end=sample(P,e);pts.push(end);
  ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();pts.forEach((p,i)=>{const[X,Y]=px(p[0],p[1]);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)});ctx.stroke();
  const[ex,ey]=px(end[0],end[1]),dx=end[2],dy=end[3];
  const tip=cs*.34,back=cs*.08,wing=cs*.24;
  ctx.beginPath();
  ctx.moveTo(ex+dx*tip,ey+dy*tip);
  ctx.lineTo(ex-dx*back-dy*wing,ey-dy*back+dx*wing);
  ctx.lineTo(ex-dx*back+dy*wing,ey-dy*back-dx*wing);
  ctx.closePath();ctx.fill();
}
function colorFor(a){return save.color?C.d[a.dir]:C.ink}
function staticPath(a){return a.p1||(a.p1=pathFor(a,1))}
function bbox(a){
  if(a.bb)return a.bb;let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const[x,y]of staticPath(a)){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}
  return a.bb=[x0,y0,x1,y1];
}

// mini harita (yalnızca yakınlaştırılmışken)
let mini=null;
function drawMini(){
  mini=null;if(cam.s<=fitS*1.08)return;
  const mw=Math.min(84,W*.24),ms=mw/G.cols,mh=G.rows*ms,mx=W-mw-10,my=10;
  mini={x:mx,y:my,w:mw,h:mh,s:ms};
  ctx.globalAlpha=.92;ctx.fillStyle=C.paper;ctx.strokeStyle=C.dot;ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect?ctx.roundRect(mx-4,my-4,mw+8,mh+8,8):ctx.rect(mx-4,my-4,mw+8,mh+8);ctx.fill();ctx.stroke();
  ctx.fillStyle=C.muted;
  for(let y=0;y<G.rows;y++)for(let x=0;x<G.cols;x++)if(G.occ[y*G.cols+x]!==-1)ctx.fillRect(mx+x*ms,my+y*ms,ms+.3,ms+.3);
  if(G.hintId>=0&&G.arrows[G.hintId].alive){const[hx,hy]=G.arrows[G.hintId].body.at(-1);ctx.fillStyle=C.accent;ctx.beginPath();ctx.arc(mx+(hx+.5)*ms,my+(hy+.5)*ms,3,0,7);ctx.fill()}
  const vx=(cam.x-W/2/cam.s)*ms,vy=(cam.y-H/2/cam.s)*ms;
  ctx.strokeStyle=C.accent;ctx.lineWidth=1.5;ctx.strokeRect(mx+vx,my+vy,W/cam.s*ms,H/cam.s*ms);
  ctx.globalAlpha=1;
}

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  if(G){
    if(!G.done)G.elapsed=(now-G.t0)/1000;
    $('time').textContent=fmt(G.elapsed);
    if(camAnim){
      const k=1-Math.exp(-dt*7);
      cam.s+=(camT.s-cam.s)*k;cam.x+=(camT.x-cam.x)*k;cam.y+=(camT.y-cam.y)*k;
      if(Math.abs(camT.s-cam.s)<.01&&Math.abs(camT.x-cam.x)<.005&&Math.abs(camT.y-cam.y)<.005){Object.assign(cam,camT);camAnim=false}
    }
    cs=cam.s;ox=W/2-cam.x*cs;oy=H/2-cam.y*cs;
    let sx=0;if(G.shake>0){sx=Math.sin(now/22)*6*G.shake;G.shake=Math.max(0,G.shake-dt*3)}
    ctx.save();ctx.translate(sx,0);
    // görünen alan (hücre)
    const vx0=Math.max(0,Math.floor(-ox/cs)-1),vy0=Math.max(0,Math.floor(-oy/cs)-1);
    const vx1=Math.min(G.cols-1,Math.ceil((W-ox)/cs)),vy1=Math.min(G.rows-1,Math.ceil((H-oy)/cs));
    // noktalar
    ctx.fillStyle=C.dot;const rd=Math.max(1,cs*.07);
    for(let y=vy0;y<=vy1;y++)for(let x=vx0;x<=vx1;x++){
      if(G.occ[y*G.cols+x]!==-1)continue;const[X,Y]=px(x,y);
      if(cs<10)ctx.fillRect(X-rd,Y-rd,rd*2,rd*2);else{ctx.beginPath();ctx.arc(X,Y,rd,0,7);ctx.fill()}
    }
    const lw=Math.max(1.6,cs*.15);
    const moving=new Set(G.movers.map(m=>m.a));
    if(G.hintId>=0){
      const a=G.arrows[G.hintId],k=(now-G.hintT)/1000;
      if(a.alive&&!moving.has(a)){
        ctx.globalAlpha=.25+.2*Math.sin(k*7);drawArrow(staticPath(a),0,a.body.length,C.accent,lw*3.2);ctx.globalAlpha=1;
      }
    }
    for(const a of G.arrows){
      if(!a.alive||moving.has(a))continue;
      const b=bbox(a);if(b[2]<vx0-1||b[0]>vx1+1||b[3]<vy0-1||b[1]>vy1+1)continue;
      let col=colorFor(a);
      if(G.flash.get(a.id))col=C.danger;
      if(G.hintId===a.id)col=C.accent;
      drawArrow(staticPath(a),0,a.body.length,col,lw);
    }
    for(const[id,v]of G.flash){const nv=v-dt*1.4;nv<=0?G.flash.delete(id):G.flash.set(id,nv)}
    for(let i=G.movers.length-1;i>=0;i--){
      const m=G.movers[i],L=m.a.body.length;
      if(m.mode==='exit'){
        m.v=Math.min(m.v+dt*90,46);m.t+=m.v*dt;
        if(!m.burst&&m.t>=m.edge){m.burst=true;const h=sample(m.path,m.edge+L-1);burst(h[0],h[1],colorFor(m.a))}
        if(m.t>=m.end){G.movers.splice(i,1);continue}
        drawArrow(m.path,m.t,L,colorFor(m.a),lw);
      }else{
        if(m.phase===0){m.t+=dt*18;if(m.t>=m.target){m.t=m.target;m.phase=1}}
        else{m.t-=dt*10;if(m.t<=0){G.movers.splice(i,1);if(G.lives<=0)lose();continue}}
        drawArrow(m.path,m.t,L,C.danger,lw);
      }
    }
    for(let i=G.parts.length-1;i>=0;i--){
      const p=G.parts[i];p.life-=dt*1.8;if(p.life<=0){G.parts.splice(i,1);continue}
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.92;p.vy*=.92;
      const[X,Y]=px(p.x,p.y);
      ctx.globalAlpha=p.life;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(X,Y,p.r*p.life*Math.min(1.4,cs/24),0,7);ctx.fill();
    }
    ctx.globalAlpha=1;ctx.restore();
    drawMini();
    if(!G.done&&G.left===0&&G.movers.length===0)win();
  }
  requestAnimationFrame(frame);
}
function burst(cx,cy,c){ // parçacıklar hücre biriminde tutulur, kamerayla birlikte kayar
  const X=Math.max(-.5,Math.min(G.cols-.5,cx)),Y=Math.max(-.5,Math.min(G.rows-.5,cy));
  for(let i=0;i<10;i++){const an=Math.random()*6.28,s=2.5+Math.random()*6;
    G.parts.push({x:X,y:Y,vx:Math.cos(an)*s,vy:Math.sin(an)*s,r:2+Math.random()*3,life:1,c:Math.random()<.5?c:C.accent})}
}

/* ---------- dokunma, kaydırma, yakınlaştırma ---------- */
const ptrs=new Map();let gesture=null;
function local(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
function zoomAt(mx,my,ns){
  ns=Math.max(fitS,Math.min(maxS,ns));
  const wx=(mx-ox)/cs,wy=(my-oy)/cs;     // imlecin altındaki dünya noktası sabit kalır
  cam.s=ns;cam.x=wx-(mx-W/2)/ns;cam.y=wy-(my-H/2)/ns;clampCam(cam);
  camAnim=false;cs=cam.s;ox=W/2-cam.x*cs;oy=H/2-cam.y*cs;
}
cv.addEventListener('pointerdown',e=>{
  if(!G)return;
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  const p=local(e);ptrs.set(e.pointerId,{x:p[0],y:p[1],sx:p[0],sy:p[1]});
  if(ptrs.size===1)gesture={type:'tap',moved:0};
  else if(ptrs.size===2){const[a,b]=[...ptrs.values()];gesture={type:'pinch',d:Math.hypot(a.x-b.x,a.y-b.y),s:cam.s}}
});
cv.addEventListener('pointermove',e=>{
  const q=ptrs.get(e.pointerId);if(!q||!G)return;
  const p=local(e),dx=p[0]-q.x,dy=p[1]-q.y;q.x=p[0];q.y=p[1];
  if(gesture&&gesture.type==='pinch'&&ptrs.size>=2){
    const[a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y);
    zoomAt((a.x+b.x)/2,(a.y+b.y)/2,gesture.s*d/gesture.d);
    cam.x-=dx/2/cam.s;cam.y-=dy/2/cam.s;clampCam(cam);
  }else if(gesture){
    gesture.moved+=Math.abs(dx)+Math.abs(dy);
    if(gesture.moved>10)gesture.type='pan';
    if(gesture.type==='pan'){camAnim=false;cam.x-=dx/cam.s;cam.y-=dy/cam.s;clampCam(cam)}
  }
});
function endPtr(e){
  const q=ptrs.get(e.pointerId);if(!q)return;ptrs.delete(e.pointerId);
  if(gesture&&gesture.type==='tap'&&ptrs.size===0)tapAt(q.x,q.y);
  if(ptrs.size===0)gesture=null;
  else if(gesture&&gesture.type==='pinch')gesture={type:'pan',moved:99};
}
cv.addEventListener('pointerup',endPtr);
cv.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);if(!ptrs.size)gesture=null});
cv.addEventListener('wheel',e=>{
  if(!G)return;e.preventDefault();const[mx,my]=local(e);
  zoomAt(mx,my,cam.s*Math.exp(-e.deltaY*.0015));
},{passive:false});
cv.addEventListener('dblclick',e=>{e.preventDefault()});
function tapAt(mx,my){
  if(!G||G.done)return;
  if(mini&&mx>=mini.x-4&&mx<=mini.x+mini.w+4&&my>=mini.y-4&&my<=mini.y+mini.h+4){
    goCam(cam.s,(mx-mini.x)/mini.s,(my-mini.y)/mini.s);return;
  }
  const gx=(mx-ox)/cs-.5,gy=(my-oy)/cs-.5;
  let best=null,bd=Math.max(.8,14/cs);         // çok uzaktan bakarken dokunma alanı büyür
  const R=Math.ceil(bd);
  for(let y=Math.round(gy)-R;y<=Math.round(gy)+R;y++)for(let x=Math.round(gx)-R;x<=Math.round(gx)+R;x++){
    if(x<0||y<0||x>=G.cols||y>=G.rows)continue;const o=G.occ[y*G.cols+x];if(o===-1)continue;
    const d=Math.hypot(x-gx,y-gy);if(d<bd){bd=d;best=G.arrows[o]}
  }
  if(best)tap(best);
}

/* ---------- ekranlar ---------- */
const starSvg=on=>`<svg viewBox="0 0 24 24" class="${on?'on':''}"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.2 1.3-6.6L2.5 9.3l6.6-.8z"/></svg>`;
function openOverlay(html){$('card').innerHTML=html;$('ovl').hidden=false}
function closeOverlay(){$('ovl').hidden=true}
function win(){
  G.done=true;const s=Math.max(1,3-G.mistakes);
  save.stars[G.n]=Math.max(save.stars[G.n]||0,s);
  const prevBest=save.best[G.n];if(!prevBest||G.elapsed<prevBest)save.best[G.n]=Math.round(G.elapsed);
  save.unlocked=Math.max(save.unlocked,Math.min(MAX_LEVEL,G.n+1));persist();sfx.win();
  const last=G.n>=MAX_LEVEL;
  setTimeout(()=>openOverlay(`
    <div class="stars">${[0,1,2].map(i=>starSvg(i<s)).join('')}</div>
    <h2>${last?t('allDone'):t('clear')}</h2>
    <p>${t('arrowsN',{n:G.total})} · ${fmt(G.elapsed)} · ${G.mistakes?t('crashesN',{n:G.mistakes}):t('flawless')}${prevBest&&G.elapsed<prevBest?' · '+t('newBest'):''}</p>
    <div class="row">
      <button class="btn" data-act="retry">${t('playAgain')}</button>
      ${last?'':'<button class="btn solid" data-act="next">'+t('nextLevel')+'</button>'}
    </div>`),450);
}
function lose(){
  if(G.done)return;G.done=true;sfx.lose();
  if(window.AdKit&&!G.revived&&G.left>0){
    G.revived=true;
    AdKit.offer({title:t('outLives'),text:t('reviveX',{a:G.total-G.left,b:G.total}),reward:t('reviveR'),button:t('reviveB'),decline:t('noThanks'),timeout:8})
      .then(ok=>{if(ok){G.done=false;G.lives=1;renderHearts();toast(t('revived'),1800)}else loseCard()});
    return;
  }
  loseCard();
}
function loseCard(){
  openOverlay(`<h2>${t('outLives')}</h2><p>${t('loseX',{a:G.total-G.left,b:G.total})}</p>
    <div class="row"><button class="btn" data-act="levels">${t('a_levels')}</button><button class="btn solid" data-act="retry">${t('tryAgain')}</button></div>`);
}
function levels(){
  let h='<h2>'+t('a_levels')+'</h2>';
  for(let t=0;t<TIERS.length;t++){
    const from=TIERS[t][0],to=t+1<TIERS.length?TIERS[t+1][0]-1:MAX_LEVEL;
    h+=`<div class="sect${isDark(TIERS[t][1])?' kabus':''}">${TIERS[t][1]} · ${from}–${to}</div><div class="grid">`;
    for(let n=from;n<=to;n++){const st=save.stars[n]||0,lock=n>save.unlocked;
      h+=`<button class="lv${G&&G.n===n?' cur':''}" data-lv="${n}" ${lock?'disabled':''}>${n}<small>${st?'★'.repeat(st):(lock?'':'·')}</small></button>`}
    h+='</div>';
  }
  h+=`<div class="sect">${t('settings')}</div><div class="toggles">
    <button class="lang" data-act="langs"><b>🌐 ${t('language')}</b><span>${SG_LANG_NAMES[SG_LANG]} ›</span></button>
    <label for="optSound">${t('sound')} <input type="checkbox" id="optSound" ${save.sound?'checked':''}></label>
    <label for="optColor">${t('colorArrows')} <input type="checkbox" id="optColor" ${save.color?'checked':''}></label></div>
    <button class="btn solid" data-act="close">${t('backToGame')}</button>`;
  openOverlay(h);
}
function langList(){
  let h=`<h2>🌐 ${t('language')}</h2><div class="langs">`;
  for(const c of SG_LANGS)h+=`<button class="btn${c===SG_LANG?' cur':''}" data-lang="${c}" lang="${c}">${SG_LANG_NAMES[c]}</button>`;
  h+=`</div><button class="btn solid" data-act="levels">${t('back')}</button>`;
  openOverlay(h);
}
$('card').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.lang){if(b.dataset.lang===SG_LANG)levels();else{persist();SG_setLang(b.dataset.lang)}return}
  if(b.dataset.act==='langs'){langList();return}
  if(b.dataset.lv)start(+b.dataset.lv);
  else if(b.dataset.act==='retry')start(G.n);
  else if(b.dataset.act==='next'){const nx=G.n+1;
    if(window.AdKit){closeOverlay();AdKit.levelDone({reward:t('hint1'),title:t('lvlBonus')}).then(ok=>{start(nx);if(ok){G.hints++;updateHud();toast(t('bonusHint'),1800)}})}else start(nx);}
  else if(b.dataset.act==='levels')levels();
  else if(b.dataset.act==='close'){closeOverlay();if(G&&G.done&&G.lives<=0)start(G.n)}
});
$('card').addEventListener('change',e=>{
  if(e.target.id==='optSound')save.sound=e.target.checked;
  if(e.target.id==='optColor')save.color=e.target.checked;persist();
});
$('menuBtn').onclick=levels;
$('hintBtn').onclick=useHint;
$('zoomBtn').onclick=toggleZoom;
$('restartBtn').onclick=()=>G&&start(G.n);

start(Math.min(save.level||1,save.unlocked));
requestAnimationFrame(frame);
})();
</script>

</body></html>
