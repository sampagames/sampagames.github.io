<style>
[hidden]{display:none!important}
/* Layout: full-screen 3D city, chunky toy-like HUD floating over it; menu and results as overlays */
:root{
  --blue:#2f6bff; --blue-d:#1a3c9e; --ink:#0f1830; --white:#ffffff; --yellow:#ffd23f; --yellow-d:#c99a00;
  --pink:#ff3d7f; --muted:#56658a; --glass:rgba(15,24,48,.55);
  --display:"Lilita One","Arial Black",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:#3f7bff;color:var(--ink);font-family:var(--body);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;z-index:0}
#stage canvas{display:block;width:100%;height:100%}
button{font-family:var(--body);cursor:pointer}
button:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

/* HUD */
#hud{position:fixed;inset:0;z-index:1;pointer-events:none}
.hud-top{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px}
.me{justify-self:start;display:flex;align-items:center;gap:8px;background:var(--glass);border-radius:14px;padding:6px 12px 6px 6px;color:#fff}
.me-rank{font-family:var(--display);font-size:22px;background:var(--pink);border-radius:10px;padding:2px 9px;line-height:1.2}
.me-pts{font-weight:900;font-size:18px;font-variant-numeric:tabular-nums}
.me-pts small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.75;font-weight:800}
.timer{font-family:var(--display);font-size:30px;color:#fff;background:var(--glass);border-radius:16px;padding:4px 16px;
  font-variant-numeric:tabular-nums;letter-spacing:.02em}
.timer.low{background:#e0263f;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.board{justify-self:end;list-style:none;margin:0;padding:6px 8px;background:var(--glass);border-radius:14px;color:#fff;
  font-size:12px;font-weight:800;min-width:118px;display:grid;gap:2px}
.board li{display:grid;grid-template-columns:14px 10px 1fr auto;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.board li.me-row{color:var(--yellow)}
.board .dot{width:10px;height:10px;border-radius:50%}
.board .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70px}
.lvl{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
  display:flex;align-items:center;gap:10px;background:var(--glass);padding:6px 14px 6px 8px;border-radius:999px;color:#fff}
.lvl b{font-family:var(--display);font-weight:400;font-size:18px;background:var(--blue);padding:2px 10px;border-radius:999px}
.bar{width:min(46vw,220px);height:12px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--yellow),#ffef8a);border-radius:999px;transition:width .2s}
#labels{position:absolute;inset:0;overflow:hidden}
.tag{position:absolute;left:0;top:0;white-space:nowrap;font-weight:900;font-size:13px;color:#fff;padding:2px 9px;border-radius:999px;
  text-shadow:0 1px 0 rgba(0,0,0,.25);will-change:transform;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.tag .lv{opacity:.85;font-size:11px;margin-left:4px}
.tag.lead::before{content:"";display:inline-block;width:10px;height:7px;margin-right:5px;background:var(--yellow);
  clip-path:polygon(0 100%,0 20%,25% 60%,50% 0,75% 60%,100% 20%,100% 100%)}
.pop{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-family:var(--display);font-size:30px;color:var(--yellow);
  -webkit-text-stroke:2px var(--ink);paint-order:stroke fill;opacity:0;pointer-events:none}
.pop.go{animation:popup .7s ease-out}
@keyframes popup{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-60%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-140%) scale(1)}}
.msg{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);text-align:center;font-family:var(--display);color:#fff;
  font-size:clamp(28px,8vw,48px);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;line-height:1.05;width:90%;text-wrap:balance}
.msg small{display:block;font-family:var(--body);font-weight:900;font-size:16px;-webkit-text-stroke:0;margin-top:8px;text-shadow:0 2px 0 var(--ink)}
.joy{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:3px solid rgba(255,255,255,.5);
  background:rgba(255,255,255,.12);display:none}
.joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.8)}

/* Screens */
.screen{position:fixed;inset:0;z-index:2;overflow-y:auto;display:flex;flex-direction:column;align-items:center;
  padding-block:calc(env(safe-area-inset-top,0px) + 18px) calc(env(safe-area-inset-bottom,0px) + 24px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,rgba(47,107,255,.92) 0%,rgba(47,107,255,.55) 45%,rgba(20,40,110,.82) 100%);box-sizing:border-box;touch-action:pan-y}
.langs{align-self:flex-end;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.langs{align-items:center;gap:6px;background:rgba(255,255,255,.22);border-radius:12px;padding:4px 6px 4px 10px;color:#fff;font-size:16px}
.langs select{border:0;border-radius:9px;padding:6px 8px;font:900 14px var(--body);background:#fff;color:var(--blue-d);max-width:170px}
.logo-wrap{position:relative;margin-top:6px;display:grid;place-items:center}
.logo-hole{width:min(62vw,250px);aspect-ratio:2.4/1;border-radius:50%;background:radial-gradient(ellipse at 50% 35%,#24304f 0%,#05070d 70%);
  box-shadow:0 0 0 10px var(--pink),0 0 0 16px rgba(0,0,0,.18);max-width:100%}
.logo{margin:-36px 0 0;font-family:var(--display);font-weight:400;font-size:clamp(52px,16vw,88px);line-height:.88;color:#fff;text-align:center;
  letter-spacing:.01em;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 7px 0 var(--ink);transform:rotate(-3deg)}
.logo span{color:var(--yellow)}
.tagline{margin:14px 0 0;color:#fff;font-weight:900;font-size:17px;text-align:center;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.screen h2{margin:22px 0 10px;font-family:var(--display);font-weight:400;color:#fff;font-size:24px;letter-spacing:.02em;
  -webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);text-transform:uppercase}
.maps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:480px}
.map{border:0;padding:6px 6px 10px;border-radius:18px;background:#fff;box-shadow:0 5px 0 var(--blue-d);display:flex;flex-direction:column;
  align-items:stretch;gap:6px;transition:transform .15s;min-width:0}
.map canvas{width:100%;aspect-ratio:1;border-radius:13px;display:block;filter:grayscale(.85) brightness(1.05)}
.map b{font-family:var(--display);font-weight:400;font-size:17px;color:var(--ink);line-height:1.1}
.map small{font-weight:800;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.map.on{transform:translateY(-4px);box-shadow:0 0 0 4px var(--yellow),0 9px 0 var(--blue-d)}
.map.on canvas{filter:none}
.play{margin-top:22px;border:0;border-radius:22px;background:var(--yellow);color:var(--ink);font-family:var(--display);font-size:36px;
  padding:10px 0;width:min(100%,340px);box-shadow:0 7px 0 var(--yellow-d),0 12px 20px rgba(0,0,0,.25);letter-spacing:.04em}
.play:active{transform:translateY(5px);box-shadow:0 2px 0 var(--yellow-d)}
.hint{max-width:340px;text-align:center;color:#e8efff;font-weight:800;font-size:14px;line-height:1.45;margin:16px 0 0}
.card{margin-top:auto;margin-bottom:auto;background:#fff;border-radius:24px;padding:20px 18px;width:100%;max-width:380px;
  box-shadow:0 8px 0 var(--blue-d);text-align:center;box-sizing:border-box}
.card h3{margin:0;font-family:var(--display);font-weight:400;font-size:34px;color:var(--ink)}
.place{font-family:var(--display);font-size:22px;color:var(--pink);margin-top:2px}
.newbest{display:inline-block;margin-top:8px;background:var(--yellow);border-radius:999px;padding:3px 12px;font-weight:900;font-size:13px}
.res{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:6px;text-align:left}
.res li{display:grid;grid-template-columns:22px 14px 1fr auto auto;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:#eef2fb;
  font-weight:800;font-variant-numeric:tabular-nums}
.res li.me-row{background:#ffe9f0;box-shadow:inset 0 0 0 2px var(--pink)}
.res .dot{width:12px;height:12px;border-radius:50%}
.res .lv{color:var(--muted);font-size:12px}
.btns{display:grid;gap:10px;margin-top:18px}
.btns .play{margin:0;width:100%;font-size:26px}
.ghost{border:0;background:transparent;color:var(--blue);font-weight:900;font-size:16px;padding:8px}
.missions{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 66px);display:flex;justify-content:center;flex-wrap:wrap;gap:6px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.chip{display:flex;align-items:center;gap:5px;background:var(--glass);color:#fff;border-radius:999px;padding:5px 11px;font-weight:900;font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums;transition:background .3s,transform .3s}
.chip .st{width:13px;height:13px;background:rgba(255,255,255,.45);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.chip.done{background:var(--yellow);color:var(--ink);transform:scale(1.06)}.chip.done .st{background:var(--ink)}
.chip.fail{opacity:.5;text-decoration:line-through}
.combo{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);font-family:var(--display);font-size:26px;color:#fff;-webkit-text-stroke:2px var(--pink);paint-order:stroke fill;opacity:0;transition:opacity .2s;white-space:nowrap}
.combo.on{opacity:1}
.frenzy-on .timer{background:linear-gradient(90deg,#ff3d7f,#ffb020);animation:pulse .5s infinite}
.lmtag{position:absolute;left:0;top:0;white-space:nowrap;font-weight:900;font-size:12px;color:var(--ink);background:var(--yellow);padding:3px 10px;border-radius:999px;box-shadow:0 2px 0 var(--yellow-d);will-change:transform}
.lmarrow{position:absolute;left:0;top:0;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--yellow);box-shadow:0 3px 0 var(--yellow-d),0 0 0 4px rgba(255,210,63,.35);display:grid;place-items:center;will-change:transform}
.lmarrow i{position:absolute;inset:0}
.lmarrow i::after{content:"";position:absolute;left:50%;top:-9px;margin-left:-8px;border:8px solid transparent;border-bottom:11px solid var(--yellow);border-top:0}
.lmarrow b{font-size:11px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums}
.stars{display:flex;justify-content:center;gap:8px;margin:10px 0 2px}
.stars span{width:46px;height:46px;background:#dfe5f2;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.stars span.on{background:var(--yellow);animation:starpop .5s backwards}
.stars span.on:nth-child(2){animation-delay:.25s}.stars span.on:nth-child(3){animation-delay:.5s}
@keyframes starpop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.mlist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:5px;text-align:left;font-weight:800;font-size:14px}
.mlist li{display:flex;gap:8px;align-items:center;padding:6px 10px;border-radius:10px;background:#eef2fb;color:var(--muted)}
.mlist li.ok{background:#fff6d6;color:var(--ink)}
.mlist li::before{content:"";width:14px;height:14px;flex:none;background:#c5cde0;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.mlist li.ok::before{background:var(--yellow-d)}
.unlock{margin-top:10px;background:linear-gradient(90deg,#2f6bff,#7a5cff);color:#fff;border-radius:12px;padding:8px 12px;font-weight:900;font-size:14px}
.totstars{display:inline-flex;align-items:center;gap:6px;background:rgba(15,24,48,.35);color:#fff;border-radius:999px;padding:4px 12px;font-weight:900;font-size:15px;margin-top:10px}
.totstars i{width:16px;height:16px;background:var(--yellow);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.map .mstars{display:flex;justify-content:center;gap:2px}
.map .mstars i{width:12px;height:12px;background:#d5dbe8;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.map .mstars i.on{background:var(--yellow-d)}
.map.locked{background:#c9d2e6;cursor:not-allowed}
.map.locked canvas{filter:grayscale(1) brightness(.6)}
.map .lock{display:none}
.map.locked .lock{display:flex;align-items:center;justify-content:center;gap:4px;font-weight:900;font-size:12px;color:var(--ink)}
.map.locked .mstars,.map.locked small.bst{display:none}
.skins{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:480px}
.skin{width:44px;height:44px;border-radius:50%;border:0;padding:0;position:relative;box-shadow:inset 0 0 0 7px var(--c),inset 0 0 0 30px #101626,0 4px 0 var(--blue-d)}

.skin.locked{opacity:.55;cursor:not-allowed}
.skin small{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:900;font-size:11px}
.goal{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 112px);transform:translateX(-50%);width:min(88%,340px);background:rgba(15,24,48,.82);color:#fff;border-radius:20px;padding:14px 16px;text-align:center;box-shadow:0 0 0 3px var(--yellow)}
.goal b{display:block;font-family:var(--display);font-weight:400;font-size:24px;color:var(--yellow);letter-spacing:.02em}
.goal p{margin:6px 0 0;font-weight:800;font-size:14px;line-height:1.4}
</style>

function layoutFor(key){
  const th=THEMES[key],r=rng(th.seed),w=th.weights,tot=Object.values(w).reduce((a,b)=>a+b,0),types=[];
  for(let i=0;i<N*N;i++){let x=r()*tot;for(const k in w){x-=w[k];if(x<=0){types.push(k);break;}}if(types.length<=i)types.push("tower");}
  types[LMI*N+LMJ]="landmark";

}

function paintGround(ctx,th,types,px){
  const k=px/(S+2*MG),X=v=>(v+HALF+MG)*k;
  const rect=(x,z,w,d,c)=>{ctx.fillStyle=c;ctx.fillRect(X(x),X(z),w*k,d*k);};
  rect(-HALF-MG,-HALF-MG,S+2*MG,S+2*MG,th.border);
  rect(-HALF-th.edgeW,-HALF-th.edgeW,S+2*th.edgeW,S+2*th.edgeW,th.edge);
  rect(-HALF,-HALF,S,S,th.road);
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){
    const x0=blockStart(i),z0=blockStart(j),ty=types[i*N+j];
    rect(x0,z0,B,B,th.side);
    const c=ty==="park"?th.grass:ty==="plaza"?th.plaza:ty==="tower"?th.lot:ty==="field"?th.soil:ty==="farm"?th.lot:th.lawn;
    rect(x0+3,z0+3,B-6,B-6,c);
    if(ty==="field")for(let r=z0+4;r<z0+B-4;r+=2)rect(x0+3.5,r,B-7,.9,th.crop);
    if(ty==="park"&&th!==THEMES.beach){ctx.fillStyle=th.water;ctx.beginPath();ctx.arc(X(x0+B/2),X(z0+B/2),4*k,0,7);ctx.fill();}
  }
}

/* ---------- ground: crisp vector layers (no blurry texture) ---------- */
const GL_LAYERS=9;
function groundKit(){
  const layers=[];for(let i=0;i<GL_LAYERS;i++)layers.push({p:[],c:[]});
  const col=new THREE.Color();
  const tri=(l,ax,az,bx,bz,cx,cz,hex)=>{const L=layers[l];L.p.push(ax,0,az,bx,0,bz,cx,0,cz);col.set(hex);for(let i=0;i<3;i++)L.c.push(col.r,col.g,col.b);};
  return{layers,
    rect(l,x0,z0,x1,z1,hex){tri(l,x0,z0,x0,z1,x1,z0,hex);tri(l,x1,z0,x0,z1,x1,z1,hex);},
    circ(l,cx,cz,r,hex,seg=28){for(let i=0;i<seg;i++){const a=i/seg*PI*2,b=(i+1)/seg*PI*2;tri(l,cx,cz,cx+Math.cos(b)*r,cz+Math.sin(b)*r,cx+Math.cos(a)*r,cz+Math.sin(a)*r,hex);}}};
}
function groundMeshes(gk){
  gk.layers.forEach((L,i)=>{if(!L.p.length)return;
    const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(L.p,3));
    const nn=new Float32Array(L.p.length);for(let k=1;k<nn.length;k+=3)nn[k]=1;g.setAttribute("normal",new THREE.BufferAttribute(nn,3));
    g.setAttribute("color",new THREE.Float32BufferAttribute(L.c,3));g.computeBoundingSphere();
    const m=new THREE.MeshLambertMaterial({vertexColors:true,polygonOffset:i>0,polygonOffsetFactor:-i,polygonOffsetUnits:-i*3,
      stencilWrite:true,stencilRef:1,stencilFunc:THREE.NotEqualStencilFunc});
    const mesh=new THREE.Mesh(g,m);mesh.receiveShadow=true;mesh.renderOrder=1;mesh.userData.own=true;mesh.userData.ownMat=true;world.add(mesh);});
}

/* ---------- world build ---------- */

  mesh.position.set(x,0,z);mesh.rotation.y=rot;world.add(mesh);
  const ob={g:mesh,x,z,y:0,r:o.r,h:o.h,move,fall:null,dead:false,tall:o.h>2.6,faded:false,ph:R()*6};

function think(b){
  b.think=.3+Math.random()*.3;b.tObj=null;
  let fx=0,fz=0,threat=false;
  for(const h of holes){if(h===b||!h.alive)continue;const dx=b.x-h.x,dz=b.z-h.z,d=Math.hypot(dx,dz)||1;
    if(h.r>b.r*1.15&&d<h.r+12){fx+=dx/d/d;fz+=dz/d/d;threat=true;}}
  if(threat){b.tx=b.x+fx*1e3;b.tz=b.z+fz*1e3;return;}
  let best=null,bs=0;
  for(const h of holes){if(h!==b&&h.alive&&h.shield<=0&&b.r>h.r*1.25){const d=Math.hypot(h.x-b.x,h.z-b.z);if(d<32){const s=h.A*1.4/(d+4);if(s>bs){bs=s;best=h;}}}}
  for(let i=(Math.random()*3)|0;i<objs.length;i+=3){const o=objs[i];if(o.dead||o.fall||o.r>=b.r*.9)continue;
    const d=Math.hypot(o.x-b.x,o.z-b.z);if(d>45)continue;const s=o.r*o.r/(d+3);if(s>bs){bs=s;best=o;}}
  if(best){b.tObj=best;b.tx=best.x;b.tz=best.z;}
  else{b.tx=-HALF+10+Math.random()*(S-20);b.tz=-HALF+10+Math.random()*(S-20);}
}

  clock+=dt;
  for(const h of holes){
    if(!h.alive){h.respawn-=dt;if(h.isPlayer&&!msgEl.hidden&&h.respawn>0&&msgEl.lastChild)msgEl.lastChild.textContent=t("back",{s:Math.ceil(h.respawn)});
      if(h.respawn<=0){h.alive=true;h.g.visible=true;h.el.style.display="";h.shield=2.5;spawnSpot(h);if(h.isPlayer)msgT=0;}continue;}
    h.shield=Math.max(0,h.shield-dt);
    let dx,dz;
    if(h.isPlayer){[dx,dz]=inputDir();}
    else{h.think-=dt;if(h.think<=0)think(h);
      if(h.tObj){if(h.tObj.dead||h.tObj.fall||(h.tObj.alive===false))h.think=0;else{h.tx=h.tObj.x;h.tz=h.tObj.z;}}
      const ex=h.tx-h.x,ez=h.tz-h.z,L=Math.hypot(ex,ez);if(L<.6){h.think=0;dx=dz=0;}else{dx=ex/L;dz=ez/L;}}
    const spd=Math.min(20.5,8.2+h.r*.48)*(h.isPlayer?1:.86);
    h.x=Math.max(-HALF+.5,Math.min(HALF-.5,h.x+dx*spd*dt));h.z=Math.max(-HALF+.5,Math.min(HALF-.5,h.z+dz*spd*dt));
    h.rd+=(h.r-h.rd)*Math.min(1,dt*5);h.pulse*=Math.max(0,1-dt*6);
    const vr=h.rd*(1+h.pulse);
    h.g.position.set(h.x,0,h.z);h.g.scale.set(vr,1,vr);
    h.ring.visible=h.shield>0?(Math.floor(h.shield*8)%2===0):true;
  }
  if(landmarkObj&&landmarkObj.spin)landmarkObj.spin.rotation.z+=dt*.8;
  for(const o of objs){
    if(o.dead)continue;
    if(o.fall){const f=o.fall,h=f.h;let dx=o.x-h.x,dz=o.z-h.z;const k=1-Math.min(1,dt*2.2);dx*=k;dz*=k;
      const lim=Math.max(0,h.rd-o.r*.6),d=Math.hypot(dx,dz);if(d>lim&&d>0){dx*=lim/d;dz*=lim/d;}
      o.x=h.x+dx;o.z=h.z+dz;f.vy+=26*dt;o.y-=f.vy*dt;o.g.rotation.x+=f.ax*dt;o.g.rotation.z+=f.az*dt;
      o.g.position.set(o.x,o.y,o.z);
      if(o.y<-(o.h+8)){o.dead=true;world.remove(o.g);o.g.geometry.dispose();}continue;}
    const m=o.move;
    if(m){if(m.type==="drive"){const v=m.dir*m.spd*dt;if(m.axis==="x"){o.x+=v;if(o.x>HALF+3)o.x-=S+6;else if(o.x<-HALF-3)o.x+=S+6;}
        else{o.z+=v;if(o.z>HALF+3)o.z-=S+6;else if(o.z<-HALF-3)o.z+=S+6;}o.g.position.set(o.x,0,o.z);}
      else{m.t-=dt;if(m.t<0){m.t=1+Math.random()*2;m.ang+=(Math.random()-.5)*3;}
        if(Math.hypot(o.x-m.hx,o.z-m.hz)>m.rad)m.ang=Math.atan2(m.hz-o.z,m.hx-o.x);
        o.x+=Math.cos(m.ang)*m.spd*dt;o.z+=Math.sin(m.ang)*m.spd*dt;o.g.rotation.y=-m.ang+PI/2;
        o.g.position.set(o.x,Math.abs(Math.sin(clock*9+o.ph))*.08,o.z);}}
    if(state!=="play")continue;
    for(const h of holes){if(!h.alive||o.r>=h.r*.92)continue;const dx=o.x-h.x,dz=o.z-h.z;
      if(dx*dx+dz*dz<(h.r-o.r*.35)**2){capture(o,h);break;}}
  }
  if(state==="play")for(const a of holes)for(const b of holes){
    if(a===b||!a.alive||!b.alive||b.shield>0||a.r<=b.r*1.18)continue;
    if(Math.hypot(a.x-b.x,a.z-b.z)<a.r-b.r*.4)eatHole(a,b);}
}

// see-through: buildings between the camera and your hole turn translucent
function fadeOccluders(p,ch){
  const camD=ch*CAMK;
  for(const o of objs){if(!o.tall||o.dead||o.fall)continue;
    const dz=o.z-p.z,dx=Math.abs(o.x-p.x);
    const occ=p.alive&&dz>-o.r&&dz<camD+o.r&&dx<o.r+p.rd+.5&&o.h>(dz-o.r-p.rd)*ch/camD;
    if(occ!==o.faded){o.faded=occ;o.g.material=occ?FADE:MAT;}}
}

function updateLabels(){
  const W=innerWidth,H=innerHeight;
  for(const h of holes){if(!h.alive)continue;
    tmpV.set(h.x,0,h.z-h.rd*1.15-.4).project(camera);
    const x=(tmpV.x+1)/2*W,y=(1-tmpV.y)/2*H;
    h.el.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,-100%)`;
    const lab=(h.isPlayer?t("you"):h.name)+"|"+lvlOf(h.r)+"|"+(h.lead?1:0);
    if(lab!==h.lastLabel){h.lastLabel=lab;h.el.classList.toggle("lead",!!h.lead);h.el.innerHTML="";
      h.el.append(document.createTextNode(h.isPlayer?t("you"):h.name));const s=document.createElement("span");s.className="lv";s.textContent=lvlOf(h.r);h.el.append(s);}}
}

function frame(now){
  let dt=Math.min(.05,(now-last)/1000);last=now;
  if(paused){renderer.render(scene,camera);requestAnimationFrame(frame);return;}
  update(dt);
  if(state==="play"){
    const p=holes[0];
    timeLeft-=dt;const s=Math.max(0,Math.ceil(timeLeft));timerEl.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
    timerEl.classList.toggle("low",timeLeft<=10);
    const L=lvlOf(p.r);if(L>p.lvl){p.lvl=L;showMsg(t("levelUp",{l:L}),"",1.1);chord([660,880,1320]);}
    lvlNum.textContent=L;lvlBar.style.width=(((p.r-1.2)/.8)%1*100).toFixed(1)+"%";
    popT-=dt;if(popT<=0){popT=.35;flushPop();}
    comboT-=dt;const ce=$("combo");if(combo>=5&&comboT>0){ce.textContent=t("combo",{c:combo});ce.classList.add("on");}else{ce.classList.remove("on");if(comboT<=0)combo=0;}
    if(!frenzy&&timeLeft<=FRENZY){frenzy=true;document.body.classList.add("frenzy-on");showMsg(t("frenzy"),t("frenzySub"),1.8);chord([660,880,1100,1320]);}
    if(goalT>0){goalT-=dt;if(goalT<=0)$("goal").hidden=true;}
    misT-=dt;if(misT<=0){misT=.4;updateMissions();}
    if(p.rainbow){const c=new THREE.Color().setHSL((clock*.25)%1,.9,.58);p.ring.material.color.copy(c);p.xr.material.color.copy(c);p.el.style.background="#"+c.getHexString();}
    updateLandmarkUI(p);
    boardT-=dt;if(boardT<=0){boardT=.3;updateBoard();}
    if(msgT>0){msgT-=dt;if(msgT<=0)msgEl.hidden=true;}
    const hf=Math.tan(camera.fov*PI/360)*camera.aspect,want=21+p.rd*4.3;
    const ch=Math.max(18+p.rd*2.6,(want/2)/hf/Math.sqrt(1+CAMK*CAMK));
    camPos.lerp(tmpV.set(p.x,ch,p.z+ch*CAMK),Math.min(1,dt*3.5));
    camLook.lerp(tmpV.set(p.x,0,p.z-p.rd*.15),Math.min(1,dt*4.5));
    camera.position.copy(camPos);
    if(shake>0){shake=Math.max(0,shake-dt*2.5);camera.position.x+=(Math.random()-.5)*shake;camera.position.z+=(Math.random()-.5)*shake;}
    camera.lookAt(camLook);
    aimSun(camLook.x,camLook.z-ch*.25,ch*1.25+18);
    fadeOccluders(p,ch);
    updateLabels();
    if(timeLeft<=0){
      const done=(Math.round(ateArea/totalArea*100)>=PCT_GOAL?1:0)+(bossDone?1:0);
      if(hasAds()&&!extUsed&&done<2&&!bossLost&&AdKit.available()){extUsed=true;paused=true;timeLeft=0;
        AdKit.offer({title:t("extT"),text:t("extP"),button:t("extB"),reward:"+30s",placement:"extend"}).then(ok=>{paused=false;last=performance.now();if(ok){timeLeft=30;showMsg("+30s","",1.2);}else endGame();},()=>{paused=false;endGame();});}
      else endGame();}
  }else{
    menuAng+=dt*.06;camera.position.set(Math.cos(menuAng)*180,140,Math.sin(menuAng)*180);camera.lookAt(0,0,0);
    aimSun(0,0,HALF+10);
  }
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}

/* ---------- menu ---------- */
const mapsEl=$("maps");
function renderMapCards(){
  mapsEl.innerHTML="";
  const tot=totalStars();$("totStars").textContent=tot+" "+t("starsTot");
  MAPKEYS.forEach(k=>{const locked=MAPREQ[k]>tot,b=document.createElement("button");b.className="map"+(k===theme?" on":"")+(locked?" locked":"");b.id="map-"+k;
    const c=document.createElement("canvas");c.width=c.height=220;paintGround(c.getContext("2d"),THEMES[k],layoutFor(k),220);
    const nm=document.createElement("b");nm.textContent=t(k);
    const st=document.createElement("div");st.className="mstars";for(let i=0;i<3;i++){const e=document.createElement("i");if(i<starsOf(k))e.className="on";st.appendChild(e);}
    const best=document.createElement("small");best.className="bst";best.textContent=t("best")+": "+(store.get("gulp_best_"+k)||0);
    const lk=document.createElement("div");lk.className="lock";lk.textContent=t("locked",{s:MAPREQ[k]});
    b.append(c,nm,st,best,lk);
    b.addEventListener("click",()=>{if(locked){blip(200,.12,"square",.05);return;}if(theme===k)return;theme=k;store.set("gulp_map",k);buildWorld(k);
      mapsEl.querySelectorAll(".map").forEach(x=>x.classList.toggle("on",x.id==="map-"+k));blip(700,.06);});
    mapsEl.appendChild(b);});
  const sk=$("skins");sk.innerHTML="";
  SKINS_.forEach(([c,q],i)=>{const b=document.createElement("button"),locked=q>tot;b.className="skin"+(i===skin?" on":"")+(locked?" locked":"");
    b.style.setProperty("--c",c==="rainbow"?"#ff3d7f":c);if(c==="rainbow")b.style.background="conic-gradient(#ff3d7f,#ffc21a,#7be33a,#18d4e8,#a35cff,#ff3d7f)";
    b.setAttribute("aria-label",locked?t("locked",{s:q}):"skin "+(i+1));
    if(locked){const m=document.createElement("small");m.textContent="★"+q;b.appendChild(m);}
    b.addEventListener("click",()=>{if(locked){blip(200,.12,"square",.05);return;}skin=i;store.set("gulp_skin",i);renderMapCards();blip(800,.06);});
    sk.appendChild(b);});
}
$("langSel").addEventListener("change",e=>{lang=e.target.value;store.set("gulp_lang",lang);applyLang();});
$("playBtn").addEventListener("click",startGame);
function afterRound(next){
  if(!hasAds()){next();return;}
  AdKit.levelDone({title:t("bigT"),text:t("bigP"),reward:t("bigR")}).then(ok=>{if(ok)bigNext=true;next();},()=>next());
}
$("againBtn").addEventListener("click",()=>afterRound(startGame));
$("menuBtn").addEventListener("click",()=>afterRound(()=>{state="menu";clearHoles();buildWorld(theme);$("over").hidden=true;$("menu").hidden=false;renderMapCards();}));

addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

applyLang();
buildWorld(theme);
requestAnimationFrame(frame);
})();
</script>
