var D=window.SG_DICT||{},lang=null;
try{var s=localStorage.getItem('sg_lang');if(SUP.indexOf(s)>=0)lang=s}catch(e){}
if(!lang){var ls=[];try{ls=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language]}catch(e){}
  for(var i=0;i<ls.length&&!lang;i++){var p=String(ls[i]||'').toLowerCase().split(/[-_]/)[0];if(p==='in')p='id';if(SUP.indexOf(p)>=0)lang=p}}

document.documentElement.lang=lang;

function t(k,p){var e=D[k],s=e?(e[lang]!=null?e[lang]:e.en!=null?e.en:e.tr):null;if(s==null)s=k;s=String(s);
  if(p)s=s.replace(/\{(\w+)\}/g,function(m,n){return p[n]!=null?p[n]:m});return s}
window.t=t;window.SGt=t;
window.SG_applyDom=function(root){root=root||document;
  root.querySelectorAll('[data-i18n]').forEach(function(el){el.textContent=t(el.getAttribute('data-i18n'))});

    if(!el.__sg){el.__sg=1;el.addEventListener('click',function(ev){ev.stopPropagation();window.SG_openLangPicker()})}});

};

<script>
const COLS=5, ROWS=7, GAP=6;
const $=id=>document.getElementById(id);
const stage=$('stage'), wrap=$('wrap'), board=$('board'), lane=$('lane');
let cell=60, grid, cur, nxt, curEl=null, col=2, busy=false, over=false, score=0, maxTile=2, best=0, dragging=false;
const slots=[];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
try{best=+localStorage.getItem('dk-best')||0}catch(e){}

function fmt(v){ if(v>=1048576) return (v/1048576)+'M'; if(v>=16384) return (v/1024)+'K'; return String(v); }
function color(v){ const e=Math.log2(v); const h=(e*41+28)%360; const l=Math.floor((e-1)/9)%2?50:63; return `hsl(${h} 82% ${l}%)`; }
function setVal(el,v){ const f=el.firstChild, t=fmt(v); f.textContent=t; f.style.setProperty('--tc',color(v));
  f.style.fontSize=(cell*(t.length<=2?.42:t.length===3?.34:.27))+'px'; el.dataset.v=v; }
function makeTile(v){ const el=document.createElement('div'); el.className='tile'; el.innerHTML='<div class="face"></div>'; setVal(el,v); board.appendChild(el); return el; }
function xy(r,c){ return [GAP+c*(cell+GAP), GAP+r*(cell+GAP)]; }
function place(el,r,c,ms=140){ el.style.transitionDuration=ms+'ms'; const [x,y]=xy(r,c); el.style.transform=`translate(${x}px,${y}px)`; }
function anim(el,cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

for(let i=0;i<ROWS*COLS;i++){ const s=document.createElement('div'); s.className='slot'; board.insertBefore(s,lane); slots.push(s); }

function layout(){
  const sw=stage.clientWidth, sh=stage.clientHeight;
  cell=(Math.min(sw,420)-GAP*(COLS+1))/COLS;
  if(8*cell+10*GAP>sh) cell=(sh-10*GAP)/8;
  cell=Math.max(28,Math.floor(cell));
  document.documentElement.style.setProperty('--cell',cell+'px');
  const bw=GAP*(COLS+1)+cell*COLS, bh=GAP*(ROWS+1)+cell*ROWS;
  wrap.style.paddingTop=(cell+GAP*2)+'px';
  board.style.width=bw+'px'; board.style.height=bh+'px';
  slots.forEach((s,i)=>{ const [x,y]=xy(Math.floor(i/COLS),i%COLS); Object.assign(s.style,{left:x+'px',top:y+'px',width:cell+'px',height:cell+'px'}); });
  lane.style.width=(cell+GAP)+'px'; lane.style.height=bh+'px'; aimLane();
  if(grid) grid.forEach((row,r)=>row.forEach((t,c)=>{ if(t){ setVal(t.el,t.v); place(t.el,r,c,0); } }));
  if(curEl){ setVal(curEl,cur); place(curEl,-1,col,0); }
}
function aimLane(){ lane.style.transform=`translateX(${GAP/2+col*(cell+GAP)}px)`; }
function aim(c){ if(c===col) return; col=c; aimLane(); if(curEl&&!busy) place(curEl,-1,c,90); }
function aimAt(x){ const r=board.getBoundingClientRect(); aim(Math.max(0,Math.min(COLS-1,Math.floor((x-r.left)/(r.width/COLS))))); }

function rnd(){
  const k=Math.floor(Math.log2(maxTile)), top=Math.max(3,Math.min(6,k-3));
  const pool=[]; for(let e=1;e<=top;e++) for(let w=0;w<top-e+2;w++) pool.push(2**e);
  return pool[Math.floor(Math.random()*pool.length)];
}
function lowest(c){ for(let r=ROWS-1;r>=0;r--) if(!grid[r][c]) return r; return -1; }
function find(t){ for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(grid[r][c]===t) return [r,c]; return null; }

function hud(){
  $('score').textContent=score.toLocaleString(window.SG_LOCALE||'tr-TR');
  $('max').textContent=fmt(maxTile);
  $('best').textContent=best?fmt(best):'–';
  const m=$('nextMini'); m.textContent=fmt(nxt); m.style.setProperty('--tc',color(nxt));
}
function gain(v){
  score+=v; if(v>maxTile) maxTile=v;
  if(maxTile>best){ best=maxTile; try{localStorage.setItem('dk-best',best)}catch(e){} }
  hud();
}
function burst(r,c,v){
  const [x,y]=xy(r,c);
  for(let i=0;i<8;i++){
    const s=document.createElement('div'); s.className='spark';
    const a=Math.random()*Math.PI*2, d=cell*(.6+Math.random()*.6);
    s.style.cssText=`left:${x+cell/2-4}px;top:${y+cell/2-4}px;background:${color(v)};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px`;
    board.appendChild(s); setTimeout(()=>s.remove(),520);
  }
}
function combo(n){ const d=document.createElement('div'); d.className='combo'; d.textContent=SGt('combo',{n}); wrap.appendChild(d); setTimeout(()=>d.remove(),820); }

function gravity(){
  const moved=[];
  for(let c=0;c<COLS;c++){ let w=ROWS-1;
    for(let r=ROWS-1;r>=0;r--){ const t=grid[r][c]; if(!t) continue;
      if(r!==w){ grid[w][c]=t; grid[r][c]=null; place(t.el,w,c,150); moved.push([w,c]); } w--; } }
  return moved;
}
async function resolve(queue){
  let chain=0;
  while(queue.length){
    const [r,c]=queue.shift(); const t=grid[r]&&grid[r][c]; if(!t) continue;
    const ns=[[r,c-1],[r,c+1],[r+1,c],[r-1,c]].filter(([a,b])=>a>=0&&a<ROWS&&b>=0&&b<COLS&&grid[a][b]&&grid[a][b].v===t.v);
    if(!ns.length) continue;
    chain++;
    t.el.style.zIndex=3;
    for(const [a,b] of ns){ const n=grid[a][b]; grid[a][b]=null; n.el.style.zIndex=2; place(n.el,r,c,130); setTimeout(()=>n.el.remove(),135); }
    await sleep(140);
    t.v*=2**ns.length; setVal(t.el,t.v); anim(t.el,'pop'); burst(r,c,t.v); gain(t.v);
    t.el.style.zIndex='';
    if(chain>1) combo(chain);
    await sleep(110);
    const moved=gravity(); if(moved.length) await sleep(170);
    queue.unshift(...moved); const p=find(t); if(p) queue.unshift(p);
  }
}
function spawn(){
  cur=nxt; nxt=rnd();
  curEl=makeTile(cur); curEl.classList.add('cur','born'); place(curEl,-1,col,0);
  hud(); checkOver(); save();
}
let revived=false;
function checkOver(){
  for(let c=0;c<COLS;c++) if(lowest(c)>=0||grid[0][c].v===cur) return;
  over=true;
  if(window.AdKit&&!revived){
    revived=true;
    AdKit.levelDone({force:true,title:SGt('revive_title'),reward:SGt('revive_reward')}).then(ok=>{
      if(ok){ for(let r=0;r<3;r++) for(let c=0;c<COLS;c++){ const t=grid[r][c]; if(t){ burst(r,c,t.v); t.el.remove(); grid[r][c]=null; } }
        over=false; save(); }
      else showOver();
    });
    return;
  }
  showOver();
}
function showOver(){
  $('overMax').textContent=fmt(maxTile);
  $('overNote').textContent=maxTile>=best?SGt('new_record'):SGt('your_best',{n:fmt(best)});
  $('over').hidden=false; $('again').focus();
}
async function drop(){
  if(busy||over||!curEl) return;
  const c=col, r=lowest(c), el=curEl;
  if(r<0){
    const t=grid[0][c];
    if(t.v!==cur){ anim(board,'shake'); return; }
    busy=true; curEl=null; el.classList.remove('cur');
    place(el,0,c,120); await sleep(125); el.remove();
    t.v*=2; setVal(t.el,t.v); anim(t.el,'pop'); burst(0,c,t.v); gain(t.v);
    await sleep(120); await resolve([[0,c]]);
  } else {
    busy=true; curEl=null; el.classList.remove('cur');
    grid[r][c]={v:cur,el};
    const ms=110+r*28; place(el,r,c,ms); await sleep(ms+10);
    await resolve([[r,c]]);
  }
  busy=false; spawn();
}

function start(data){
  revived=false;
  board.querySelectorAll('.tile,.spark').forEach(e=>e.remove());
  grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));
  over=false; busy=false; $('over').hidden=true;
  if(data&&data.g){
    data.g.forEach((row,r)=>row.forEach((v,c)=>{ if(v) grid[r][c]={v,el:makeTile(v)}; }));
    score=data.score||0; maxTile=data.maxTile||2; nxt=data.cur||2; col=data.col??2;
  } else {
    [4,2,8,2,4].forEach((v,c)=>grid[ROWS-1][c]={v,el:makeTile(v)});
    score=0; maxTile=8; nxt=2;
  }
  layout(); spawn();
}
function save(){}
window.SG_beforeLangReload=()=>{ if(!grid||over||busy||!curEl) return; try{sessionStorage.setItem('sg_lang_resume',JSON.stringify({g:grid.map(r=>r.map(t=>t?t.v:0)),cur,score,maxTile,col}))}catch(e){} };
function SG_resume(){ try{const s=sessionStorage.getItem('sg_lang_resume'); sessionStorage.removeItem('sg_lang_resume'); return s?JSON.parse(s):null }catch(e){ return null } }
window.claude?.hot?.snapshot?.(()=>({g:grid.map(r=>r.map(t=>t?t.v:0)),cur,score,maxTile,col}));

stage.addEventListener('pointerdown',e=>{ dragging=true; aimAt(e.clientX); try{stage.setPointerCapture(e.pointerId)}catch(_){} });
stage.addEventListener('pointermove',e=>{ if(dragging||e.pointerType==='mouse') aimAt(e.clientX); });
stage.addEventListener('pointerup',e=>{ if(!dragging) return; dragging=false; aimAt(e.clientX); drop(); });
stage.addEventListener('pointercancel',()=>{ dragging=false; });
addEventListener('keydown',e=>{
  if(over) return;
  if(e.key==='ArrowLeft') aim(Math.max(0,col-1));
  else if(e.key==='ArrowRight') aim(Math.min(COLS-1,col+1));
  else if(e.key==='ArrowDown'||e.key===' '){ e.preventDefault(); drop(); }
});
$('again').addEventListener('click',()=>start());
// Ödüllü reklam: elindeki kareyi kuyuda eşi olan en küçük sayıyla değiştir
$('swap').addEventListener('click',()=>{
  if(busy||over||!curEl||!window.AdKit) return;
  AdKit.rewarded('swap').then(ok=>{
    if(!ok||busy||over||!curEl) return;
    const tops=[]; for(let c=0;c<COLS;c++){ const r=lowest(c); const t=r+1<ROWS?grid[r+1][c]:null; if(t) tops.push(t.v); }
    const v=tops.length?Math.min(...tops):2;
    cur=v; setVal(curEl,cur); anim(curEl,'pop'); hud();
  });
});
new ResizeObserver(()=>layout()).observe(stage);

window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? SG_resume());
</script>

</body></html>
