  for(let k=slots.length-1;k>0;k--){const j=Math.floor(r()*(k+1));[slots[k],slots[j]]=[slots[j],slots[k]]}

// aimX/aimY: kale çizgisindeki hedef; B: falso yay sapması (m, + sağa); v: top hızı (m/s); ground: yerden şut.

/* ---------- kaleci fiziği ----------
 * Ayakta: hedefe ivmelenerek kayar (en fazla vk m/s, 20 m/s² ivme).
 * Dalış: leğen bir mermi gibi fırlatılır (yatay + dikey hız, yerçekimi), yere düşünce kayar.
 * Eller leğenden en fazla KL metre uzanır ve refleksle topa yönelir; çarpışma gövde, el ve bacak parçalarıyla hesaplanır.

const KL=1.0;
function kInit(sp){return{x:sp.kx0,vx:0,mode:'stand',P:[sp.kx0,.9],V:[0,0],H:[sp.kx0,1.24],T:[0,1],dir:0,t:0,caught:false,g:0,gh:1,ph:0,fall:0}}

function keeperBody(k){ // [ax,ay,bx,by,yarıçap,el mi]

function keeperStep(st,dt){const k=st.k,sp=st.sp,b=st.b;k.t+=dt;
 const fly=st.phase==='fly'&&!st.res&&b.vz>0&&b.z<sp.kz;
 if(k.mode==='stand'){let tx=k.x;
  if(sp.user){if(k.req&&fly){const tt=(sp.kz-b.z)/b.vz;kLaunch(k,sp,k.req.x,k.req.y,Math.max(.16,tt));k.req=null}}
  else if(sp.pen){if(fly&&st.t>sp.delay){const tt=(sp.kz-b.z)/b.vz;kLaunch(k,sp,k.g===0?(k.gh>1.5?0:k.x):k.g*2.6,k.gh,Math.max(.22,tt))}}
  else if(fly&&st.t>sp.delay){const tt=(sp.kz-b.z)/b.vz,useAcc=b.z>sp.D*.5;

function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.floor(W*DPR);cv.height=Math.floor(H*DPR);

function setCam(sp,fwd){fwd=fwd||0;const len=Math.hypot(sp.bx,sp.D),dx=-sp.bx/len,dz=sp.D/len;const yaw=Math.atan2(dx,dz);CAM.c=Math.cos(yaw);CAM.s=Math.sin(yaw);CAM.yaw=yaw;

function toCam(x,y,z){const dx=x-CAM.x,dz=z-CAM.z;return[dx*CAM.c-dz*CAM.s,y-CAM.y,dx*CAM.s+dz*CAM.c]}
function pc(p){const s=F/p[2];return[CX+p[0]*s,CY-p[1]*s,s]}

cv.addEventListener('pointerdown',e=>{if(G&&G.cup&&G.turn==='keep'){if(state==='play'&&ST&&ST.sp.user&&$('#modal').hidden)keepTap(e);return}if(state!=='play'||!ST||ST.phase!=='aim'||!$('#modal').hidden||FX.fade>.5)return;ST.drawn=null;drag={id:e.pointerId,pts:[lp(e)]};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;drag.pts.push(lp(e));if(drag.pts.length>160)drag.pts.splice(1,1);
 const sh=swipeToShot(drag.pts);aimView=sh?sh.aim:null;const vf=visFrac();preview=vf>0&&sh?pathOf(sh,vf):null});
const endDrag=e=>{if(!drag||e.pointerId!==drag.id)return;const pts=drag.pts;pts.push(lp(e));drag=null;
 const sh=swipeToShot(pts);preview=null;aimView=null;if(!sh)return;
 ST.drawn=shotPath(pts);ST.drawnT=0;
 if(guideArmed){guideArmed=false;S.guides=Math.max(0,S.guides-1);save()}
 G.shots++;kick(sh)};

/* Kramponlar: güç (en yüksek hız), falso (en fazla kavis), kontrol (topun gerçek yolunun ne kadarı önceden görünür). */
const BOOTS=[{pow:1,curl:1,ctl:1,price:0,c:'#8f959e',c2:'#ffffff'},{pow:2,curl:1,ctl:2,price:150,c:'#ffd23f',c2:'#1b1d2a'},{pow:2,curl:3,ctl:2,price:320,c:'#2fb8ff',c2:'#ffffff'},
 {pow:4,curl:2,ctl:3,price:520,c:'#e8333a',c2:'#ffd23f'},{pow:3,curl:4,ctl:4,price:800,c:'#3ee07f',c2:'#1b1d2a'},{pow:5,curl:5,ctl:5,price:1300,c:'#ffd96a',c2:'#8a5a00'}];
const boot=()=>BOOTS[S.boot]||BOOTS[0];
const vMax=()=>28+boot().pow*2+S.sk.pow*.8,curlMax=()=>.8+boot().curl*.45+S.sk.curl*.14;
function visFrac(){return guideArmed||(G&&G.L>=1&&G.L<=2)?1:Math.min(1,.15+boot().ctl*.17+S.sk.ctl*.05)}
let aimView=null;
/* Çizdiğin yol = topun yolu
 * Çizgi topun üstünden başlıyormuş gibi kaydırılır (parmak nereden başlarsa başlasın).
 * Hedef: çizginin bittiği ekran noktası kale düzlemine iz düşürülür → topun kaleye vardığı (x, yükseklik).
 *   Çizgi kale ağzının tabanına ulaşmadan biterse son doğrultusunda tabana kadar uzatılır → yerden şut.
 * Falso: çizginin kirişten ortadaki sapması (piksel) topun yarı yoldaki derinliğinde metreye çevrilir; 6 px altı titreme sayılır.
 * Hız: son 150 ms'deki en yüksek parmak hızı (%75) + tüm çizimin hızı (%25) → 16 m/s ile kramponun tavanı arası. Rastgele sapma yok. */
function shotPath(pts){if(!ST||pts.length<2)return null;const sp=ST.sp,bp=proj(sp.bx,BR,0);if(!bp)return null;
 const ox=bp[0]-pts[0].x,oy=bp[1]-pts[0].y;return pts.map(p=>({x:p.x+ox,y:p.y+oy,t:p.t}))}
function swipeToShot(raw){const pts=shotPath(raw);if(!pts)return null;const sp=ST.sp,a=pts[0],last=pts[pts.length-1];
 let total=0;for(let i=1;i<pts.length;i++)total+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);
 const dx=last.x-a.x,dy=last.y-a.y,len=Math.hypot(dx,dy);
 if(len<28||dy>-15)return null;
 // hedef ve gerekirse uzatma
 let ex=last.x,ey=last.y,hit=unproject(ex,ey,sp.D);if(!hit)return null;let ext=false;
 if(hit.y<BR){let k=pts.length-1;while(k>0&&Math.hypot(last.x-pts[k].x,last.y-pts[k].y)<len*.3)k--;
  let ux=last.x-pts[k].x,uy=last.y-pts[k].y;const ul=Math.hypot(ux,uy)||1;ux/=ul;uy/=ul;if(uy>-.2){uy=-.2;const n=Math.hypot(ux,uy);ux/=n;uy/=n}
  for(let i=0;i<500&&hit&&hit.y<BR;i++){ex+=ux*2;ey+=uy*2;hit=unproject(ex,ey,sp.D)}ext=true;if(!hit)return null}
 const ground=hit.y<.32;
 const ax=clamp(hit.x,-GW-8,GW+8),ay=ground?BR:clamp(hit.y,BR,6);
 // kavis
 let dev=0,n=0;for(const p of pts){const u=((p.x-a.x)*dx+(p.y-a.y)*dy)/(len*len);if(u<.2||u>.8)continue;dev+=(dx*(p.y-a.y)-dy*(p.x-a.x))/len;n++}
 dev=n?dev/n/.84:0;if(Math.abs(dev)<6)dev=0;else dev-=Math.sign(dev)*6;
 const mid=toCam(lerp(sp.bx,ax,.5),.5,sp.D*.5)[2];
 let B=clamp(dev*mid/F,-curlMax(),curlMax());if(sp.air>1)B*=.8;
 // hız
 let t0=a.t;for(const p of pts){if(Math.hypot(p.x-a.x,p.y-a.y)>8){t0=p.t;break}}
 const spdAll=total/Math.max(45,last.t-t0+16);
 let peak=0;for(let i=pts.length-1;i>0&&last.t-pts[i].t<150;i--){let j=i;while(j>0&&pts[i].t-pts[j].t<30)j--;const dt_=pts[i].t-pts[j].t;if(dt_>=12)peak=Math.max(peak,Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y)/dt_)}
 const spd=Math.max(peak,spdAll)*.75+spdAll*.25;
 const v=clamp(12+spd*9,16,vMax())*sp.air;
 return Object.assign(makeShot(sp,ax,ay,B,v,ground),{aim:{x:ax,y:ay,ground,err:.16,kmh:Math.round(v*3.6),ext,ex,ey}})}
function pathOf(sh,frac){const b={...sh},out=[],dt=1/90;for(let i=0;i<300;i++){b.vx+=b.ax*dt;b.vy-=GR*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.z+=b.vz*dt;if(b.y<BR){b.y=BR;b.vy=0}if(i%3===0)out.push([b.x,b.y,b.z]);if(b.z>=ST.sp.D)break}
 return out.slice(0,Math.max(2,Math.ceil(out.length*frac)))}
$('#guideBtn').onclick=()=>{if(!G)return;if(!S.guides&&!guideArmed){toastMsg(T.noGuide);return}guideArmed=!guideArmed;if(guideArmed)toastMsg(T.guideOn);updHud()};

function screenOf(x,y,z){const p=proj(x,y,z);return p?{x:p[0],y:p[1],s:p[2]}:null}
function kick(sh){const snap=JSON.stringify(ST);
 // sonucu önceden hesapla (ağır çekim kararı için); oyunda aynı fizik çalışır
 const pre=JSON.parse(JSON.stringify(ST));shoot(pre,sh);let n=0;while(pre.phase!=='done'&&!pre.res&&n<1500){stepShot(pre,1/240);n++}
 // "güzel gol": doksan, halka/hedef, kaleciyi kıl payı geçen, çok falsolu ya da çok sert gol
 const great=pre.res==='goal'&&(pre.top||pre.ring||pre.tIdx>=0||(ST.sp.keeper&&pre.kGap>0&&pre.kGap<.3)||Math.abs(sh.spin)>.85||sh.v>32);
 ST.pre={res:pre.res,top:pre.top,ring:pre.ring,tIdx:pre.tIdx,gap:pre.kGap,great};
 ST.shot={v:sh.v,B:Math.abs(sh.B||0),ground:!!sh.ground};
 ST.snap=snap;ST.shotObj=sh;shoot(ST,sh);$('#hint').hidden=true;updHud();
 const v=sh.v,p=screenOf(ST.b.x,BR,0);
 SFX.kick(v);vib(12);FX.shake=Math.max(FX.shake,2+v/12);FX.squash=1;
 if(p){FX.rings.push({x:p.x,y:p.y,r:p.s*.15,t:0,c:'255,255,255'});
  const th=THEMES[ST.sp.theme],gc=ST.sp.theme==='playa'?['#e2c58f','#c9a86a']:['#3e9b4f','#2f7a3c','#8a6b3a'];
  for(let i=0;i<16;i++){const a=-Math.PI/2+(Math.random()-.5)*2.2,s=120+Math.random()*220;parts.push({x:p.x,y:p.y+p.s*.08,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0,life:.5+Math.random()*.4,s:2+Math.random()*3,c:gc[i%gc.length],r:Math.random()*TAU,g:900})}
  FX.pops.push({text:Math.round(v*3.6)+' '+T.kmh,x:p.x+34,y:p.y-30,t:0,c:v>27?'#ffd23f':'#ffffff'})}}
function showMsg(text,col){msg={text,col,t:0}}
function burst(x,y,cols,n,sp,glow){for(let i=0;i<n&&parts.length<520;i++){const a=Math.random()*TAU,v=(.3+Math.random()*.7)*sp;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-sp*.4,t:0,life:.9+Math.random()*.9,s:3+Math.random()*4,c:cols[i%cols.length],r:Math.random()*TAU,g:380,glow})}}
function firework(){const x=40+Math.random()*(LW-80),y=40+Math.random()*CY*.45,cols=[['#ffd23f','#fff'],['#ff4f8b','#ffd23f'],['#3ee07f','#2fb8ff'],['#ffffff','#9fd8ff']][Math.floor(Math.random()*4)];
 for(let i=0;i<46;i++){const a=i/46*TAU,v=90+Math.random()*60;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,life:1+Math.random()*.6,s:2.5,c:cols[i%2],r:0,g:60,glow:true,dot:true})}SFX.boom()}
function onResult(){const st=ST,r=st.res,ok=isSuccess(st),sp=st.sp,c=st.contact?screenOf(st.contact.x,st.contact.y,st.contact.z):null;
 FX.hold=.5;
 const PR=progShot(st,ok);if(G.daily)dailyShot(st);if(r==='goal'&&ok)bestCapture(st);
 if(ok){G.goals++;let cn=10;if(st.ring){cn+=15}if(st.tIdx>=0){cn+=10;sp.targets[st.tIdx].hit=true}if(st.top)cn+=5;cn=Math.round(cn*PR.mult*fameMult());G.coins+=cn;S.coins+=cn;save()}
 if(r==='goal'){
  const tc=st.tIdx>=0?screenOf(sp.targets[st.tIdx].x,sp.targets[st.tIdx].y,sp.D):null;
  if(tc){SFX.glass();burst(tc.x,tc.y,['#ffffff','#e8333a','#ffd23f'],40,260)}
  if(sp.mode==='bar'){showMsg(T.NOBAR,'#ff8a1f');SFX.net();SFX.ooh();return}
  const great=st.pre&&st.pre.great;
  showMsg(st.tIdx>=0?T.TARGET:st.ring?T.RING:st.top?T.TOP:great?T.GOAL:T.GOL,'#3ee07f');SFX.net();SFX.cheer();setTimeout(SFX.coin,400);
  vib([30,40,70]);FX.shake=Math.max(FX.shake,9);FX.flash=.35;FX.flashC='#ffffff';FX.cheer=1;ambLevel(THEMES[sp.theme].amb*3);setTimeout(()=>G&&ambLevel(THEMES[sp.theme].amb),2500);
  burst(LW/2,CY+20,['#ffd23f','#3ee07f','#2fb8ff','#ff4f8b','#ffffff'],130,430);
  if(great&&(sp.theme==='final'||sp.theme==='clasico')){firework();setTimeout(firework,350);setTimeout(firework,700)}}
 else if(r==='save'){showMsg(st.caught?T.CATCH:T.SAVE,'#ffd23f');SFX.save();vib(25);FX.shake=Math.max(FX.shake,5);
  if(c){FX.rings.push({x:c.x,y:c.y,r:c.s*.2,t:0,c:'255,240,180'});burst(c.x,c.y,['#ffffff','#ffe9a0'],22,200)}}
 else if(r==='post'||r==='bar'){const good=sp.mode==='bar'&&r==='bar';showMsg(r==='bar'?T.BAR:T.POST,good?'#3ee07f':'#ff8a1f');SFX.post();if(!good)SFX.ooh();else{SFX.cheer();FX.cheer=.7}vib(35);FX.shake=Math.max(FX.shake,6);
  if(c){FX.rings.push({x:c.x,y:c.y,r:c.s*.15,t:0,c:'255,255,255'});burst(c.x,c.y,['#ffffff','#ffd23f','#cfd6e0'],26,240,true)}}
 else if(r==='block'){showMsg(T.BLOCK,'#ff4f8b');SFX.thud();vib(20);FX.shake=Math.max(FX.shake,4)}
 else if(r==='noring'){showMsg(T.hints.ring,'#ff4f8b');SFX.net();SFX.ooh()}
 else if(r==='notarget'){showMsg(T.NOTARGET,'#ff8a1f');SFX.net();SFX.ooh()}
 else{showMsg(T.MISS,'#9cc4ad');SFX.ooh()}
 updHud()}
function afterShot(){if(G.cup){cupAfter();return}if(G.daily){dailyAfter();return}G.ballsLeft--;G.idx++;updHud();
 if(G.goals>=G.lv.need){setTimeout(win,250);return}
 if(G.ballsLeft<=0){outOfBalls();return}
 nextSpot()}
function outOfBalls(){state='wait';
 if(!G.cont&&window.AdKit&&window.AdKit.available()){G.cont=true;
  window.AdKit.offer({title:T.contTitle,text:T.contText,reward:T.contReward,button:T.contBtn,decline:T.contNo,timeout:8,placement:'continue'}).then(ok=>{if(!G)return;
   if(ok){G.ballsLeft+=2;G.ballsTotal+=2;state='play';nextSpot();toastMsg(T.contReward)}else failSheet()})}
 else failSheet()}
function starsFor(){const miss=G.shots-G.goals;return miss<=0?3:miss<=1?2:1}
function win(){state='wait';SFX.win();const L=G.L,st=starsFor(),first=!S.stars[L];
 const bonus=(first?20:0)+st*5;S.coins+=bonus;G.coins+=bonus;
 S.stars[L]=Math.max(S.stars[L]||0,st);if(L>=S.max&&L<MAXL)S.max=L+1;save();
 progWin(L,st,first);
 if(L%20===0){firework();setTimeout(firework,300);setTimeout(firework,650)}
 if(L>=MAXL)statInc('final',1,true);achCheck();gsSync(true);
 winSheet(st)}

let toastT=0;function toastMsg(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,1700)}
const starStr=n=>[0,1,2].map(i=>i<n?'<span>★</span>':'<span><em>★</em></span>').join('');
function stageIntro(L){const st=stageOf(L),S_=STAGES[st];state='wait';
 if(!ST){menuST=null}
 sheet(`<div class="big-ic">${S_.icon}</div><p class="ms" style="margin:0;text-transform:uppercase;letter-spacing:.1em;font-weight:900">${T.stageT} ${st+1} · ${S_.place}</p>
 <p class="mt" style="color:${S_.tint}">${T.stages[st]}</p><p class="ms" style="margin:0;color:#d3eadc;font-size:15px">${T.stageNew[st]}</p>
 <button class="play" id="goBtn">${T.go}</button>`);
 $('#goBtn').onclick=()=>{S.seen['st'+st]=1;save();closeSheet();startLevel(L,true)}}
function winSheet(st){const L=G.L,last=L>=MAXL,stageEnd=L%20===0;G.lastSheet=()=>winSheet(st);
 const title=last?T.allDone:stageEnd?T.stageDone:T.level+' '+L,sub=last?T.allDoneSub:stageEnd?T.stages[stageOf(L)]:T.winSub;
 sheet(`<p class="mt" style="color:var(--lime)">${title}</p><p class="ms">${sub}</p><div class="bigstars">${starStr(st)}</div>
 <div class="stats"><div class="stat"><b>${G.goals} / ${G.shots}</b><span>${T.scored}</span></div><div class="stat"><b>+${G.coins}</b><span>${T.earned}</span></div></div>
 ${progSummary()}${G.best?`<button class="btn sun" id="rpBtn">${T.replayBtn}</button>`:''}<div class="mb"><button class="btn" id="wMenu">${T.menu}</button><button class="play" id="wNext">${last?T.again:T.next}</button></div>`);
 const after=fn=>{closeSheet();if(window.AdKit){window.AdKit.levelDone({title:T.bonusTitle,reward:T.bonusReward}).then(ok=>{if(ok){S.coins+=30;save();SFX.coin();toastMsg(T.bonusReward)}fn()})}else fn()};
 if($('#rpBtn'))$('#rpBtn').onclick=startReplay;$('#wMenu').onclick=()=>after(toMenu);$('#wNext').onclick=()=>after(()=>startLevel(last?1:L+1))}

 sheet(`<p class="mt" style="color:var(--pink)">${T.lose}</p><p class="ms">${T.level} ${L} · ${T.modes[G.lv.mode]} ${G.goals}/${G.lv.need}</p>

 if($('#rpBtn'))$('#rpBtn').onclick=startReplay;$('#fMenu').onclick=()=>{closeSheet();toMenu()};$('#fRetry').onclick=()=>startLevel(L,true)}
function openPause(){if(state!=='play'||!G||!$('#modal').hidden)return;state='paused';drag=null;preview=null;ambLevel(0);
 sheet(`<p class="mt">${T.pause}</p><p class="ms">${G.cup||G.daily?$('#hudLv').textContent:T.level+' '+G.L+' · '+T.modes[G.lv.mode]+' '+G.goals+'/'+G.lv.need}</p><div class="mb"><button class="btn" id="pMenu">${T.menu}</button><button class="play" id="pGo">${T.resume}</button></div>`);

function drawBoot(c,w,h,b){c.clearRect(0,0,w,h);c.save();c.translate(w/2,h/2+6);const s=w/110;c.scale(s,s);
 c.fillStyle='#14151c';c.beginPath();c.moveTo(-46,10);c.lineTo(44,10);c.quadraticCurveTo(52,10,50,4);c.lineTo(-46,4);c.closePath();c.fill();
 for(const x of[-38,-24,18,32,44])c.fillRect(x-2,10,5,6);
 const g=c.createLinearGradient(0,-26,0,8);g.addColorStop(0,shade(b.c,.25));g.addColorStop(1,shade(b.c,-.2));c.fillStyle=g;
 c.beginPath();c.moveTo(-46,6);c.lineTo(-48,-14);c.quadraticCurveTo(-47,-28,-34,-30);c.lineTo(-14,-30);c.quadraticCurveTo(-8,-18,6,-14);c.quadraticCurveTo(40,-8,50,4);c.closePath();c.fill();
 c.strokeStyle='rgba(0,0,0,.4)';c.lineWidth=1.5;c.stroke();
 c.strokeStyle=b.c2;c.lineWidth=4;c.lineCap='round';c.beginPath();c.moveTo(-36,-2);c.quadraticCurveTo(-6,-16,30,-4);c.stroke();
 c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=1.6;for(let i=0;i<4;i++){c.beginPath();c.moveTo(-10+i*7,-22+i*2);c.lineTo(-4+i*7,-19+i*2);c.stroke()}
 c.restore()}

 const rows=BOOTS.map((b,i)=>{const own=S.boots.includes(i),eq=S.boot===i;
  const btn=eq?`<button class="btn" disabled>${T.using}</button>`:own?`<button class="btn" data-ub="${i}">${T.use}</button>`:`<button class="btn sun" data-bb="${i}">🪙 ${b.price}</button>`;
  const bars=st.map(k=>`<div class="srow"><span>${T.stat[k]}</span><div class="pips">${[0,1,2,3,4].map(j=>`<i class="${j<b[k]?'on':''}"></i>`).join('')}</div></div>`).join('');

function drawCrest(c,x,y,r,tm){const P=PALS[tm.pal]||PALS[0],ini=teamInitials(tm.n);
 const shape=()=>{c.beginPath();if(tm.cr===0){c.moveTo(-r*.86,-r*.9);c.lineTo(r*.86,-r*.9);c.lineTo(r*.86,r*.1);c.quadraticCurveTo(r*.8,r*.72,0,r);c.quadraticCurveTo(-r*.8,r*.72,-r*.86,r*.1);c.closePath()}

 c.save();c.translate(x,y);shape();c.fillStyle=P[0];c.fill();c.save();c.clip();c.fillStyle=P[1];
 if(tm.pat===1)for(let k=-2;k<=2;k+=2)c.fillRect(k*r*.32-r*.12,-r,r*.24,2*r);
 else if(tm.pat===2){c.fillRect(-r,-r*.5,2*r,r*.24);c.fillRect(-r,r*.2,2*r,r*.24)}
 else if(tm.pat===3){c.beginPath();c.moveTo(-r,-r*.55);c.lineTo(-r*.55,-r);c.lineTo(r,r*.55);c.lineTo(r*.55,r);c.closePath();c.fill()}
 else if(tm.pat===4)c.fillRect(0,-r,r,2*r);
 c.restore();shape();c.lineWidth=r*.13;c.strokeStyle=P[1]===P[0]?'#ffffff':P[1];c.stroke();
 const fs=ini.length>2?r*.56:r*.7;c.font=`${fs}px "Lilita One",Impact,sans-serif`;c.textAlign='center';c.textBaseline='middle';
 c.lineWidth=r*.14;c.strokeStyle='rgba(0,0,0,.6)';c.strokeText(ini,0,r*.04);c.fillStyle='#ffffff';c.fillText(ini,0,r*.04);c.restore()}
function kitPattern(c,a1,a2,b1,b2,pat,col){const Q=(u,v)=>{const tx=lerp(a1[0],a2[0],u),ty=lerp(a1[1],a2[1],u),bx=lerp(b1[0],b2[0],u),by=lerp(b1[1],b2[1],u);return[lerp(tx,bx,v),lerp(ty,by,v)]};
 const poly=pts=>{c.beginPath();pts.forEach((p,i)=>{const q=Q(p[0],p[1]);i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1])});c.closePath();c.fill()};
 c.save();c.fillStyle=col;
 if(pat===1)for(let k=1;k<6;k+=2)poly([[k/6,0],[(k+1)/6,0],[(k+1)/6,1],[k/6,1]]);
 else if(pat===2)for(let k=1;k<5;k+=2)poly([[0,k/5],[1,k/5],[1,(k+1)/5],[0,(k+1)/5]]);
 else if(pat===3)poly([[0,.04],[.3,0],[1,.72],[1,1],[.72,1],[0,.34]]);
 else if(pat===4)poly([[.5,0],[1,0],[1,1],[.5,1]]);

 path();c.fillStyle=P[0];c.fill();c.save();path();c.clip();kitPattern(c,[w*.04,h*.1],[w*.96,h*.1],[w*.27,h*.94],[w*.73,h*.94],tm.pat,P[1]);c.restore();
 path();c.lineWidth=3;c.strokeStyle='rgba(0,0,0,.45)';c.stroke();

 drawCrest(c,w*.62,h*.36,h*.1,tm);c.restore()}
