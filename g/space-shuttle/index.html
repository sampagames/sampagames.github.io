<style>
:root{--bg:#05060f;--ink:#eef3ff;--dim:#93a0c4;--cyan:#38e1ff;--orange:#ff9a3c;--gold:#ffd23f;--red:#ff4d5e;--green:#3ddc84;--panel:rgba(12,18,40,.86);--line:rgba(120,170,255,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:600 15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);z-index:10;overflow-y:auto;touch-action:pan-y}
.scr.on{display:flex}
.dim{background:rgba(3,5,14,.55);backdrop-filter:blur(2px)}
#sMenu,#sMap,#sHangar{background:linear-gradient(180deg,rgba(3,5,14,.55),rgba(3,5,14,.25) 40%,rgba(3,5,14,.7))}
h1 small{text-shadow:0 0 12px rgba(56,225,255,.8),0 2px 4px #000}
.muted{text-shadow:0 1px 3px rgba(0,0,0,.8)}
h1{font-size:34px;line-height:1;margin:0;letter-spacing:.02em;text-align:center;font-weight:900}
h1 small{display:block;font-size:13px;letter-spacing:.32em;color:var(--cyan);margin-top:8px;font-weight:800}
h2{margin:6px 0 10px;font-size:22px;font-weight:900;text-align:center}
.btn{border:0;border-radius:16px;padding:14px 18px;font:900 17px system-ui,-apple-system,sans-serif;color:#081022;background:linear-gradient(180deg,#5cf0ff,#16b6e0);box-shadow:0 5px 0 #0b7e9e,0 10px 24px rgba(56,225,255,.25);cursor:pointer;min-width:220px;display:flex;align-items:center;justify-content:center;gap:10px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0b7e9e}
.btn.o{background:linear-gradient(180deg,#ffbe6b,#ff8a1f);box-shadow:0 5px 0 #b25500,0 10px 24px rgba(255,154,60,.25)}
.btn.o:active{box-shadow:0 2px 0 #b25500}
.btn.g{background:linear-gradient(180deg,#71f0a8,#2bbf6c);box-shadow:0 5px 0 #17824a}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.sm{min-width:0;padding:10px 14px;font-size:15px;border-radius:12px}
.btn[disabled]{opacity:.45;filter:grayscale(.6)}
.col{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%;max-width:420px}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.top{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:520px;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);padding:7px 12px;border-radius:999px;font-weight:900}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#ffd23f 45%,#c98a00);box-shadow:0 0 8px rgba(255,210,63,.6);display:inline-block;flex:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;width:100%}
.ico{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--ink);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.logo{width:150px;height:auto;filter:drop-shadow(0 0 30px rgba(56,225,255,.35));animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(1deg)}}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:100%}
.lv{aspect-ratio:1;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:18px;cursor:pointer;position:relative}
.lv.done{background:linear-gradient(180deg,rgba(56,225,255,.22),rgba(56,225,255,.06));border-color:rgba(56,225,255,.5)}
.lv.cur{background:linear-gradient(180deg,#ffbe6b,#ff8a1f);color:#2a1300;border-color:#ffd9a6;animation:pulse 1.4s infinite}
.lv.lock{opacity:.35}
.lv.boss::after{content:'☠';position:absolute;top:2px;right:5px;font-size:11px}
.lv i{font-style:normal;font-size:10px;letter-spacing:1px;color:var(--gold)}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,154,60,.25)}}
.sect{width:100%;margin-top:6px}
.sect h3{margin:8px 0 8px;font-size:14px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase}
.up{display:flex;width:100%;gap:12px;align-items:center;padding:12px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.up b{display:block;font-size:16px}.up small{color:var(--dim);font-weight:600}
.pips{display:flex;gap:4px;margin-top:6px}.pips span{width:18px;height:6px;border-radius:3px;background:rgba(255,255,255,.15)}.pips span.on{background:var(--cyan)}
.up .btn{margin-left:auto}
.stars{font-size:44px;letter-spacing:6px;color:#3a4466}.stars .on{color:var(--gold);text-shadow:0 0 18px rgba(255,210,63,.7)}
.big{font-size:44px;font-weight:900}
.muted{color:var(--dim);font-weight:600;text-align:center}
.story{max-width:440px;font-size:17px;line-height:1.55;font-weight:600;white-space:pre-line;min-height:220px}
.story b{color:var(--cyan)}
.who{font-size:12px;letter-spacing:.3em;color:var(--orange);font-weight:900}
#hud{position:fixed;left:0;right:0;top:0;z-index:5;display:none;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;pointer-events:none}
#hud.on{display:block}
#hud .top{margin:0 auto}
#hud .ico{pointer-events:auto}
.lives{display:flex;gap:4px}.lives span{font-size:18px;filter:drop-shadow(0 0 6px rgba(56,225,255,.6))}.lives span.off{opacity:.2;filter:none}
.bar{height:8px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;width:100%;max-width:520px;margin:8px auto 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),#9bffea);border-radius:6px;transition:width .2s}
.combo{position:fixed;left:50%;top:92px;transform:translateX(-50%);font-weight:900;font-size:22px;color:var(--orange);text-shadow:0 0 14px rgba(255,154,60,.7);z-index:6;pointer-events:none;opacity:0;transition:opacity .2s}
.pw{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;gap:10px;z-index:6}
.pw button{width:58px;height:58px;border-radius:18px;border:1px solid var(--line);background:var(--panel);color:#fff;font-size:26px;position:relative;cursor:pointer}
.pw button span{position:absolute;right:-4px;top:-6px;background:var(--orange);color:#1c0b00;border-radius:999px;font-size:12px;font-weight:900;padding:1px 6px}
.pw button[disabled]{opacity:.35}
.toastx{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:30;background:var(--panel);border:1px solid var(--line);padding:14px 18px;border-radius:16px;font-weight:900;font-size:18px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}
.intro{display:flex;gap:14px;align-items:center}
.intro canvas{position:static;width:84px;height:84px;flex:none}
.tag{display:inline-block;font-size:11px;letter-spacing:.2em;color:var(--orange);font-weight:900}
.daily{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;width:100%}
.daily div{border-radius:12px;padding:8px 2px;text-align:center;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:12px}
.daily div.got{opacity:.4}.daily div.now{background:linear-gradient(180deg,#ffbe6b,#ff8a1f);color:#2a1300}
.tabs{display:flex;gap:8px;width:100%;max-width:420px}
.tabs .btn{flex:1;min-width:0}
.hint{position:fixed;z-index:7;pointer-events:none;font-size:40px;transition:transform .5s}

<canvas id="cv"></canvas>

<div id="hud">
  <div class="top">
    <div class="lives" id="lives"></div>
    <div class="chip" id="hudScore">0</div>
    <div class="ico" id="pauseBtn" aria-label="pause">❚❚</div>
  </div>
  <div class="bar" id="goalBar"><i></i></div>
</div>
<div class="combo" id="combo"></div>
<div class="pw" id="pw" style="display:none">

  <button id="pwNuke" aria-label="nuke">☢️<span>0</span></button>
</div>
<div class="toastx" id="toastx"></div>

<!-- MENÜ -->
<section class="scr" id="sMenu">
  <div class="top"><div class="chip"><i class="coin"></i><span class="coins">0</span></div><div class="row"><div class="ico" id="sndBtn">🔊</div><div class="ico" id="langBtn">🌐</div></div></div>
  <div class="col" style="margin-top:auto;margin-bottom:auto">
    <img class="logo" src="img/mekik.png" alt="">
    <h1>SPACE SHUTTLE<small data-t="subtitle"></small></h1>
    <p class="muted" data-t="tagline" style="max-width:320px"></p>
    <button class="btn o" id="playBtn"><span data-t="play"></span></button>
    <button class="btn" id="endlessBtn"><span data-t="endless"></span></button>
    <div class="row">
      <button class="btn ghost sm" id="hangarBtn">🛠 <span data-t="hangar"></span></button>
      <button class="btn ghost sm" id="dailyBtn">🎁 <span data-t="daily"></span></button>
      <button class="btn ghost sm" id="storyBtn">📜 <span data-t="storyT"></span></button>
    </div>
    <p class="muted" id="bestTxt" style="font-size:13px"></p>
  </div>
</section>

<!-- BÖLÜM HARİTASI -->
<section class="scr" id="sMap">
  <div class="top"><div class="ico" data-back>←</div><h2 data-t="missions"></h2><div class="chip"><i class="coin"></i><span class="coins">0</span></div></div>
  <div class="col" id="mapBody"></div>
</section>

<!-- HANGAR -->
<section class="scr" id="sHangar">
  <div class="top"><div class="ico" data-back>←</div><h2 data-t="hangar"></h2><div class="chip"><i class="coin"></i><span class="coins">0</span></div></div>
  <div class="col" id="hangarBody"></div>
</section>

<!-- HİKAYE -->
<section class="scr dim" id="sStory">
  <div class="col" style="margin:auto">
    <div class="who" id="storyWho"></div>
    <div class="card story" id="storyTxt"></div>
    <button class="btn o" id="storyNext"><span data-t="next"></span></button>
  </div>
</section>

<!-- YENİ TEHDİT TANITIMI -->
<section class="scr dim" id="sIntro">
  <div class="col" style="margin:auto">
    <div class="card"><div class="intro"><canvas id="introCv" width="168" height="168"></canvas><div><span class="tag" data-t="newThreat"></span><h2 style="text-align:left;margin:4px 0" id="introName"></h2><div class="muted" style="text-align:left" id="introDesc"></div></div></div></div>
    <button class="btn o" id="introOk"><span data-t="gotIt"></span></button>
  </div>
</section>

<!-- DURAKLAT -->
<section class="scr dim" id="sPause">
  <div class="col" style="margin:auto">
    <h2 data-t="paused"></h2>
    <button class="btn o" id="resumeBtn"><span data-t="resume"></span></button>
    <button class="btn ghost" id="quitBtn"><span data-t="quit"></span></button>
  </div>
</section>

<!-- SONUÇ -->
<section class="scr dim" id="sResult">
  <div class="col" style="margin:auto">
    <div class="tag" id="resTag"></div>
    <h2 id="resTitle"></h2>
    <div class="stars" id="resStars"><span>★</span><span>★</span><span>★</span></div>
    <div class="card col" style="gap:6px">
      <div class="muted" id="resLine1"></div>
      <div class="row"><i class="coin"></i><span class="big" id="resCoins">0</span></div>
    </div>
    <button class="btn g" id="resDouble">▶ <span data-t="double"></span></button>
    <button class="btn o" id="resNext"><span data-t="continue"></span></button>
    <button class="btn ghost sm" id="resRetry"><span data-t="retry"></span></button>
    <button class="btn ghost sm" id="resMenu"><span data-t="menu"></span></button>
  </div>
</section>

<!-- GÜNLÜK ÖDÜL -->
<section class="scr dim" id="sDaily">
  <div class="col" style="margin:auto">
    <h2 data-t="dailyT"></h2>
    <div class="daily" id="dailyGrid"></div>
    <p class="muted" id="dailyMsg"></p>
    <button class="btn o" id="dailyClaim"><span data-t="claim"></span></button>
    <button class="btn g sm" id="dailyAd">▶ <span data-t="dailyAd"></span></button>
    <button class="btn ghost sm" data-back><span data-t="close"></span></button>
  </div>
</section>

const IMG={};
function loadImg(n,src){return new Promise(r=>{const i=new Image();i.onload=()=>{IMG[n]=i;r();};i.onerror=()=>r();i.src=src;});}
let AC=null,master=null,musicGain=null,sfxGain=null;const BUF={};let musicSrc=null,ambSrc=null;
function audioInit(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.connect(AC.destination);musicGain=AC.createGain();musicGain.gain.value=.38;musicGain.connect(master);sfxGain=AC.createGain();sfxGain.gain.value=.7;sfxGain.connect(master);master.gain.value=S.sound?1:0;
 ['muzik','ambiyans','patlama','bitti'].forEach(n=>fetch('snd/'+n+'.mp3').then(r=>r.arrayBuffer()).then(b=>AC.decodeAudioData(b)).then(d=>{BUF[n]=d;if(n==='muzik')playMusic('muzik');}).catch(()=>{}));}catch(e){}}
function playBuf(n,vol,rate){if(!AC||!BUF[n])return;const s=AC.createBufferSource();s.buffer=BUF[n];s.playbackRate.value=rate||1;const g=AC.createGain();g.gain.value=vol==null?1:vol;s.connect(g);g.connect(sfxGain);s.start();}
let curMusic='';
function playMusic(n){if(!AC)return;if(curMusic===n&&musicSrc)return;curMusic=n;if(musicSrc){try{musicSrc.stop();}catch(e){}musicSrc=null;}if(!BUF[n])return;musicSrc=AC.createBufferSource();musicSrc.buffer=BUF[n];musicSrc.loop=true;musicSrc.connect(musicGain);musicSrc.start();}
function blip(f,d,type,v){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,AC.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(40,f*.5),AC.currentTime+d);g.gain.setValueAtTime(v||.25,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(sfxGain);o.start();o.stop(AC.currentTime+d);}

function drawBg(dt,speedMul){
  const img=sector===1?IMG.bg2:IMG.bg1;
  cx.fillStyle='#05060f';cx.fillRect(0,0,W,H);
  if(img){const s=Math.max(W/img.width,H/img.height)*1.15;const iw=img.width*s,ih=img.height*s;bgOff=(bgOff+dt*6*speedMul)%ih;
    cx.globalAlpha=sector===2?.55:.8;let y=-ih+bgOff;cx.drawImage(img,(W-iw)/2,y,iw,ih);cx.drawImage(img,(W-iw)/2,y+ih,iw,ih);cx.globalAlpha=1;}
  if(sector===2){const g=cx.createRadialGradient(W/2,-H*.2,10,W/2,-H*.2,H*.9);g.addColorStop(0,'rgba(255,40,70,.35)');g.addColorStop(1,'rgba(255,40,70,0)');cx.fillStyle=g;cx.fillRect(0,0,W,H);}
  for(const s of stars){s.y+=dt*.03*s.z*speedMul;if(s.y>1)s.y-=1;cx.fillStyle='rgba(255,255,255,'+(.35+.65*s.z)*.8+')';const r=s.z*1.6;cx.fillRect(s.x*W,s.y*H,r,r);}
  if(!G)return;
  // yörünge çizgisi
  const oy=orbitY();const pulse=.35+.25*Math.sin(perfNow()/300);
  const og=cx.createLinearGradient(0,oy-24,0,oy+24);og.addColorStop(0,'rgba(255,77,94,0)');og.addColorStop(.5,'rgba(255,77,94,'+pulse+')');og.addColorStop(1,'rgba(255,77,94,0)');cx.fillStyle=og;cx.fillRect(0,oy-24,W,48);
  cx.setLineDash([10,8]);cx.strokeStyle='rgba(255,120,130,.7)';cx.lineWidth=1.5;cx.beginPath();cx.moveTo(0,oy);cx.lineTo(W,oy);cx.stroke();cx.setLineDash([]);
}

const TYPES={
 normal:{hp:1,speed:1,scale:1,coins:1,score:10},
 fast:{hp:1,speed:1.55,scale:.85,coins:2,score:20},
 armor:{hp:3,speed:.78,scale:1.12,coins:3,score:35},

let G=null; // aktif oyun
let state='menu'; // menu | play | pause | over
function levelCfg(n){
  const s=Math.floor((n-1)/10),w=(n-1)%10+1,boss=w===10;
  const k=n-1;
  const c={n,sector:s,boss,goal:boss?0:Math.min(90,14+Math.round(k*2.2)),gap:Math.max(.5,1.05-k*.019),rise:Math.max(3.1,6.4-k*.115),mix:{normal:10}};
  if(n>=3)c.mix.fast=2+Math.min(6,k*.25);
  if(n>=4)c.mix.civil=1.6+Math.min(3,k*.08);
  if(n>=6)c.mix.armor=1.5+Math.min(5,k*.2);
  if(n>=12)c.mix.split=1.5+Math.min(4,k*.15);
  c.mix.gold=.45;
  if(boss)c.bossHp=[28,45,70][s];
  return c;
}
function endlessCfg(time){const k=Math.min(40,time/9);return {n:0,sector:Math.min(2,Math.floor(time/120)),boss:false,goal:0,gap:Math.max(.42,1-k*.016),rise:Math.max(2.7,6-k*.1),mix:{normal:10,fast:2+k*.2,civil:k>3?2:0,armor:k>6?1.5+k*.1:0,split:k>12?2:0,gold:.5}};}
function pick(mix){let tot=0;for(const k in mix)tot+=mix[k];let r=Math.random()*tot;for(const k in mix){r-=mix[k];if(r<=0)return k;}return 'normal';}

function startGame(mode,n){
  audioInit();
  const cfg=mode==='endless'?endlessCfg(0):levelCfg(n);
  sector=cfg.sector;
  const lives=3+S.up.shield;
  G={mode,cfg,n,time:0,spawnT:1.2,ships:[],fx:[],parts:[],drops:[],floats:[],lives,maxLives:lives,killed:0,score:0,coins:0,combo:0,comboT:0,freeze:0,revived:false,boss:null,lostLife:0,civHit:0,ended:false,
     bonus:{freeze:(S.up.start>=1?1:0)+(S.up.start>=3?1:0),nuke:(S.up.start>=2?1:0)+(S.up.start>=4?1:0)+(S.up.start>=5?1:0)},introQueue:[]};
  // G.inv: görünen toplam (kalıcı stok + bu göreve özel başlangıç bonusu). Bonus önce harcanır.
  G.inv={freeze:S.inv.freeze+G.bonus.freeze,nuke:S.inv.nuke+G.bonus.nuke};

}
function queueIntros(){const types=Object.keys(G.cfg.mix).filter(k=>k!=='gold'&&G.cfg.mix[k]>0);if(G.cfg.boss)types.push('boss');for(const k of types){if(!S.seen[k]){G.introQueue.push(k);}}if(G.introQueue.length)setTimeout(nextIntro,350);}
function nextIntro(){if(!G||!G.introQueue.length)return;const k=G.introQueue.shift();S.seen[k]=1;save();state='pause';
  const ic=document.getElementById('introCv'),g=ic.getContext('2d');g.clearRect(0,0,168,168);drawShipIcon(g,k,84,84,k==='boss'?1.25:1.6);

function spawnBoss(){const r=(IMG.mekik?IMG.mekik.width:180);G.boss={type:'boss',x:W/2,y:H+60*U,vy:0,hp:G.cfg.bossHp,maxHp:G.cfg.bossHp,scale:TYPES.boss.scale,wob:0,hitT:0,spawnT:2};G.ships.push(G.boss);}
function spawn(type,x,y,opts){
  const T=TYPES[type];const rise=G.cfg.rise/T.speed;const dist=H+120*U;
  const sh={type,x:x!=null?x:(40*U+Math.random()*(W-80*U)),y:y!=null?y:H+70*U,vy:-dist/rise,vx:0,hp:T.hp,maxHp:T.hp,scale:T.scale,wob:Math.random()*6,hitT:0,trail:[]};
  if(opts)Object.assign(sh,opts);

let pointerDown=false;
cv.addEventListener('pointerdown',e=>{audioInit();if(AC&&AC.state==='suspended')AC.resume();if(state!=='play'||!G)return;e.preventDefault();tap(e.clientX,e.clientY);});
function tap(px,py){
  // önce düşen cephaneye bak
  for(const d of G.drops){if(Math.hypot(d.x-px,d.y-py)<38*U){d.dead=true;G.inv[d.kind]++;S.inv[d.kind]++;save();floatTxt(d.x,d.y,'+1 '+(d.kind==='freeze'?'❄️':'☢️'),'#9bffea');blip(880,.15,'triangle',.2);updateHud();return;}}
  let best=null,bd=1e9;
  for(const sh of G.ships){if(sh.dead)continue;const sz=shipSize(sh);const dx=Math.abs(px-sh.x),dy=Math.abs(py-sh.y);const pad=sh.type==='boss'?0:14*U;
    if(dx<sz.w*.55+pad&&dy<sz.h*.5+pad){const d=Math.hypot(dx,dy);if(d<bd){bd=d;best=sh;}}}
  if(!best){G.combo=0;return;}
  hit(best,1,true);
}
function hit(sh,dmg,direct){
  if(sh.type==='civil'){if(!direct)return;killShip(sh,false);G.civHit++;loseLife(true);floatTxt(sh.x,sh.y,t('civHit'),'#7fb7ff');return;}
  sh.hp-=dmg;sh.hitT=.12;
  if(sh.type==='boss'){sh.y+=18*U;blip(160+Math.random()*60,.08,'square',.12);shake=Math.max(shake,4);burst(sh.x+(Math.random()-.5)*40*U,sh.y-(Math.random())*60*U,6,'#ffb347');
    if(sh.hp<=0){killShip(sh,true);setTimeout(()=>{if(G&&!G.ended)win();},1300);for(let i=0;i<8;i++)setTimeout(()=>{if(G)explode(sh.x+(Math.random()-.5)*120*U,sh.y+(Math.random()-.5)*160*U,1.6);},i*120);shake=18;}
    updateHud();return;}
  if(sh.hp>0){blip(300,.07,'square',.12);burst(sh.x,sh.y,5,'#cfd8ff');return;}
  killShip(sh,true);
}
function killShip(sh,reward){
  sh.dead=true;explode(sh.x,sh.y,sh.scale);
  if(!reward)return;
  const T=TYPES[sh.type];
  G.killed+=sh.type==='mini'?0:1;
  G.combo=G.comboT>0?G.combo+1:1;G.comboT=.9;
  const mult=Math.min(5,1+Math.floor(G.combo/4));
  G.score+=T.score*mult;
  let c=T.coins+(S.up.gold?Math.floor(T.coins*S.up.gold*.25+ (Math.random()<S.up.gold*.12?1:0)):0);
  G.coins+=c;if(c>=5)floatTxt(sh.x,sh.y-20*U,'+'+c,'#ffd23f');
  if(mult>1)showCombo(mult);
  if(sh.type==='split'){spawn('mini',sh.x-14*U,sh.y,{vy:sh.vy*1.3});spawn('mini',sh.x+14*U,sh.y,{vy:sh.vy*1.3});}
  // şok dalgası
  if(S.up.blast&&sh.type!=='boss'){const R=(40+S.up.blast*14)*U;for(const o of G.ships){if(o!==sh&&!o.dead&&o.type!=='civil'&&o.type!=='boss'&&Math.hypot(o.x-sh.x,o.y-sh.y)<R){const oo=o;setTimeout(()=>{if(G&&!oo.dead)hit(oo,1,false);},90);}}}
  // cephane düşürme
  if(sh.type!=='mini'&&Math.random()<.045){G.drops.push({x:sh.x,y:sh.y,kind:Math.random()<.6?'freeze':'nuke',t:0});}
  vib(sh.type==='boss'?80:12);
  if(G.mode==='level'&&!G.cfg.boss&&G.killed>=G.cfg.goal)win();
  updateHud();
}
function explode(x,y,s){G.fx.push({x,y,t:0,s:s||1});playBuf('patlama',.55,.9+Math.random()*.25);burst(x,y,14,'#ffb347');}
function burst(x,y,n,col){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=(60+Math.random()*220)*U;G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,life:.4+Math.random()*.5,col});}}
function floatTxt(x,y,s,col){G.floats.push({x,y,s,col,t:0});}
function loseLife(civ){G.lives--;G.lostLife++;shake=12;vib(60);blip(120,.35,'sawtooth',.25);if(!civ)flash=0.35;updateHud();if(G.lives<=0)fail();}
let flash=0;

/* güçler */
function useItem(k){G.inv[k]--;if(G.bonus[k]>0)G.bonus[k]--;else{S.inv[k]=Math.max(0,S.inv[k]-1);save();}}
function useFreeze(){if(state!=='play'||!G||G.inv.freeze<=0||G.freeze>0)return;useItem('freeze');G.freeze=3+S.up.freeze*.8;blip(1200,.4,'sine',.2);floatTxt(W/2,H/2,'❄️','#9bffea');updateHud();}
function useNuke(){if(state!=='play'||!G||G.inv.nuke<=0)return;useItem('nuke');flash=.6;shake=16;for(const sh of G.ships){if(sh.dead||sh.type==='civil')continue;if(sh.type==='boss')hit(sh,Math.ceil(sh.maxHp*.2),false);else{sh.hp=0;killShip(sh,true);}}blip(90,.6,'sawtooth',.35);updateHud();}

/* ---------------- Döngü ---------------- */
let last=perfNow();
function loop(now){
  let dt=Math.min(.05,(now-last)/1000);last=now;
  const playing=state==='play'&&G;
  const fr=playing&&G.freeze>0;
  drawBg(dt,fr?0.15:1);
  if(G){ if(playing)update(dt);draw(dt,playing); }
  else drawMenuShips(dt);
  if(flash>0){cx.fillStyle='rgba(255,255,255,'+Math.min(.6,flash)+')';cx.fillRect(0,0,W,H);flash-=dt*1.6;}
  requestAnimationFrame(loop);
}
function update(dt){
  G.time+=dt;
  if(G.mode==='endless'){const c=endlessCfg(G.time);c.mix=c.mix;G.cfg=c;if(c.sector!==sector)sector=c.sector;}
  const sp=G.freeze>0?.12:1;if(G.freeze>0)G.freeze-=dt;
  if(G.comboT>0){G.comboT-=dt;if(G.comboT<=0)G.combo=0;}
  // doğurma
  if(!G.ended){
    G.spawnT-=dt*sp;
    const maxAlive=G.cfg.boss?3:99;
    const alive=G.ships.filter(s=>!s.dead&&s.type!=='boss').length;
    if(G.spawnT<=0&&alive<maxAlive&&!(G.mode==='level'&&!G.cfg.boss&&G.killed+alive>=G.cfg.goal+3)){
      let type=pick(G.cfg.boss?{normal:6,fast:2,civil:1}:G.cfg.mix);
      if(G.tutorial&&G.time<6)type='normal';
      spawn(type);G.spawnT=G.cfg.gap*(0.75+Math.random()*.5)*(G.cfg.boss?2.2:1);
      if(Math.random()<Math.min(.25,G.time/240)&&!G.cfg.boss)spawn('normal');
    }
  }
  const oy=orbitY();
  for(const sh of G.ships){if(sh.dead)continue;
    sh.wob+=dt*2;
    if(sh.type==='boss'){sh.y+=(-H*TYPES.boss.speed/ (G.cfg.rise/6.4) /6)*dt*sp; sh.x=W/2+Math.sin(sh.wob*.6)*W*.18;
      sh.spawnT-=dt*sp;if(sh.spawnT<=0){spawn(Math.random()<.3?'fast':'normal',sh.x+(Math.random()-.5)*80*U,sh.y-40*U);sh.spawnT=Math.max(1.1,2.6-G.time*.01);}
      if(sh.y-shipSize(sh).h*.5<oy){G.lives=1;loseLife();}
      continue;}
    sh.y+=sh.vy*dt*sp;sh.x+=Math.sin(sh.wob)*12*U*dt*sp;
    if(sh.type==='fast'||sh.type==='mini'){sh.trail.push({x:sh.x,y:sh.y+shipSize(sh).h*.5});if(sh.trail.length>14)sh.trail.shift();}
    if(sh.hitT>0)sh.hitT-=dt;
    if(sh.y<oy){sh.dead=true;
      if(sh.type==='civil'){G.coins+=5;floatTxt(sh.x,oy+30*U,t('civSaved'),'#7fb7ff');blip(660,.2,'triangle',.18);}
      else if(sh.type!=='gold'){loseLife();burst(sh.x,oy,10,'#ff4d5e');}
    }
  }
  G.ships=G.ships.filter(s=>!s.dead);
  for(const d of G.drops){d.t+=dt;d.y-=30*U*dt;if(d.t>6)d.dead=true;}
  G.drops=G.drops.filter(d=>!d.dead);
  if(G.tutorial&&G.killed>=3){G.tutorial=false;S.seen.tutorial=1;save();}
}
function draw(dt,playing){
  cx.save();
  if(shake>0){cx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake=Math.max(0,shake-dt*40);}
  // izler
  for(const sh of G.ships){if(sh.trail&&sh.trail.length>1){cx.strokeStyle=sh.type==='mini'?'rgba(255,170,60,.6)':'rgba(255,60,80,.65)';cx.lineWidth=6*U*sh.scale;cx.lineCap='round';cx.beginPath();cx.moveTo(sh.trail[0].x,sh.trail[0].y);for(const p of sh.trail)cx.lineTo(p.x,p.y);cx.stroke();}}
  for(const sh of G.ships)drawShip(cx,sh);
  // patlamalar (orijinal sprite sayfası 2x2)
  for(const f of G.fx){f.t+=dt;const fr=Math.min(3,Math.floor(f.t/0.075));const im=IMG.patlama;const sz=110*U*f.s;
    if(im){const fw=im.width/2;cx.drawImage(im,(fr%2)*fw,Math.floor(fr/2)*fw,fw,fw,f.x-sz/2,f.y-sz/2,sz,sz);} }
  G.fx=G.fx.filter(f=>f.t<.3);
  for(const p of G.parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;cx.globalAlpha=Math.max(0,1-p.t/p.life);cx.fillStyle=p.col;cx.fillRect(p.x,p.y,3*U,3*U);}cx.globalAlpha=1;
  G.parts=G.parts.filter(p=>p.t<p.life);
  for(const d of G.drops){const r=24*U;cx.fillStyle='rgba(12,18,40,.85)';cx.strokeStyle=d.kind==='freeze'?'#9bffea':'#ffb347';cx.lineWidth=2;cx.beginPath();cx.arc(d.x,d.y,r,0,7);cx.fill();cx.stroke();cx.font=(22*U)+'px system-ui';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(d.kind==='freeze'?'❄️':'☢️',d.x,d.y+1);}
  for(const f of G.floats){f.t+=dt;cx.globalAlpha=Math.max(0,1-f.t/1.1);cx.fillStyle=f.col;cx.font='900 '+(18*U)+'px system-ui';cx.textAlign='center';cx.fillText(f.s,f.x,f.y-f.t*50*U);}cx.globalAlpha=1;
  G.floats=G.floats.filter(f=>f.t<1.1);
  if(G.freeze>0){cx.fillStyle='rgba(120,220,255,.12)';cx.fillRect(0,0,W,H);}
  if(G.tutorial&&playing){const tg=G.ships.find(s=>s.type==='normal');if(tg){cx.font=(40*U)+'px system-ui';cx.textAlign='center';cx.fillText('👆',tg.x+20*U,tg.y+50*U+Math.sin(perfNow()/150)*6);}}
  cx.restore();
}
function drawShip(g,sh){
  const sz=shipSize(sh);let img=IMG.mekik;
  if(sh.type==='fast'||sh.type==='mini')img=tinted('fast','#ff3b4f',.28);
  else if(sh.type==='armor')img=tinted('armor','#5a6378',.45);
  else if(sh.type==='gold')img=tinted('gold','#ffc400',.55);
  else if(sh.type==='boss')img=tinted('boss','#3b0010',.55);
  if(!img)return;
  // motor alevi
  const fl=(.8+Math.random()*.4);const fy=sh.y+sz.h*.4;
  const grad=g.createRadialGradient(sh.x,fy,1,sh.x,fy+sz.h*.25*fl,sz.w*.45);grad.addColorStop(0,'rgba(255,255,220,.95)');grad.addColorStop(.3,'rgba(255,170,60,.8)');grad.addColorStop(1,'rgba(255,80,20,0)');
  g.fillStyle=grad;g.beginPath();g.ellipse(sh.x,fy+sz.h*.12*fl,sz.w*.22,sz.h*.28*fl,0,0,7);g.fill();
  g.save();g.translate(sh.x,sh.y);g.rotate(Math.sin(sh.wob)*.05);
  if(sh.type==='civil'){const bl=.5+.5*Math.sin(perfNow()/120);g.shadowColor='rgba(80,160,255,1)';g.shadowBlur=24*U*bl+6;}
  if(sh.type==='gold'){g.shadowColor='rgba(255,210,63,1)';g.shadowBlur=22*U;}
  if(sh.type==='boss'){g.shadowColor='rgba(255,30,60,.9)';g.shadowBlur=40*U;}
  if(sh.hitT>0)g.filter='brightness(2.2)';
  g.drawImage(img,-sz.w/2,-sz.h/2,sz.w,sz.h);g.filter='none';g.shadowBlur=0;
  if(sh.type==='civil'){const bl=Math.sin(perfNow()/120)>0;g.fillStyle=bl?'#4da3ff':'#cfe6ff';g.beginPath();g.arc(-sz.w*.32,sz.h*.05,4*U,0,7);g.arc(sz.w*.32,sz.h*.05,4*U,0,7);g.fill();g.fillStyle='rgba(77,163,255,.95)';g.beginPath();g.arc(0,-sz.h*.18,5*U,0,7);g.fill();}
  if(sh.type==='armor'){g.strokeStyle='rgba(200,215,255,.75)';g.lineWidth=2.5*U;g.strokeRect(-sz.w*.2,-sz.h*.3,sz.w*.4,sz.h*.5);}
  if(sh.type==='split'){g.strokeStyle='rgba(255,170,60,.95)';g.setLineDash([4*U,4*U]);g.lineWidth=2*U;g.beginPath();g.moveTo(0,-sz.h*.45);g.lineTo(0,sz.h*.4);g.stroke();g.setLineDash([]);}
  g.restore();
  if(sh.maxHp>1){const bw=sz.w*(sh.type==='boss'?1:.8),bh=sh.type==='boss'?8*U:5*U,by=sh.y-sz.h*.55-10*U;g.fillStyle='rgba(0,0,0,.6)';g.fillRect(sh.x-bw/2,by,bw,bh);g.fillStyle=sh.type==='boss'?'#ff4d5e':'#9bffea';g.fillRect(sh.x-bw/2,by,bw*Math.max(0,sh.hp/sh.maxHp),bh);
    if(sh.type==='boss'){g.font='900 '+(12*U)+'px system-ui';g.textAlign='center';g.fillStyle='#ffd0d6';g.fillText(t('boss'),sh.x,by-6*U);}}
}
function drawShipIcon(g,type,x,y,s){const save=G;const fake={type,x,y,scale:s*(TYPES[type]?TYPES[type].scale:1)/(type==='boss'?2.2:1),wob:0,hitT:0,maxHp:1,hp:1};const oldU=U;U=1;drawShip(g,fake);U=oldU;}
/* menü arka planında süzülen mekikler */
const menuShips=[];
function drawMenuShips(dt){if(menuShips.length<5&&Math.random()<dt*.8)menuShips.push({type:Math.random()<.2?'civil':'normal',x:Math.random()*W,y:H+80,vy:-(40+Math.random()*50),scale:.6+Math.random()*.5,wob:Math.random()*6,hitT:0,maxHp:1,hp:1});

/* ---------------- Sonuç ---------------- */
function commitInv(){save();}
let resCoins=0,resDoubled=false;
function win(){if(G.ended)return;G.ended=true;state='over';
  // ekrandaki tehditleri patlat
  for(const sh of G.ships)if(!sh.dead&&sh.type!=='civil'){sh.dead=true;explode(sh.x,sh.y,sh.scale);}
  const stars=G.lostLife===0&&G.civHit===0?3:(G.lostLife<=1?2:1);const n=G.n;
  const bonus=[0,20,35,55][stars]+(G.cfg.boss?80:0);
  resCoins=G.coins+bonus;S.coins+=resCoins;S.stars[n]=Math.max(S.stars[n]||0,stars);if(S.unlocked===n)S.unlocked=Math.min(31,n+1);commitInv();save();
  setTimeout(()=>{hud(false);showResult('win',stars);},900);playBuf('patlama',.4,.6);}
function fail(){if(G.ended)return;G.ended=true;state='over';
  setTimeout(()=>{
    if(!G.revived&&AdKit.left()>0){AdKit.offer({title:t('reviveT'),text:t('reviveX'),button:t('reviveB'),reward:'🛡️🛡️',placement:'revive',timeout:8}).then(ok=>{if(ok){revive();}else finishFail();});}
    else finishFail();
  },700);playBuf('bitti',.8);}
function revive(){G.revived=true;G.ended=false;G.lives=2;G.maxLives=Math.max(G.maxLives,2);for(const sh of G.ships)if(!sh.dead&&sh.type!=='boss'){sh.dead=true;explode(sh.x,sh.y,sh.scale);}if(G.boss&&!G.boss.dead)G.boss.y=Math.max(G.boss.y,H*.8);G.freeze=2;state='play';last=perfNow();updateHud();}
function finishFail(){resCoins=G.coins;S.coins+=resCoins;commitInv();let nb=false;if(G.mode==='endless'&&G.score>S.best){S.best=G.score;nb=true;}save();hud(false);showResult(G.mode==='endless'?'endless':'fail',0,nb);}
function showResult(kind,stars,newBest){resDoubled=false;
  document.getElementById('resTag').textContent=G.mode==='endless'?t('endless'):(t('level')+' '+G.n);
  document.getElementById('resTitle').textContent=kind==='win'?t('win'):(kind==='endless'?t('endOver'):t('fail'));
  const st=document.getElementById('resStars');st.style.display=kind==='win'?'block':'none';st.querySelectorAll('span').forEach((s,i)=>{s.className='';if(i<stars)setTimeout(()=>{s.className='on';blip(700+i*200,.15,'triangle',.18);},300+i*280);});
  document.getElementById('resLine1').textContent=G.mode==='endless'?(t('score')+': '+G.score+(newBest?'  ·  '+t('newBest'):'  ·  '+t('best')+': '+S.best)):(G.killed+' '+t('killed'));
  document.getElementById('resCoins').textContent=resCoins;
  const db=document.getElementById('resDouble');db.style.display=resCoins>=10&&AdKit.left()>0?'flex':'none';db.disabled=false;
  db.onclick=()=>{if(resDoubled)return;AdKit.rewarded('double').then(ok=>{if(ok){resDoubled=true;S.coins+=resCoins;save();document.getElementById('resCoins').textContent=resCoins*2;db.disabled=true;blip(1100,.25,'triangle',.25);}});};
  const nx=document.getElementById('resNext');nx.style.display=kind==='win'&&G.n<30?'flex':'none';
  document.getElementById('resRetry').style.display=kind==='win'?'none':'flex';
  show('sResult');}
document.getElementById('resNext').onclick=()=>{const n=G.n+1;const done=resDoubled;AdKit.levelDone({reward:'+50 🪙',title:t('win')}).then(ok=>{if(ok){S.coins+=50;save();}
  const sIdx=Math.floor((n-1)/10);if((n-1)%10===0&&sIdx>0&&!S.seen['sect'+sIdx]){S.seen['sect'+sIdx]=1;save();playStory([[t('sector')+' '+(sIdx+1),(SECT_STORY[lang]||SECT_STORY.en)[sIdx]]],()=>startGame('level',n));}else startGame('level',n);});};
document.getElementById('resRetry').onclick=()=>{const m=G.mode,n=G.n;AdKit.breakpoint().then(()=>startGame(m,n));};
document.getElementById('resMenu').onclick=()=>{const wasFinal=G&&G.mode==='level'&&G.n===30&&G.ended&&S.stars[30];AdKit.breakpoint().then(()=>{if(wasFinal&&!S.seen.ending){S.seen.ending=1;save();goMenu();playStory([['ARGOS',(END_STORY[lang]||END_STORY.en)]],()=>show('sMenu'));}else{goMenu();}});};

/* ---------------- Başlat ---------------- */
Promise.all([loadImg('mekik','img/mekik.png'),loadImg('patlama','img/patlama.png'),loadImg('bg1','img/bg1.jpg'),loadImg('bg2','img/bg2.jpg')]).then(()=>{
  document.getElementById('sndBtn').textContent=S.sound?'🔊':'🔇';applyLang();show('sMenu');requestAnimationFrame(t=>{last=t;loop(t);});});
document.addEventListener('pointerdown',()=>{audioInit();if(AC&&AC.state==='suspended')AC.resume();},{once:false,passive:true});
window.__ss={get G(){return G;},get S(){return S;},startGame,win,fail};
</script>
