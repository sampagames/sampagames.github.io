html,body{height:100%}
body{background:var(--gece);color:var(--yazi);font-family:var(--f-govde);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}

.sp{flex:1}

.adbox{display:grid;place-items:center;gap:8px}
.adbox .cd{font-family:var(--f-baslik);font-size:56px;color:var(--serit)}

.lngb{justify-self:center;font-family:var(--f-govde);font-weight:900;font-size:13px;border-radius:999px;padding:6px 12px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.28);color:var(--soluk);cursor:pointer}

.lnglist .btn.on{background:var(--serit);color:#1b1b1b}
.card .rules span{overflow-wrap:anywhere}

n Richtung des Dachpfeils frei, fährt er raus und hält an der Haltestelle.","fr":"Touche un dolmus (minibus partagé) sur le parking. Si la voie est libre dans le sens de la flèche sur le toit, il sort et se gare à l'arrêt.","id":"Ketuk dolmus (minibus angkutan bersama) di parkiran. Jika jalan searah panah di atapnya kosong, ia keluar dan merapat ke halte.","ru":"Нажми на долмуш (маршрутку) на стоянке. Если путь по стрелке на крыше свободен, она выедет и встанет к остановке."},"rule2":{"tr":"Kuyruktaki yolcular kendi renklerindeki dolmuşa biner.","en":"Passengers in line board the minibus of their own color.","es":"Los pasajeros de la fila suben al minibús de su color.","pt":"Os passageiros da fila embarcam na van da sua cor.","de":"Wartende Fahrgäste steigen in den Minibus ihrer Farbe.","fr":"Les passagers de la file montent dans le minibus de leur couleur.","id":"Penumpang di antrean naik minibus yang warnanya sama.","ru":"Пассажиры из очереди садятся в маршрутку своего цвета."},"rule3":{"tr":"Dolmuş dolmadan kalkmaz. Cepler dolar ve öndeki yolcuya yer kalmazsa durak tıkanır.","en":"A minibus won't leave until it's full. If all bays fill up and the next passenger has no seat, the stop jams.","es":"El minibús no sale hasta llenarse. Si todos los lugares se ocupan y el siguiente pasajero no tiene sitio, la parada se atasca.","pt":"A van só sai quando lota. Se as vagas encherem e o próximo passageiro não tiver lugar, a parada trava.","de":"Ein Minibus fährt erst voll los. Sind alle Plätze belegt und der nächste Fahrgast findet keinen Sitz, ist die Haltestelle verstopft.","fr":"Un minibus ne part que plein. Si toutes les places sont prises et que le prochain passager n'a pas de siège, l'arrêt est bloqué.","id":"Minibus baru berangkat kalau penuh. Jika semua tempat terisi dan penumpang berikutnya tak dapat kursi, halte macet.","ru":"Маршрутка не уедет, пока не заполнится. Если все места заняты и следующему пассажиру некуда сесть, остановка встанет."},"contBtn":{"tr":"{n}. duraktan devam et","en":"Continue from stop {n}","es":"Seguir desde la parada {n}","pt":"Continuar da parada {n}","de":"Weiter ab Haltestelle {n}","fr":"Reprendre à l'arrêt {n}","id":"Lanjut dari halte {n}","ru":"Продолжить с остановки {n}"},"startBtn":{"tr":"Kontağı çevir","en":"Start the engine","es":"Arranca el motor","pt":"Dar a partida","de":"Motor an!","fr":"Démarre le moteur","id":"Nyalakan mesin","ru":"Заводи мотор"},"langTitle":{"tr":"Dil","en":"Language","es":"Idioma","pt":"Idioma","de":"Sprache","fr":"Langue","id":"Bahasa","ru":"Язык"},"langAria":{"tr":"Dili değiştir","en":"Change language","es":"Cambiar idioma","pt":"Mudar idioma","de":"Sprache ändern","fr":"Changer de langue","id":"Ganti bahasa","ru":"Сменить язык"},"back":{"tr":"Geri","en":"Back","es":"Volver","pt":"Voltar","de":"Zurück","fr":"Retour","id":"Kembali","ru":"Назад"},"col0":{"tr":"sarı","en":"yellow","es":"amarillo","pt":"amarelo","de":"gelb","fr":"jaune","id":"kuning","ru":"жёлтый"},"col1":{"tr":"kırmızı","en":"red","es":"rojo","pt":"vermelho","de":"rot","fr":"rouge","id":"merah","ru":"красный"},"col2":{"tr":"mavi","en":"blue","es":"azul","pt":"azul","de":"blau","fr":"bleu","id":"biru","ru":"синий"},"col3":{"tr":"yeşil","en":"green","es":"verde","pt":"verde","de":"grün","fr":"vert","id":"hijau","ru":"зелёный"},"col4":{"tr":"mor","en":"purple","es":"morado","pt":"roxo","de":"lila","fr":"violet","id":"ungu","ru":"фиолетовый"},"col5":{"tr":"turuncu","en":"orange","es":"naranja","pt":"laranja","de":"orange","fr":"orange","id":"oranye","ru":"оранжевый"},"col6":{"tr":"pembe","en":"pink","es":"rosa","pt":"rosa","de":"rosa","fr":"rose","id":"merah muda","ru":"розовый"},"col7":{"tr":"turkuaz","en":"turquoise","es":"turquesa","pt":"turquesa","de":"türkis","fr":"turquoise","id":"toska","ru":"бирюзовый"}};
var lang=null;
try{var s=localStorage.getItem('sg_lang');if(s&&LANGS.indexOf(s)>=0)lang=s}catch(e){}
if(!lang){var nl=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'']);
  for(var i=0;i<nl.length&&!lang;i++){var p=String(nl[i]||'').toLowerCase().split(/[-_]/)[0];if(p==='in')p='id';if(LANGS.indexOf(p)>=0)lang=p}}
if(!lang)lang='en';
window.SG_LANG=lang;window.SG_LANGS=LANGS;window.SG_LANG_NAMES=NAMES;
document.documentElement.lang=lang;
window.t=function(k,params){var e=D[k],s=e?(e[lang]!=null?e[lang]:e.en!=null?e.en:e.tr):null;if(s==null)s=k;
  if(params)s=s.replace(/\{(\w+)\}/g,function(m,n){return params[n]!=null?params[n]:m});return s};
window.sgSetLang=function(c){try{localStorage.setItem('sg_lang',c)}catch(e){}location.reload()};
document.title=t('title');
var q=function(sel,f){Array.prototype.forEach.call(document.querySelectorAll(sel),f)};
q('[data-i18n]',function(el){el.textContent=t(el.getAttribute('data-i18n'))});
q('[data-i18n-aria]',function(el){el.setAttribute('aria-label',t(el.getAttribute('data-i18n-aria')))});
q('[data-i18n-title]',function(el){el.setAttribute('title',t(el.getAttribute('data-i18n-title')))});
})();

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);

/* ---------- kayıt ---------- */
const KEY='dolmus-duragi-v1';
let S={level:1,sound:true,durak:1,vinc:1,best:1};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)S=Object.assign(S,s)}catch(e){}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

/* ---------- renkler ---------- */
const COLORS=[
  {n:'sarı',c:'#f6c531',d:'#b98c0c'},{n:'kırmızı',c:'#ef4f4a',d:'#a8231f'},{n:'mavi',c:'#3f8cf0',d:'#1f56a8'},
  {n:'yeşil',c:'#42c66b',d:'#22843f'},{n:'mor',c:'#9a63e8',d:'#6233a8'},{n:'turuncu',c:'#ff8f2e',d:'#b8590c'},
  {n:'pembe',c:'#ff74b5',d:'#b83a77'},{n:'turkuaz',c:'#22c8c0',d:'#118680'}];
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]];
const ANG=[-Math.PI/2,0,Math.PI/2,Math.PI];

/* ---------- bölüm üreteci ----------
   Araçlar sırayla, önleri o anda açıkken yerleştirilir. Ters sırayla çıkarmak her zaman çözümdür.
   Yolcu kuyruğu bu çözüm sırasından üretilip pencere içinde karıştırılır. */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function params(n){
  const cols=Math.min(4+Math.floor((n+2)/4),8), rows=Math.min(5+Math.floor((n+1)/3),11);
  const target=Math.min(3+Math.round(n*1.05),Math.floor(cols*rows/2.3));
  const colors=Math.min(2+Math.floor((n+1)/3),n<30?6:8);
  const maxL=n<3?2:n<12?3:4;
  const mix=n<3?1:n<8?2:n<20?3:4;
  return{cols,rows,target,colors,maxL,mix};
}
function genLevel(n,k=0){
  const P=params(n),r=rng(n*7919+k*104729+13),{cols,rows}=P;
  const occ=new Int16Array(cols*rows).fill(-1),vs=[];
  const inb=(x,y)=>x>=0&&y>=0&&x<cols&&y<rows;
  for(let t=0;t<cols*rows*30&&vs.length<P.target;t++){
    const x0=Math.floor(r()*cols),y0=Math.floor(r()*rows),d=Math.floor(r()*4);
    let L=2+Math.floor(Math.pow(r(),1.4)*(P.maxL-1));
    const [dx,dy]=DIRS[d],cells=[];let ok=true;
    for(let i=0;i<L;i++){const x=x0+dx*i,y=y0+dy*i;if(!inb(x,y)||occ[y*cols+x]!==-1){ok=false;break}cells.push([x,y])}
    if(!ok)continue;
    const [hx,hy]=cells[L-1];
    for(let x=hx+dx,y=hy+dy;inb(x,y);x+=dx,y+=dy)if(occ[y*cols+x]!==-1){ok=false;break}
    if(!ok)continue;
    const id=vs.length;vs.push({id,cells,dir:d,L,cap:L*2,color:0});
    for(const[x,y]of cells)occ[y*cols+x]=id;
  }
  // renk: her renk en az bir kez
  const order=[...Array(vs.length).keys()].sort(()=>r()-.5);
  order.forEach((id,i)=>vs[id].color=i<P.colors?i%P.colors:Math.floor(r()*P.colors));
  // kuyruk: çözüm sırası (ters ekleme), pencere içinde karıştır
  // Çözüm sırasında aynı anda en fazla P.mix dolmuş açık kalır (durakta 5 cep var), yolcular bunlardan karışık gelir.
  const q=[],ord=[];for(let i=vs.length-1;i>=0;i--)ord.push({c:vs[i].color,left:vs[i].cap});
  let open=ord.splice(0,P.mix);
  while(open.length){const o=open[Math.floor(r()*open.length)];q.push(o.c);
    if(--o.left===0){open=open.filter(x=>x!==o);if(ord.length)open.push(ord.shift())}}
  return{cols,rows,vs,occ,queue:q};
}

/* ---------- ses ---------- */
let AC=null;
function tone(f,d=.14,type='sine',v=.12,to=0,delay=0){
  if(!S.sound)return;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}
}
const sfx={
  go:()=>{tone(220,.12,'square',.05,330);tone(330,.18,'triangle',.07,520,.05)},
  bump:()=>{tone(130,.2,'square',.06,80)},
  board:i=>tone(520+(i%6)*60,.06,'triangle',.05),
  korna:()=>{tone(392,.12,'square',.06);tone(392,.16,'square',.06,0,.16)},
  full:()=>{tone(440,.14,'square',.05);tone(554,.2,'square',.05,0,.13)},
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.28,'triangle',.1,0,i*.1)),
  lose:()=>[330,262,196].forEach((f,i)=>tone(f,.32,'sine',.12,0,i*.15)),
  no:()=>tone(180,.12,'sine',.08)
};
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

/* ---------- ödüllü reklam köprüsü ----------
   Mobil paket AdKit.rewarded sağlarsa onu kullanır; tarayıcıda 3 sn'lik deneme ekranı gösterir. */
function rewarded(label,cb,placement){
  if(window.AdKit&&typeof window.AdKit.rewarded==='function'){
    const prev=paused;paused=true;
    window.AdKit.rewarded(placement||'reward').then(ok=>{paused=prev;if(ok)cb()},()=>{paused=prev});return}
  const prevPaused=paused;paused=true;let n=3;
  openCard(`<div class="kick">${t('adKick')}</div><div class="adbox"><div class="cd" id="adN">3</div><p>${label}</p></div>`);
  const iv=setInterval(()=>{n--;const el=$('adN');if(el)el.textContent=n;if(n<=0){clearInterval(iv);closeCard();paused=prevPaused;cb()}},1000);
}

/* ---------- oyun durumu ---------- */
let G=null,paused=false;
function start(n){
  n=Math.max(1,n);
  let lv=genLevel(n);
  for(let k=1;k<6&&lv.vs.length<params(n).target*.8;k++)lv=genLevel(n,k);
  const veh=lv.vs.map(v=>({...v,state:'park',bay:-1,seats:0,incoming:0,off:0,t:0,flash:0,px:0,py:0,ang:ANG[v.dir]}));
  G={n,cols:lv.cols,rows:lv.rows,occ:lv.occ,veh,queue:lv.queue,total:lv.queue.length,
     bays:5,bayVeh:[],fly:[],boardT:0,crane:false,done:false,shake:0,boarded:0,usedBoost:false,continued:false,t0:performance.now(),walk:0};
  G.bayVeh=Array(G.bays).fill(-1);
  S.level=n;persist();
  $('lvlN').textContent=n;setCrane(false);updHud();closeCard();layout();
  if(n===1)toast(t('tut1'),4200);
  else if(n===3)toast(t('tut3'),3800);
  else if(n===6)toast(t('tut6'),3800);
}
const freeBay=()=>G.bayVeh.indexOf(-1);

function rayInfo(v){
  const[hx,hy]=v.cells[v.cells.length-1],[dx,dy]=DIRS[v.dir];let x=hx+dx,y=hy+dy,free=0;
  while(x>=0&&y>=0&&x<G.cols&&y<G.rows){const o=G.occ[y*G.cols+x];if(o!==-1)return{free,blocker:o};free++;x+=dx;y+=dy}
  return{free,blocker:-1};
}
function tap(v){
  if(G.done||paused||v.state!=='park')return;
  const b=freeBay();
  if(b<0){toast(t('stopFull'));sfx.no();buzz(20);return}
  const ri=rayInfo(v);
  if(ri.blocker!==-1&&!G.crane){
    v.state='bump';v.t=0;v.bumpTo=ri.free+.28;G.veh[ri.blocker].flash=1;v.flash=1;sfx.bump();buzz([20,30,20]);return;
  }
  for(const[x,y]of v.cells)G.occ[y*G.cols+x]=-1;
  v.bay=b;G.bayVeh[b]=v.id;
  if(G.crane&&ri.blocker!==-1){
    S.vinc--;persist();G.usedBoost=true;setCrane(false);updHud();
    const c=cellCenter(v);v.sx=c.x;v.sy=c.y;v.sa=v.ang;v.state='lift';v.t=0;tone(300,.4,'sawtooth',.04,600);
  }else{
    if(G.crane)setCrane(false);
    v.state='exit';v.off=0;v.dist=ri.free+v.L/2+.9;v.spd=0;sfx.go();buzz(8);
  }
}

/* ---------- güçlendiriciler ---------- */
function setCrane(on){G&&(G.crane=on);$('bVinc').setAttribute('aria-pressed',on?'true':'false')}
$('bVinc').onclick=()=>{
  if(!G||G.done)return;
  if(G.crane){setCrane(false);return}
  if(S.vinc<=0){rewarded(t('adCrane'),()=>{S.vinc++;persist();updHud();toast(t('craneReady'))},'boost');return}
  setCrane(true);toast(t('craneOn'));
};
$('bDurak').onclick=()=>{
  if(!G||G.done)return;
  if(G.bays>=7){toast(t('maxBays'));return}
  if(S.durak<=0){rewarded(t('adBay'),()=>{S.durak++;persist();updHud();toast(t('bayAdded'))},'boost');return}
  S.durak--;persist();addBay();G.usedBoost=true;updHud();toast(t('newBay'));
};
function addBay(){G.bays++;G.bayVeh.push(-1);layout()}

/* ---------- güncelleme ---------- */
function update(dt){
  if(!G||paused)return;
  G.walk+=dt;
  for(const v of G.veh){
    v.flash=Math.max(0,v.flash-dt*2.5);
    if(v.state==='bump'){v.t+=dt;const T=.32,p=v.t/T;v.off=v.bumpTo*(p<.5?Math.sin(p*Math.PI):Math.sin(p*Math.PI));if(v.t>=T){v.off=0;v.state='park'}}
    else if(v.state==='exit'){v.spd=Math.min(v.spd+dt*60,16);v.off+=v.spd*dt;
      if(v.off>=v.dist){const c=cellCenter(v);v.sx=c.x+DIRS[v.dir][0]*v.off*cs;v.sy=c.y+DIRS[v.dir][1]*v.off*cs;v.sa=v.ang;v.state='travel';v.t=0}}
    else if(v.state==='lift'){v.t+=dt;if(v.t>=.45){v.state='travel';v.t=0;v.sx=v.px;v.sy=v.py;v.sa=v.ang}}
    else if(v.state==='travel'){v.t+=dt;if(v.t>=.42){v.state='bay';v.ang=-Math.PI/2;tone(660,.05,'triangle',.05)}}
    else if(v.state==='bay'&&v.seats>=v.cap&&!v.incoming){v.state='full';v.t=0;sfx.full()}
    else if(v.state==='full'){v.t+=dt;if(v.t>.2){v.state='depart';v.t=0;G.bayVeh[v.bay]=-1;v.bay0=v.bay;v.bay=-1}}
    else if(v.state==='depart'){v.t+=dt;if(v.t>=.6)v.state='gone'}
  }
  // yolcu uçuşları
  for(const f of G.fly){f.t+=dt/.2;if(f.t>=1&&!f.done){f.done=true;const v=G.veh[f.v];v.seats++;v.incoming--;}}
  G.fly=G.fly.filter(f=>!f.done);
  // binme
  G.boardT-=dt;
  while(G.boardT<=0&&G.queue.length){
    const c=G.queue[0];let best=null;
    for(const id of G.bayVeh){if(id<0)continue;const v=G.veh[id];
      if(v.state==='bay'&&v.color===c&&v.seats+v.incoming<v.cap&&(!best||v.seats+v.incoming>best.seats+best.incoming))best=v}
    if(!best)break;
    G.queue.shift();best.incoming++;G.boarded++;
    G.fly.push({v:best.id,c,t:0,fx:qFront.x,fy:qFront.y});
    sfx.board(G.boarded);G.boardT+=.075;updHud();
  }
  if(G.boardT<0)G.boardT=0;
  G.shake=Math.max(0,G.shake-dt*3);
  checkEnd();
}
function checkEnd(){
  if(G.done)return;
  const alive=G.veh.filter(v=>v.state!=='gone');
  if(!G.queue.length&&!alive.length&&!G.fly.length){win();return}
  if(!G.queue.length)return;
  const busy=G.fly.length||G.veh.some(v=>['exit','lift','travel','full','bump'].includes(v.state));
  if(busy)return;
  if(freeBay()>=0)return;
  const c=G.queue[0];
  if(G.bayVeh.some(id=>{const v=G.veh[id];return v.color===c&&v.seats+v.incoming<v.cap}))return;
  lose();
}

/* ---------- bitiş ---------- */
function win(){
  G.done=true;sfx.win();buzz([20,40,20]);
  const next=G.n+1;S.level=next;S.best=Math.max(S.best||1,next);
  const gift=G.n%5===0;if(gift){S.durak++;S.vinc++}
  persist();updHud();
  const secs=Math.round((performance.now()-G.t0)/1000);
  setTimeout(()=>openCard(`<div class="kick">${t('winKick',{n:G.n})}</div><h2>${t('winTitle')}</h2>
    <p>${t('winStats',{p:G.total,v:G.veh.length,s:secs})}${G.usedBoost?'':t('noHelp')}.${gift?t('gift'):''}</p>
    <button class="btn y" data-a="next">${t('nextBtn')}</button>`),500);
}
function lose(){
  G.done=true;sfx.lose();buzz([40,60,40]);G.shake=1;
  setTimeout(()=>openCard(`<div class="kick">${t('loseKick')}</div><h2>${t('loseTitle')}</h2>
    <p>${t('loseText',{a:G.total-G.queue.length,b:G.total,color:t('col'+G.queue[0])})}</p>
    ${S.durak>0&&G.bays<7?`<button class="btn y" data-a="usecont">${t('useCont',{n:S.durak})}</button>`:''}
    ${G.bays<7?'<button class="btn g" data-a="adcont">'+t('adCont')+'</button>':''}
    <button class="btn" data-a="retry">${t('retry')}</button>`),450);
}

/* ---------- arayüz ---------- */
let toastT=0;
function toast(t,ms=2600){const el=$('toast');el.textContent=t;el.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>el.style.opacity=0,ms)}
function openCard(h){$('card').innerHTML=h;$('ov').hidden=false;const b=$('card').querySelector('button');b&&b.focus({preventScroll:true})}
function closeCard(){$('ov').hidden=true}
function updHud(){
  $('left').textContent=G?G.queue.length:0;
  const nd=$('nDurak'),nv=$('nVinc');
  nd.textContent=S.durak>0?S.durak:'+';nd.className='n'+(S.durak>0?'':' ad');
  nv.textContent=S.vinc>0?S.vinc:'+';nv.className='n'+(S.vinc>0?'':' ad');
}
const SND_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const SND_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
const sndIcon=()=>$('sndBtn').innerHTML=S.sound?SND_ON:SND_OFF;sndIcon();
$('sndBtn').onclick=()=>{S.sound=!S.sound;persist();sndIcon()};
$('rstBtn').onclick=()=>G&&start(G.n);
$('card').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;
  if(a==='next'){
    if(window.AdKit&&window.AdKit.levelDone){closeCard();paused=true;
      window.AdKit.levelDone({title:t('adBonusTitle'),reward:t('plusCrane')}).then(ok=>{paused=false;start(S.level);if(ok){S.vinc++;persist();updHud();toast(t('bonusToast'))}})}
    else start(S.level);
  }
  else if(a==='retry')start(G.n);
  else if(a==='play'){closeCard();paused=false;sfx.korna()}
  else if(a==='lang')showLangs();
  else if(a==='intro')showIntro();
  else if(a==='setlang'){persist();if(b.dataset.l===window.SG_LANG)showIntro();else window.sgSetLang(b.dataset.l)}
  else if(a==='usecont'){S.durak--;persist();G.done=false;G.usedBoost=true;addBay();updHud();closeCard();toast(t('newBayGo'))}
  else if(a==='adcont'){
    rewarded(t('adRevive'),()=>{G.done=false;G.continued=true;addBay();closeCard();toast(t('newBayGo'))},'revive');
}
});

/* ---------- yerleşim ---------- */
const cv=$('c'),ctx=cv.getContext('2d');
let W=1,H=1,DPR=1,cs=40,lot={x:0,y:0,w:0,h:0},bayY=0,bayW=60,bayVW=30,qY=0,qFront={x:0,y:0},sT=0,sB=0;
function layout(){
  DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  const pc=getComputedStyle($('probe'));sT=parseFloat(pc.paddingTop)||0;sB=parseFloat(pc.paddingBottom)||0;
  if(!G)return;
  const top=sT+64,bottom=H-sB-74;
  const maxW=Math.min(W-32,560);
  qY=top+22;
  bayW=Math.min(maxW/G.bays,78);bayVW=Math.min(bayW*.62,34);
  const bayH=bayVW*.95*4+18;
  bayY=qY+40;
  const lotTop=bayY+bayH+26,availH=bottom-lotTop-14;
  cs=Math.max(18,Math.min((maxW-16)/G.cols,availH/G.rows,62));
  lot.w=cs*G.cols;lot.h=cs*G.rows;lot.x=(W-lot.w)/2;lot.y=lotTop+Math.max(0,(availH-lot.h)/2);
  qFront={x:W/2+Math.min(maxW,bayW*G.bays)/2-10,y:qY};
}
addEventListener('resize',layout);
const bayX=i=>W/2-(bayW*G.bays)/2+bayW*(i+.5);
const bayCY=v=>bayY+8+bayVW*.95*v.L/2;
function cellCenter(v){let x=0,y=0;for(const[cx,cy]of v.cells){x+=cx;y+=cy}x/=v.cells.length;y/=v.cells.length;return{x:lot.x+(x+.5)*cs,y:lot.y+(y+.5)*cs}}

/* ---------- çizim ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function drawVeh(x,y,ang,len,wid,col,o){
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);
  const C=COLORS[col];
  ctx.fillStyle='rgba(0,0,0,.35)';rr(-len/2+2,-wid/2+4,len,wid,wid*.28);ctx.fill();
  ctx.fillStyle='#111';const ww=len*.16,wh=wid*.14;
  for(const sx of[-len/2+len*.14,len/2-len*.3])for(const sy of[-wid/2-wh*.5,wid/2-wh*.5]){rr(sx,sy,ww,wh,2);ctx.fill()}
  ctx.fillStyle=C.d;rr(-len/2,-wid/2,len,wid,wid*.28);ctx.fill();
  ctx.fillStyle=C.c;rr(-len/2+1.5,-wid/2+1.5,len-3,wid-4,wid*.24);ctx.fill();
  // ön cam
  ctx.fillStyle='#1d3440';rr(len/2-wid*.42,-wid/2+wid*.14,wid*.26,wid*.72,wid*.08);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(len/2-wid*.38,-wid/2+wid*.2,wid*.05,wid*.3);
  // yan pencereler / koltuklar
  if(o.seats!=null){
    const n=o.cap/2,sp=(len-wid*.75)/n;
    for(let i=0;i<o.cap;i++){const col_=Math.floor(i/2),side=i%2;
      const px=-len/2+wid*.2+sp*(col_+.5),py=(side?1:-1)*wid*.22;
      ctx.fillStyle=i<o.seats?'#fff':'rgba(0,0,0,.28)';ctx.beginPath();ctx.arc(px,py,Math.max(2,wid*.12),0,7);ctx.fill()}
  }else{
    // tavan: yön oku
    ctx.strokeStyle='rgba(255,255,255,.92)';ctx.lineWidth=Math.max(2,wid*.12);ctx.lineCap='round';ctx.lineJoin='round';
    const ax=-len/2+wid*.35,bx=len/2-wid*.62,h=wid*.2;
    ctx.beginPath();ctx.moveTo(ax,0);ctx.lineTo(bx,0);ctx.moveTo(bx-h*1.2,-h*1.2);ctx.lineTo(bx,0);ctx.lineTo(bx-h*1.2,h*1.2);ctx.stroke();
  }
  // tavan levhası (dolmuş ışığı)
  if(len>wid*1.6){ctx.fillStyle='#f4f1e8';rr(-wid*.18-len*.12,-wid*.5+1,wid*.36,3,1);ctx.fill()}
  if(o.flash>0){ctx.fillStyle=`rgba(255,80,70,${o.flash*.6})`;rr(-len/2,-wid/2,len,wid,wid*.28);ctx.fill()}
  if(o.hi){ctx.strokeStyle='#f2c230';ctx.lineWidth=2;ctx.setLineDash([4,3]);rr(-len/2-3,-wid/2-3,len+6,wid+6,wid*.3);ctx.stroke();ctx.setLineDash([])}
  ctx.restore();
}
function drawPerson(x,y,r,col,bob){
  const C=COLORS[col];y+=bob;
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(x,y+r*1.5,r*.9,r*.35,0,0,7);ctx.fill();
  ctx.fillStyle=C.d;rr(x-r*.85,y-r*.1,r*1.7,r*1.55,r*.6);ctx.fill();
  ctx.fillStyle=C.c;rr(x-r*.75,y-r*.05,r*1.5,r*1.4,r*.55);ctx.fill();
  ctx.fillStyle='#f3d3b4';ctx.beginPath();ctx.arc(x,y-r*.55,r*.55,0,7);ctx.fill();
}
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#14303a';ctx.fillRect(0,0,W,H);
  if(!G)return;
  const sh=G.shake*6;ctx.save();if(sh)ctx.translate((Math.random()-.5)*sh,(Math.random()-.5)*sh);
  // yol halkası
  const pad=Math.max(10,cs*.32);
  ctx.fillStyle='#1d2a30';rr(lot.x-pad,lot.y-pad,lot.w+pad*2,lot.h+pad*2,pad*1.2);ctx.fill();
  ctx.strokeStyle='rgba(242,194,48,.55)';ctx.lineWidth=2;ctx.setLineDash([10,9]);rr(lot.x-pad/2,lot.y-pad/2,lot.w+pad,lot.h+pad,pad);ctx.stroke();ctx.setLineDash([]);
  // otopark
  ctx.fillStyle='#26333a';rr(lot.x,lot.y,lot.w,lot.h,6);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=1;
  for(let i=1;i<G.cols;i++){ctx.beginPath();ctx.moveTo(lot.x+i*cs,lot.y+4);ctx.lineTo(lot.x+i*cs,lot.y+lot.h-4);ctx.stroke()}
  for(let j=1;j<G.rows;j++){ctx.beginPath();ctx.moveTo(lot.x+4,lot.y+j*cs);ctx.lineTo(lot.x+lot.w-4,lot.y+j*cs);ctx.stroke()}
  // durak kaldırımı
  const bw=bayW*G.bays,bx0=W/2-bw/2,bayH=bayVW*.95*4+18;
  ctx.fillStyle='#3d5a63';rr(bx0-8,bayY-6,bw+16,bayH+10,14);ctx.fill();
  for(let i=0;i<G.bays;i++){
    const x=bayX(i);ctx.fillStyle=G.bayVeh[i]<0?'rgba(0,0,0,.22)':'rgba(0,0,0,.12)';rr(x-bayW/2+4,bayY,bayW-8,bayH-2,10);ctx.fill();
    ctx.strokeStyle='rgba(242,194,48,.45)';ctx.lineWidth=2;ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(x-bayW/2+8,bayY+bayH-8);ctx.lineTo(x+bayW/2-8,bayY+bayH-8);ctx.stroke();ctx.setLineDash([]);
  }
  // durak tabelası
  ctx.font=`900 10px ${getComputedStyle(document.body).fontFamily}`;ctx.fillStyle='#9fb7bd';ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText(t('sign',{n:G.bays}),bx0,bayY-13);
  // park halindeki araçlar
  for(const v of G.veh){
    if(!['park','bump','exit'].includes(v.state))continue;
    const c=cellCenter(v),off=v.off||0;
    v.px=c.x+DIRS[v.dir][0]*off*cs;v.py=c.y+DIRS[v.dir][1]*off*cs;
    drawVeh(v.px,v.py,v.ang,v.L*cs-cs*.16,cs*.74,v.color,{flash:v.flash,hi:G.crane&&v.state==='park'});
  }
  // vinç, yolculuk, durak
  for(const v of G.veh){
    const len=bayVW*.95*v.L-4,wid=bayVW;
    if(v.state==='lift'){
      const p=ease(Math.min(1,v.t/.45)),c=cellCenter(v);v.px=c.x;v.py=c.y-p*cs*.6;
      const k=1+p*.15;ctx.save();ctx.globalAlpha=1;
      drawVeh(v.px,v.py,v.ang,(v.L*cs-cs*.16)*k,cs*.74*k,v.color,{});
      ctx.strokeStyle='#f2c230';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(v.px,v.py);ctx.lineTo(v.px,0);ctx.stroke();ctx.restore();
    }else if(v.state==='travel'){
      const p=ease(Math.min(1,v.t/.42)),tx=bayX(v.bay),ty=bayCY(v);
      const mx=(v.sx+tx)/2,my=Math.min(v.sy,ty)-30;
      const x=(1-p)*(1-p)*v.sx+2*(1-p)*p*mx+p*p*tx,y=(1-p)*(1-p)*v.sy+2*(1-p)*p*my+p*p*ty;
      let da=-Math.PI/2-v.sa;da=Math.atan2(Math.sin(da),Math.cos(da));
      const s0=v.L*cs-cs*.16,w0=cs*.74;
      drawVeh(x,y,v.sa+da*p,s0+(len-s0)*p,w0+(wid-w0)*p,v.color,{});
    }else if(v.state==='bay'||v.state==='full'){
      const b=v.state==='full'?Math.sin(v.t*60)*1.2:0;
      drawVeh(bayX(v.bay)+b,bayCY(v),-Math.PI/2,len,wid,v.color,{seats:v.seats,cap:v.cap});
    }else if(v.state==='depart'){
      const p=Math.min(1,v.t/.6),e=p*p;
      drawVeh(bayX(v.bay0),bayCY(v)-e*(bayY+200),-Math.PI/2,len,wid,v.color,{seats:v.cap,cap:v.cap});
    }
  }
  // kuyruk
  const pr=Math.min(9,bayVW*.3),gap=pr*2.3,maxN=Math.max(4,Math.floor((qFront.x-(W/2-bw/2)-40)/gap));
  const qs=G.queue.slice(0,maxN);
  for(let i=qs.length-1;i>=0;i--){
    const bob=Math.abs(Math.sin(G.walk*6+i*.9))*-1.5;
    drawPerson(qFront.x-i*gap,qY,pr,qs[i],i===0?0:bob);
  }
  if(G.queue.length>maxN){ctx.fillStyle='#9fb7bd';ctx.textAlign='right';ctx.font=`900 13px ${getComputedStyle(document.body).fontFamily}`;
    ctx.fillText('+'+(G.queue.length-maxN),qFront.x-maxN*gap+pr,qY)}
  for(const f of G.fly){
    const v=G.veh[f.v];if(v.bay<0)continue;const p=ease(Math.min(1,f.t)),tx=bayX(v.bay),ty=bayCY(v);
    drawPerson(f.fx+(tx-f.fx)*p,f.fy+(ty-f.fy)*p-Math.sin(p*Math.PI)*24,pr*(1-p*.4),f.c,0);
  }
  ctx.restore();
}

/* ---------- girdi ---------- */
cv.addEventListener('pointerdown',e=>{
  if(!G||G.done||paused||!$('ov').hidden)return;
  const x=e.clientX,y=e.clientY,cx=Math.floor((x-lot.x)/cs),cy=Math.floor((y-lot.y)/cs);
  if(cx<0||cy<0||cx>=G.cols||cy>=G.rows)return;
  const id=G.occ[cy*G.cols+cx];if(id>=0)tap(G.veh[id]);
});

/* ---------- döngü ---------- */
let last=performance.now();
function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(frame)}

if(location.hash==='#demo')window.__dd={get G(){return G},tap,rayInfo,cellCenter};
layout();
start(S.level||1);
paused=true;
function showIntro(){openCard(`<div class="kick">${t('introKick')}</div><h1>${t('title')}</h1>
  <div class="rules">
    <div><b>1</b><span>${t('rule1')}</span></div>
    <div><b>2</b><span>${t('rule2')}</span></div>
    <div><b>3</b><span>${t('rule3')}</span></div>
  </div>
  <button class="btn y" data-a="play">${(S.level||1)>1?t('contBtn',{n:S.level}):t('startBtn')}</button>
  <button class="lngb" data-a="lang" aria-label="${t('langAria')}">🌐 ${window.SG_LANG_NAMES[window.SG_LANG]}</button>`)}
function showLangs(){openCard(`<h2>🌐 ${t('langTitle')}</h2><div class="lnglist">${window.SG_LANGS.map(c=>`<button class="btn${c===window.SG_LANG?' on':''}" data-a="setlang" data-l="${c}" lang="${c}">${window.SG_LANG_NAMES[c]}</button>`).join('')}</div>
  <button class="btn" data-a="intro">${t('back')}</button>`)}
showIntro();
requestAnimationFrame(frame);
})();
</script>
