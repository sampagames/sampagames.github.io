<style>
/* Düzen: tam ekran harita masası; üstte durum şeridi, sağda (telefonda altta) dosya paneli, solda haber şeridi */
:root{
  --bg:#0b1216; --sea:#0e1b21; --sea2:#11232a; --land:#27373b; --land-hi:#33474c; --line:#40565c;
  --panel:#111c21; --panel2:#16252b; --fg:#e2e9e6; --muted:#8fa3a5; --faint:#5d7276;
  --brass:#e0a63e; --brass-dim:#8a6a2c; --ally:#4bb5a4; --trade:#7194d8; --hostile:#d6573f; --war:#ff4a33; --good:#71c27b;
  --f-disp:"Saira Condensed","Arial Narrow",Impact,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace,system-ui;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);overflow:hidden}
button{font:inherit;color:inherit}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
#app{position:relative;height:100%;display:grid;grid-template-rows:auto 1fr;}
/* top bar */
#top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);z-index:5}
#top .me{display:flex;align-items:center;gap:8px;cursor:pointer;min-width:0}
#top .me .flag{font-size:22px}
#top .me .nm{font:600 20px/1 var(--f-disp);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.stat{display:flex;flex-direction:column;line-height:1.1}
.stat .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stat .v{font:500 15px var(--f-mono);font-variant-numeric:tabular-nums}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
#top .sp{flex:1}
.ctl{display:flex;gap:6px;align-items:center}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--brass);color:#fff}
.btn:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.pri{background:var(--brass);color:#1a1205;border-color:var(--brass);font-weight:600}
.btn.pri:hover:not(:disabled){background:#f0b84f;color:#1a1205}
.btn.red{border-color:#7c2f22;color:#ffb3a5}
.btn.red:hover:not(:disabled){background:#4a1a12;border-color:var(--war);color:#fff}
.btn.sm{padding:3px 8px;font-size:12px}
.date{font:600 18px var(--f-disp);letter-spacing:.06em;color:var(--brass);min-width:118px;text-align:center;text-transform:uppercase}
/* map */
#mapwrap{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,var(--sea2),var(--sea) 70%)}
#map{width:100%;height:100%;display:block;cursor:grab}
#map:active{cursor:grabbing}
.cty{stroke:var(--bg);stroke-width:.5;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .4s}
.cty:hover{filter:brightness(1.25)}
.cty.sel{stroke:#fff;stroke-width:1.6}
.grat{fill:none;stroke:#ffffff0d;stroke-width:.5;vector-effect:non-scaling-stroke}
.city{cursor:pointer;stroke:#0b1216;vector-effect:non-scaling-stroke;stroke-width:1}
.city.cap{stroke:#fff}
.city.sel{stroke:#fff;stroke-width:2.5}
.clabel{font:500 10px var(--f-body);fill:#e9efe9;paint-order:stroke;stroke:#0b1216cc;stroke-width:3px;pointer-events:none}
#legend{position:absolute;left:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;max-width:min(360px,calc(100% - 32px))}
.modes{display:flex;gap:4px}
.modes .btn{padding:4px 10px;font-size:12px}
.modes .btn.on{border-color:var(--brass);color:var(--brass)}
.keys{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted);background:#0b1216cc;padding:6px 10px;border-radius:4px}
.keys i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
#ticker{background:#0b1216d9;border:1px solid var(--line);border-radius:4px;max-height:132px;overflow:auto;padding:6px 10px;font-size:12px}
#ticker div{padding:2px 0;color:var(--muted)}
#ticker div b{color:var(--fg);font-weight:500}
#ticker .d{font:11px var(--f-mono);color:var(--faint);margin-right:6px}
#tip{position:absolute;pointer-events:none;background:#0b1216ee;border:1px solid var(--line);padding:4px 8px;border-radius:3px;font-size:12px;white-space:nowrap;z-index:4}
.zoom{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:4px}
.zoom .btn{width:34px;padding:4px 0;text-align:center}
/* side panel */
#side{position:absolute;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--panel);border-left:1px solid var(--line);overflow:auto;z-index:3;transform:translateX(0);transition:transform .25s}
#side.off{transform:translateX(105%)}
.ph{position:sticky;top:0;background:var(--panel);padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;z-index:2}
.ph .flag{font-size:30px;line-height:1}
.ph h2{margin:0;font:600 24px/1.05 var(--f-disp);letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
.ph .sub{color:var(--muted);font-size:12px;margin-top:3px}
.ph .x{margin-left:auto;background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:0 4px}
.pb{padding:14px 16px 28px;display:flex;flex-direction:column;gap:16px}
.sec h3{margin:0 0 8px;font:600 13px var(--f-disp);letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
.kv div{display:flex;flex-direction:column}
.kv .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kv .v{font:500 15px var(--f-mono);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);color:var(--muted)}
.chip.ally{border-color:var(--ally);color:var(--ally)}
.chip.trade{border-color:var(--trade);color:var(--trade)}
.chip.war{border-color:var(--war);color:#fff;background:#5a1a10}
.chip.emb{border-color:var(--hostile);color:var(--hostile)}
.relbar{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--hostile),#4a5559 50%,var(--ally));margin-top:6px}
.relbar span{position:absolute;top:-4px;width:4px;height:18px;background:#fff;border-radius:2px;transform:translateX(-2px);box-shadow:0 0 0 2px var(--bg)}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.actions .btn{text-align:left;padding:7px 10px}
.actions .btn small{display:block;color:var(--muted);font-size:11px;white-space:normal}
.quote{border-left:2px solid var(--brass-dim);padding:6px 10px;background:var(--panel2);font-size:13px;color:#cfd8d4}
.quote .w{font-size:11px;color:var(--muted);margin-bottom:2px}
.secrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px solid #ffffff0f}
.secrow .nm{font-weight:500}
.secrow .meta{font-size:11px;color:var(--muted)}
.pips{display:flex;gap:2px;margin-top:3px}
.pips i{width:12px;height:5px;background:#ffffff18;border-radius:1px}
.pips i.on{background:var(--brass)}
.list{display:flex;flex-direction:column}
.list .row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #ffffff0f;cursor:pointer}
.list .row:hover{color:var(--brass)}
.mil{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 8px;align-items:center}
.note{font-size:12px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--brass)}
select,input[type=text],textarea{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:4px;padding:6px 8px;font:inherit;width:100%}
/* overlays */
.ov{position:absolute;inset:0;background:#05090bcc;display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:6px;width:min(520px,100%);max-height:100%;overflow:auto;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px}
.modal h2{margin:0;font:600 24px/1.1 var(--f-disp);text-transform:uppercase;letter-spacing:.03em;text-wrap:balance}
.modal .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
/* start */
#start{position:absolute;inset:0;z-index:20;background:radial-gradient(ellipse at 70% 0%,#1b2e35,var(--bg) 60%);overflow:auto}
#start .wrap{max-width:1100px;margin:0 auto;padding:28px 16px 40px;display:flex;flex-direction:column;gap:18px}
#start h1{margin:0;font:700 clamp(44px,9vw,96px)/.9 var(--f-disp);letter-spacing:.02em;text-transform:uppercase}
#start h1 em{font-style:normal;color:var(--brass)}
#start .lead{max-width:62ch;color:#c4d0cc;margin:0}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.rules div{border-top:1px solid var(--line);padding-top:8px;font-size:13px;color:var(--muted)}
.rules b{display:block;color:var(--fg);font:600 15px var(--f-disp);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.pc{display:flex;gap:10px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:9px 10px;cursor:pointer;min-width:0}
.pc:hover,.pc:focus-visible{border-color:var(--brass);outline:none}
.pc .flag{font-size:26px}
.pc .t{min-width:0}
.pc .t b{display:block;font:600 16px/1.1 var(--f-disp);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .t span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .t .num{color:var(--faint)}
.searchrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.searchrow input{flex:1;min-width:200px}

/* ---- görsel kit ---- */
:root{--track:#ffffff14;--bld:#2b3d43;--bld-hi:#3a5259;--bld-back:#1a2a30;--bld-me:#5b4523;--bld-me-hi:#8a6a2c;--win:#ffd98a;--smoke:#9fb0b4;
  --sky1:#0b1820;--sky2:#1d3440;--sky2-me:#3a2f1f;--moon:#e9e2c8;--star:#ffffffaa;--water:#14303b;--wave:#2f5d6b;--ground:#18242a;--hill:#3a3329;
  --field:#7a9a4f;--palm:#5f8f5a;--flare:#ff9a3c;--c1:#c2614f;--c2:#4f9ab0;--c3:#d9a441}
.ic{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
.sec h3{display:flex;align-items:center;gap:6px}
.stat .k{display:flex;align-items:center;gap:4px}
.stat .v i{font-style:normal;font-size:10px;margin-left:4px}
.stat .v i.up{color:var(--good)} .stat .v i.dn{color:var(--hostile)}
.coast{fill:none;stroke:#2f5866;stroke-width:3;vector-effect:non-scaling-stroke;stroke-linejoin:round;opacity:.55}
.cty.mine{stroke:#ffd27a;stroke-width:.9}
.dring{fill:none;stroke:var(--brass);vector-effect:none;opacity:.95}
.mico{color:#cfd9d6;stroke:currentColor;fill:none;stroke-width:1.4px;opacity:.85;stroke-linecap:round;stroke-linejoin:round}
.mico.me{color:#ffd27a;opacity:1}
.mico *{vector-effect:non-scaling-stroke}
.bmark .bbg{fill:#0b1216e6;stroke:var(--brass);stroke-width:1.5px;vector-effect:non-scaling-stroke}
.bmark .gear *{vector-effect:non-scaling-stroke}
.bmark .gear{color:#ffd27a;stroke:currentColor;fill:none;stroke-width:1.5px;stroke-linecap:round;transform-box:fill-box;transform-origin:center;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.keys i.hk{background:repeating-linear-gradient(45deg,#b8321f 0 3px,#ff5a3c 3px 5px)}
.keys i.rk{background:none;border:2px solid var(--brass);border-radius:50%}
.tipsec{color:var(--muted)} .tipsec .ic{vertical-align:-2px}
/* şehir paneli */
.hero{position:relative;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--sky1)}
.sky{display:block;width:100%;height:auto;aspect-ratio:360/132}
.smoke{animation:smoke 4.5s ease-out infinite;opacity:0}
@keyframes smoke{0%{opacity:.55;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(10px,-22px) scale(1.8)}}
.smoke{transform-box:fill-box;transform-origin:center}
.flare{animation:flare 1.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center bottom}
@keyframes flare{from{transform:scale(.8);opacity:.7}to{transform:scale(1.25);opacity:1}}
.rotor{animation:spin 4s linear infinite}
.scaff{animation:blink 1.6s ease-in-out infinite alternate}
@keyframes blink{from{opacity:.55}to{opacity:1}}
.herotag{position:absolute;left:8px;top:8px;display:flex;align-items:center;gap:8px;background:#0b1216cc;border:1px solid var(--line);border-radius:30px;padding:3px 12px 3px 3px}
.herotag b{font:600 15px var(--f-disp);letter-spacing:.05em;text-transform:uppercase;display:block;line-height:1.1}
.herotag small{font-size:10.5px;color:var(--muted);display:block}
.dev{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none}
.dev>b{position:absolute;font:500 13px var(--f-mono)!important;letter-spacing:0!important}
.dev.sm>b{font-size:10px!important}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tile{display:flex;flex-direction:column;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:7px 8px;color:var(--muted)}
.tile span{display:flex;flex-direction:column;min-width:0}
.tile small{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}
.tile b{font:500 13.5px var(--f-mono);color:var(--fg);white-space:nowrap}
.lvmax{font-style:normal;color:var(--faint);font-size:11px}
.ownrow{font-size:12px;color:var(--muted);margin-top:-8px}
.buildcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;border:1px dashed var(--brass);border-radius:6px;padding:10px;background:#e0a63e10}
.buildcard small{color:var(--muted);font-size:11px}
.bic{color:var(--brass);display:flex} .spin .ic{animation:spin 3s linear infinite}
.bico{color:var(--brass);opacity:.8}
.pbar{display:block;height:7px;border-radius:4px;background:var(--track);overflow:hidden;margin:5px 0 3px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--brass-dim),var(--brass));border-radius:4px;transition:width .5s}
.pbar.thin{height:4px;margin:4px 0 0}
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.scard{border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--panel2);display:flex;flex-direction:column;gap:6px;min-width:0;position:relative}
.scard.t1{border-color:#4a5d63}.scard.t2{border-color:#6b6040}.scard.t3{border-color:#8a6a2c;background:linear-gradient(160deg,#e0a63e14,var(--panel2) 60%)}.scard.t4{border-color:var(--brass);background:linear-gradient(160deg,#e0a63e26,var(--panel2) 70%);box-shadow:0 0 0 1px #e0a63e33 inset}
.scard.bld{border-style:dashed;border-color:var(--brass)}
.sctop{display:flex;align-items:center;gap:8px;min-width:0}
.sic{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#ffffff0d;color:var(--fg);flex:none}
.scard.t3 .sic,.scard.t4 .sic{color:var(--brass);background:#e0a63e1f}
.scn{min-width:0;flex:1}.scn b{display:block;font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.scn small{color:var(--muted);font-size:11px}
.lv{font:600 20px var(--f-disp)!important;color:var(--brass)}
.scard .pips{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;margin:0}
.scard .pips i{width:auto;height:5px}
.pips i.nx{background:var(--brass);animation:blink .8s ease-in-out infinite alternate}
.btn.up{display:flex;align-items:center;gap:4px;justify-content:center;font-size:11px;padding:4px 6px}
.maxed{font-size:11px;color:var(--brass);text-align:center}
.newgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.newsec{display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 4px;cursor:pointer;color:var(--fg);text-align:center;font-size:11.5px;line-height:1.2}
.newsec:hover:not(:disabled){border-color:var(--brass);color:var(--brass)}
.newsec:disabled{opacity:.4;cursor:not-allowed}
.newsec small{color:var(--muted);font-size:10.5px}
.btn.icb{display:flex;align-items:center;gap:9px;text-align:left}
.btn.icb>span{min-width:0}
.ul{display:flex;align-items:center;gap:6px}
.vs{margin:6px 0}
.vsl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px}
.vsl b{color:var(--fg)}
.vsb{display:flex;height:9px;border-radius:5px;overflow:hidden;gap:2px;margin-top:3px}
.vsb i{display:block;height:100%;transition:width .5s;min-width:2px}
.mhero{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto;border:1px solid var(--line);background:var(--panel2);color:var(--brass)}
.mhero.r{color:var(--war);border-color:#7c2f22;background:#3a120c}
.mhero.g{color:var(--ally);border-color:#2e6c63;background:#0f2a26}
.mhero.b{color:var(--trade);border-color:#34497a;background:#141d33}
.losses{display:flex;gap:14px;align-items:center;flex-wrap:wrap;color:var(--hostile);font:500 13px var(--f-mono)}
.losses span{display:flex;align-items:center;gap:4px}.losses small{color:var(--muted);font-family:var(--f-body)}
/* ülkem paneli */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.kpi{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto auto;gap:0 6px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px;color:var(--muted)}
.kpi .kl{font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.kpi b{grid-column:1/-1;font:500 16px var(--f-mono);color:var(--fg);margin:2px 0}
.kpi svg:last-child{grid-column:1/-1;width:100%;height:30px}
.budget{display:flex;flex-direction:column;gap:6px}
.brow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.brow b{color:var(--fg);font-size:12.5px}
.bb{display:flex;height:12px;background:var(--track);border-radius:3px;overflow:hidden}
.bb i{display:block;height:100%}
.bleg,.mixleg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted)}
.bleg i,.mixleg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.mixleg span{display:flex;align-items:center;gap:3px}.mixleg b{color:var(--fg);font-weight:500}
.net{font-size:13px}
.mixbar{display:flex;height:16px;border-radius:4px;overflow:hidden;gap:1px;margin-bottom:8px}
.mixbar i{display:block;height:100%}
.units{display:flex;flex-direction:column;gap:8px}
.unit{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:center;border-bottom:1px solid #ffffff0f;padding-bottom:8px}
.uic{width:42px;height:42px;border-radius:8px;background:#ffffff0a;display:flex;align-items:center;justify-content:center;color:var(--brass);grid-row:span 2}
.uinfo b{font-weight:500}.uinfo small{display:block;font-size:11px;color:var(--muted)}
.ubtn{display:flex;gap:4px;flex-wrap:wrap}
.rlab{display:flex;align-items:center;gap:5px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:8px 0 4px;color:var(--muted)}
.rlab.war{color:var(--war)}.rlab.ally{color:var(--ally)}.rlab.trade{color:var(--trade)}
.fchips{display:flex;flex-wrap:wrap;gap:4px}
.fchip{font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:2px 9px;cursor:pointer;color:var(--fg)}
.fchip:hover{border-color:var(--brass)}
.fchip.war{border-color:#7c2f22;background:#3a120c}.fchip.ally{border-color:#2e6c63}.fchip.trade{border-color:#34497a}
.clist{display:flex;flex-direction:column}
.crow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border:0;border-bottom:1px solid #ffffff0f;background:none;cursor:pointer;text-align:left;color:var(--fg)}
.crow:hover .cn b{color:var(--brass)}
.cn{display:flex;flex-direction:column;min-width:0}.cn b{font-weight:500}
.cg{font-size:12.5px}
.cicons{display:inline-flex;gap:7px;color:var(--muted);flex-wrap:wrap}
.cicons span{display:inline-flex;align-items:center;gap:2px}.cicons i{font-style:normal;font-size:10px}
.pc .cicons{display:flex;margin-top:3px;color:var(--brass-dim)}
.bmini{width:90px}
/* bildirimler */
#toasts{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:25;pointer-events:none;width:min(360px,calc(100% - 32px))}
.toast{display:flex;gap:10px;align-items:center;background:#0f1a1ff2;border:1px solid var(--line);border-left:3px solid var(--brass);border-radius:6px;padding:8px 12px;box-shadow:0 8px 24px #0008;animation:tin .35s ease-out}
.toast.g{border-left-color:var(--good)}.toast.r{border-left-color:var(--war)}.toast.b{border-left-color:var(--brass)}
.toast .tic{color:var(--brass);display:flex}.toast.g .tic{color:var(--good)}.toast.r .tic{color:var(--war)}
.toast b{display:block;font-weight:600;font-size:13px}.toast span span{font-size:11.5px;color:var(--muted)}
.toast.out{opacity:0;transform:translateY(-8px);transition:all .5s}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}#toasts{top:auto;bottom:calc(58% + 8px)}}
@media (prefers-reduced-motion:reduce){.smoke,.flare,.rotor,.gear,.spin .ic,.scaff{animation:none!important}}

@media (max-width:760px){
  #side{top:auto;height:58%;width:100%;border-left:0;border-top:1px solid var(--line)}
  #side.off{transform:translateY(105%)}
  #legend{bottom:12px;left:12px}
  #ticker{max-height:70px}
  .keys{display:none}
  #top{padding:6px 12px;gap:4px 12px}
  .stat .v{font-size:13px}
  #top .me .nm{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.langrow{display:flex;justify-content:flex-end;margin-bottom:-10px}
.langbtn{font-size:13px;padding:5px 12px;border-radius:16px}
.langlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:4px}
.langlist .btn{text-align:left;padding:8px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>

r capital. Our door is always open to you.\"","\"Este gesto fue bien recibido en nuestra capital. Nuestra puerta siempre está abierta.\"","\"Este gesto foi bem recebido em nossa capital. Nossa porta está sempre aberta.\"","\"Diese Geste wurde in unserer Hauptstadt mit Freude aufgenommen. Unsere Tür steht Ihnen offen.\"","\"Ce geste a été bien accueilli dans notre capitale. Notre porte vous est toujours ouverte.\"","\"Gestur ini disambut baik di ibu kota kami. Pintu kami selalu terbuka.\"","\"Этот жест с радостью встретили в нашей столице. Наши двери всегда открыты для вас.\""],"rp_compl3":["\"Sözlerinizi takdirle karşılıyoruz. Birlikte yapabileceğimiz çok şey var.\"","\"We appreciate your words. There is much we can do together.\"","\"Valoramos sus palabras. Hay mucho que podemos hacer juntos.\"","\"Apreciamos suas palavras. Há muito que podemos fazer juntos.\"","\"Wir schätzen Ihre Worte. Gemeinsam können wir viel erreichen.\"","\"Nous apprécions vos paroles. Nous pouvons accomplir beaucoup ensemble.\"","\"Kami menghargai kata-kata Anda. Banyak yang bisa kita lakukan bersama.\"","\"Мы ценим ваши слова. Вместе мы можем многое.\""],"rp_complCold1":["\"İltifatınızı not ettik. Ancak güven sözlerle değil, adımlarla kurulur.\"","\"Your compliment is noted. But trust is built with actions, not words.\"","\"Tomamos nota de su cumplido. Pero la confianza se construye con hechos, no con palabras.\"","\"Anotamos o elogio. Mas confiança se constrói com atos, não palavras.\"","\"Ihr Kompliment ist notiert. Doch Vertrauen entsteht durch Taten, nicht durch Worte.\"","\"Nous prenons note du compliment. Mais la confiance se gagne par des actes, pas des mots.\"","\"Pujian Anda kami catat. Namun kepercayaan dibangun dengan tindakan, bukan kata-kata.\"","\"Комплимент принят к сведению. Но доверие строится делами, а не словами.\""],"rp_complCold2":["\"Güzel sözler… Görelim bakalım arkası gelecek mi.\"","\"Nice words… Let's see if anything follows.\"","\"Bonitas palabras… Veremos si hay algo detrás.\"","\"Belas palavras… Vamos ver se algo vem depois.\"","\"Schöne Worte… Mal sehen, ob Taten folgen.\"","\"Belles paroles… Voyons si les actes suivront.\"","\"Kata-kata yang manis… Kita lihat apakah ada buktinya.\"","\"Красивые слова… Посмотрим, последует ли что-то за ними.\""],"rp_insult1":["\"Bu sözler kabul edilemez. Büyükelçinizi derhal Dışişlerine çağırıyoruz.\"","\"These words are unacceptable. We are summoning your ambassador immediately.\"","\"Estas palabras son inaceptables. Convocamos de inmediato a su embajador.\"","\"Essas palavras são inaceitáveis. Convocamos seu embaixador imediatamente.\"","\"Diese Worte sind inakzeptabel. Wir bestellen Ihren Botschafter sofort ein.\"","\"Ces propos sont inacceptables. Nous convoquons immédiatement votre ambassadeur.\"","\"Kata-kata ini tidak dapat diterima. Kami segera memanggil duta besar Anda.\"","\"Эти слова недопустимы. Мы немедленно вызываем вашего посла.\""],"rp_insult2":["\"Ülkemize yönelik bu saygısızlığın bedelini er ya da geç ödeyeceksiniz.\"","\"Sooner or later, you will pay for this disrespect toward our country.\"","\"Tarde o temprano pagarán por esta falta de respeto a nuestro país.\"","\"Cedo ou tarde vocês vão pagar por esse desrespeito ao nosso país.\"","\"Früher oder später werden Sie für diese Respektlosigkeit gegenüber unserem Land bezahlen.\"","\"Tôt ou tard, vous paierez pour ce manque de respect envers notre pays.\"","\"Cepat atau lambat Anda akan membayar penghinaan terhadap negara kami ini.\"","\"Рано или поздно вы заплатите за это неуважение к нашей стране.\""],"rp_insult3":["\"Halkımızın onurunu kimseye çiğnetmeyiz. Bu sözleri unutmayacağız.\"","\"We let no one trample on our people's honor. We will not forget these words.\"","\"No dejamos que nadie pisotee el honor de nuestro pueblo. No olvidaremos estas palabras.\"","\"Não deixamos ninguém pisar na honra do nosso povo. Não esqueceremos essas palavras.\"","\"Niemand tritt die Ehre unseres Volkes mit Füßen. Diese Worte vergessen wir nicht.\"","\"Nous ne laisserons personne bafouer l'honneur de notre peuple. Nous n'oublierons pas ces mots.\"","\"Kami tak akan membiarkan siapa pun menginjak kehormatan rakyat kami. Kata-kata ini tak akan kami lupakan.\"","\"Мы никому не позволим попирать честь нашего народа. Мы не забудем этих слов.\""],"rp_insultHard1":["\"Sabrımızın sonuna geldik. Bir hakaret daha olursa sonuçlarına katlanırsınız.\"","\"Our patience has run out. One more insult and you will face the consequences.\"","\"Se nos acabó la paciencia. Un insulto más y asumirán las consecuencias.\"","\"Nossa paciência acabou. Mais um insulto e vocês arcarão com as consequências.\"","\"Unsere Geduld ist am Ende. Noch eine Beleidigung, und Sie tragen die Folgen.\"","\"Notre patience est à bout. Une insulte de plus et vous en subirez les conséquences.\"","\"Kesabaran kami sudah habis. Satu hinaan lagi, Anda tanggung akibatnya.\"","\"Наше терпение на исходе. Ещё одно оскорбление — и вы ответите за последствия.\""],"rp_insultHard2":["\"Bu artık bir diplomatik kriz değil, doğrudan bir tehdittir. Tüm seçenekler masada.\"","\"This is no longer a diplomatic crisis but a direct threat. All options are on the table.\"","\"Esto ya no es una crisis diplomática, es una amenaza directa. Todas las opciones están sobre la mesa.\"","\"Isto não é mais uma crise diplomática, é uma ameaça direta. Todas as opções estão na mesa.\"","\"Das ist keine diplomatische Krise mehr, sondern eine direkte Drohung. Alle Optionen liegen auf dem Tisch.\"","\"Ce n'est plus une crise diplomatique mais une menace directe. Toutes les options sont sur la table.\"","\"Ini bukan lagi krisis diplomatik, melainkan ancaman langsung. Semua opsi terbuka.\"","\"Это уже не дипломатический кризис, а прямая угроза. Все варианты на столе.\""],"rp_gift1":["\"Cömertliğiniz için minnettarız. Bu yardım halkımız için çok değerli.\"","\"We are grateful for your generosity. This aid means a lot to our people.\"","\"Agradecemos su generosidad. Esta ayuda es muy valiosa para nuestro pueblo.\"","\"Agradecemos sua generosidade. Essa ajuda é muito valiosa para o nosso povo.\"","\"Wir danken für Ihre Großzügigkeit. Diese Hilfe bedeutet unserem Volk sehr viel.\"","\"Nous vous remercions de votre générosité. Cette aide compte beaucoup pour notre peuple.\"","\"Kami berterima kasih atas kemurahan hati Anda. Bantuan ini sangat berarti bagi rakyat kami.\"","\"Благодарим за щедрость. Эта помощь очень важна для нашего народа.\""],"rp_gift2":["\"Yardımınız unutulmayacak. İlişkilerimizde yeni bir sayfa açılıyor.\"","\"Your help will not be forgotten. A new chapter opens in our relations.\"","\"Su ayuda no se olvidará. Se abre un nuevo capítulo en nuestras relaciones.\"","\"Sua ajuda não será esquecida. Um novo capítulo se abre em nossas relações.\"","\"Ihre Hilfe wird nicht vergessen. Ein neues Kapitel unserer Beziehungen beginnt.\"","\"Votre aide ne sera pas oubliée. Une nouvelle page s'ouvre dans nos relations.\"","\"Bantuan Anda tak akan dilupakan. Babak baru dalam hubungan kita dimulai.\"","\"Ваша помощь не будет забыта. В наших отношениях открывается новая страница.\""],"rp_tradeY1":["\"Ticaret anlaşmasını memnuniyetle imzalıyoruz. Limanlarımız ve pazarlarımız ürünlerinize açık.\"","\"We gladly sign the trade agreement. Our ports and markets are open to your goods.\"","\"Firmamos con gusto el acuerdo comercial. Nuestros puertos y mercados están abiertos a sus productos.\"","\"Assinamos com prazer o acordo comercial. Nossos portos e mercados estão abertos aos seus produtos.\"","\"Wir unterzeichnen das Handelsabkommen gern. Unsere Häfen und Märkte stehen Ihren Waren offen.\"","\"Nous signons volontiers l'accord commercial. Nos ports et nos marchés sont ouverts à vos produits.\"","\"Kami dengan senang hati menandatangani perjanjian dagang ini. Pelabuhan dan pasar kami terbuka untuk produk Anda.\"","\"Мы с радостью подписываем торговое соглашение. Наши порты и рынки открыты для ваших товаров.\""],"rp_tradeN1":["\"Şu an için böyle bir anlaşmaya hazır değiliz. Önce ilişkilerimizin düzelmesi gerekiyor.\"","\"We are not ready for such a deal right now. Our relations must improve first.\"","\"Por ahora no estamos listos para un acuerdo así. Primero deben mejorar nuestras relaciones.\"","\"Ainda não estamos prontos para esse acordo. Nossas relações precisam melhorar antes.\"","\"Für ein solches Abkommen sind wir noch nicht bereit. Erst müssen sich unsere Beziehungen bessern.\"","\"Nous ne sommes pas prêts pour un tel accord. Nos relations doivent d'abord s'améliorer.\"","\"Kami belum siap untuk perjanjian seperti itu. Hubungan kita harus membaik dulu.\"","\"Пока мы не готовы к такому соглашению. Сначала наши отношения должны улучшиться.\""],"rp_allyY1":["\"Ortak savunma anlaşmasını onaylıyoruz. Size yapılan bir saldırı bize yapılmış sayılacaktır.\"","\"We approve the mutual defense pact. An attack on you will be considered an attack on us.\"","\"Aprobamos el pacto de defensa mutua. Un ataque contra ustedes será un ataque contra nosotros.\"","\"Aprovamos o pacto de defesa mútua. Um ataque a vocês será considerado um ataque a nós.\"","\"Wir stimmen dem Verteidigungspakt zu. Ein Angriff auf Sie gilt als Angriff auf uns.\"","\"Nous approuvons le pacte de défense mutuelle. Une attaque contre vous sera une attaque contre nous.\"","\"Kami menyetujui pakta pertahanan bersama. Serangan terhadap Anda adalah serangan terhadap kami.\"","\"Мы одобряем договор о взаимной обороне. Нападение на вас будет считаться нападением на нас.\""],"rp_allyN1":["\"İttifak ciddi bir taahhüttür. Henüz bu noktada olduğumuzu düşünmüyoruz.\"","\"An alliance is a serious commitment. We don't think we are there yet.\"","\"Una alianza es un compromiso serio. Aún no creemos estar en ese punto.\"","\"Uma aliança é um compromisso sério. Ainda não chegamos a esse ponto.\"","\"Ein Bündnis ist eine ernste Verpflichtung. So weit sind wir noch nicht.\"","\"Une alliance est un engagement sérieux. Nous n'en sommes pas encore là.\"","\"Aliansi adalah komitmen serius. Kami rasa kita belum sampai di sana.\"","\"Союз — серьёзное обязательство. Мы пока к этому не готовы.\""],"rp_allyN2":["\"Teklifinizi değerlendirdik, ancak şu an bağımsız dış politikamızı sürdüreceğiz.\"","\"We have considered your offer, but for now we will keep our independent foreign policy.\"","\"Evaluamos su oferta, pero por ahora mantendremos nuestra política exterior independiente.\"","\"Avaliamos sua proposta, mas por ora manteremos nossa política externa independente.\"","\"Wir haben Ihr Angebot geprüft, bleiben aber vorerst bei unserer unabhängigen Außenpolitik.\"","\"Nous avons étudié votre offre, mais nous conserverons pour l'instant une politique étrangère indépendante.\"","\"Kami sudah menimbang tawaran Anda, tetapi untuk saat ini kami tetap pada politik luar negeri yang bebas.\"","\"Мы рассмотрели ваше предложение, но пока сохраним независимую внешнюю политику.\""],"rp_breakA1":["\"İttifakı tek taraflı bitirmeniz büyük bir hayal kırıklığıdır. Bunu hafızamıza kazıdık.\"","\"Ending the alliance unilaterally is a great disappointment. We will not forget it.\"","\"Romper la alianza de forma unilateral es una gran decepción. Lo tendremos presente.\"","\"Encerrar a aliança unilateralmente é uma grande decepção. Não vamos esquecer.\"","\"Das Bündnis einseitig zu beenden, ist eine große Enttäuschung. Das merken wir uns.\"","\"Rompre l'alliance unilatéralement est une grande déception. Nous ne l'oublierons pas.\"","\"Mengakhiri aliansi secara sepihak sangat mengecewakan. Kami akan mengingatnya.\"","\"Одностороннее расторжение союза — большое разочарование. Мы это запомним.\""],"rp_emb1":["\"Ambargonuz düşmanca bir adımdır. Karşılık vermekte gecikmeyeceğiz.\"","\"Your embargo is a hostile act. We will respond without delay.\"","\"Su embargo es un acto hostil. Responderemos sin demora.\"","\"Seu embargo é um ato hostil. Vamos responder sem demora.\"","\"Ihr Embargo ist ein feindseliger Akt. Wir werden umgehend reagieren.\"","\"Votre embargo est un acte hostile. Nous riposterons sans tarder.\"","\"Embargo Anda adalah tindakan bermusuhan. Kami akan segera membalas.\"","\"Ваше эмбарго — враждебный шаг. Мы ответим без промедления.\""],"rp_war1":["\"Saldırganlığınıza karşı topraklarımızı son nefesimize kadar savunacağız!\"","\"We will defend our land against your aggression to our last breath!\"","\"¡Defenderemos nuestra tierra de su agresión hasta el último aliento!\"","\"Defenderemos nossa terra contra sua agressão até o último suspiro!\"","\"Wir verteidigen unser Land gegen Ihre Aggression bis zum letzten Atemzug!\"","\"Nous défendrons notre terre contre votre agression jusqu'à notre dernier souffle !\"","\"Kami akan mempertahankan tanah air dari agresi Anda sampai napas terakhir!\"","\"Мы будем защищать нашу землю от вашей агрессии до последнего вздоха!\""],"rp_war2":["\"Bu savaşı siz başlattınız, biz bitireceğiz.\"","\"You started this war. We will finish it.\"","\"Ustedes empezaron esta guerra; nosotros la terminaremos.\"","\"Vocês começaram esta guerra; nós vamos terminá-la.\"","\"Sie haben diesen Krieg begonnen, wir werden ihn beenden.\"","\"Vous avez commencé cette guerre, nous la finirons.\"","\"Anda yang memulai perang ini, kami yang akan mengakhirinya.\"","\"Эту войну начали вы, а закончим её мы.\""],"rp_peaceY1":["\"Barış teklifinizi kabul ediyoruz. Silahlar sussun.\"","\"We accept your peace offer. Let the guns fall silent.\"","\"Aceptamos su oferta de paz. Que callen las armas.\"","\"Aceitamos sua proposta de paz. Que as armas se calem.\"","\"Wir nehmen Ihr Friedensangebot an. Mögen die Waffen schweigen.\"","\"Nous acceptons votre offre de paix. Que les armes se taisent.\"","\"Kami menerima tawaran damai Anda. Biarlah senjata terdiam.\"","\"Мы принимаем ваше мирное предложение. Пусть оружие умолкнет.\""],"rp_peaceN1":["\"Barış mı? Topraklarımız işgal altındayken masaya oturmayız.\"","\"Peace? We will not sit at the table while our land is occupied.\"","\"¿Paz? No nos sentaremos a la mesa m orld_agenda":["Dünya gündemi","World news","Noticias del mundo","Notícias do mundo","Weltgeschehen","Actualité mondiale","Berita dunia","Мировая повестка"],"recent":["Son olaylar","Latest events","Últimos sucesos","Últimos acontecimentos","Neueste Ereignisse","Derniers événements","Peristiwa terbaru","Последние события"],"lead":["Bugünün dünyasında bir ülkenin başına geçin. Şehirlerinizin gerçek sanayi ve ticaretini geliştirin, liderlerle iltifatlaşın ya da restleşin, ittifak kurun veya savaş açın. Oyun hiç bitmez: dünya her ay kendi düzeninde akar ve yalnızca sizin hamlelerinize göre tepki verir.","Take charge of a country in today's world. Grow your cities' real industry and trade, flatter or face off with other leaders, forge alliances or go to war. The game never ends: the world moves on each month and reacts only to your moves.","Ponte al frente de un país del mundo actual. Desarrolla la industria y el comercio reales de tus ciudades, halaga o desafía a otros líderes, forma alianzas o declara la guerra. El juego nunca termina: cada mes el mundo sigue su curso y solo reacciona a tus jugadas.","Assuma o comando de um país no mundo de hoje. Desenvolva a indústria e o comércio reais das suas cidades, elogie ou enfrente líderes, forme alianças ou declare guerra. O jogo nunca acaba: o mundo segue seu ritmo a cada mês e só reage às suas jogadas.","Übernimm ein Land in der heutigen Welt. Baue die echte Industrie und den Handel deiner Städte aus, umgarne oder provoziere andere Staatschefs, schmiede Bündnisse oder zieh in den Krieg. Das Spiel endet nie: Die Welt läuft Monat für Monat weiter und reagiert nur auf deine Züge.","Prenez la tête d'un pays du monde actuel. Développez l'industrie et le commerce réels de vos villes, flattez ou défiez les dirigeants, nouez des alliances ou partez en guerre. Le jeu ne finit jamais : chaque mois, le monde suit son cours et ne réagit qu'à vos actions.","Pimpin sebuah negara di dunia masa kini. Kembangkan industri dan perdagangan nyata kota-kota Anda, puji atau tantang para pemimpin, bentuk aliansi atau berperang. Permainan tak pernah berakhir: dunia bergerak tiap bulan dan hanya bereaksi pada langkah Anda.","Возглавьте страну в современном мире. Развивайте реальную промышленность и торговлю своих городов, льстите лидерам или бросайте им вызов, заключайте союзы или начинайте войны. Игра бесконечна: мир живёт своим чередом месяц за месяцем и реагирует только на ваши ходы."],"r1_t":["Barışçıl dünya","Peaceful world","Mundo pacífico","Mundo pacífico","Friedliche Welt","Monde pacifique","Dunia damai","Мир без угроз"],"r1":["Hiçbir ülke sizi sebepsiz yere hedef almaz. Savaş ancak sizin hakaretleriniz ve saldırganlığınızla biriken kin sonunda gelir.","No country targets you without reason. War only comes from grudges built up by your insults and aggression.","Ningún país te atacará sin motivo. La guerra solo llega por el rencor que acumulan tus insultos y tu agresividad.","Nenhum país ataca você sem motivo. A guerra só vem do rancor acumulado pelos seus insultos e agressões.","Kein Land greift dich grundlos an. Krieg droht erst, wenn sich durch deine Beleidigungen und Aggression Groll aufstaut.","Aucun pays ne vous cible sans raison. La guerre ne vient que de la rancune accumulée par vos insultes et votre agressivité.","Tak ada negara yang menyerang Anda tanpa alasan. Perang hanya datang dari dendam akibat hinaan dan agresi Anda.","Ни одна страна не нападёт без причины. Война начнётся лишь из-за обиды, накопленной вашими оскорблениями и агрессией."],"r2_t":["Gerçek ekonomi","Real economy","Economía real","Economia real","Echte Wirtschaft","Économie réelle","Ekonomi nyata","Реальная экономика"],"r2":["{n} şehir, gerçek sektörleriyle: Bursa'da otomotiv, Houston'da petrol, Shenzhen'de elektronik. Her birini geliştirebilirsiniz.","{n} cities with their real industries: cars in Bursa, oil in Houston, electronics in Shenzhen. You can develop every one.","{n} ciudades con sus sectores reales: autos en Bursa, function countryNameL(k,L){

  return CDATA_TR[k].n;
}

  if(L==='ru'&&LD_RU[k]) return LD_RU[k];

}
function cityNameL(n,L){

  let v=(L==='ru'&&CITY_RU[n])||CITY_INT[n];
  if(v&&typeof v==='object') v=v[L]||v.en;
  return v||n;
}

function sgLocalizeState(g){
  if(!g||!g.C||!g.cities) return;
  try{
    const langs=SG_LANGS.map(x=>x[0]);
    for(const k of Object.keys(g.C)){
      if(!CDATA_TR[k]) continue; const c=g.C[k];
      if(langs.some(L=>leaderNameL(k,L)===c.ld)) c.ld=leaderNameL(k,SG_LANG);

    if(g.cities.length===CITY_TR.length) g.cities.forEach((c,id)=>{ const o=CITY_TR[id];

  }catch(e){}
}

function spark(vals,w,h,col){
  if(!vals||vals.length<2) return `<svg width="${w}" height="${h}" aria-hidden="true"><path d="M0 ${h-2}H${w}" stroke="var(--track)"/></svg>`;
  const mn=Math.min(...vals), mx=Math.max(...vals), d=mx-mn||1;
  const pts=vals.map((v,i)=>[i/(vals.length-1)*(w-4)+2,h-3-(v-mn)/d*(h-6)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
  const last=pts[pts.length-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${line}L${last[0]} ${h}L2 ${h}Z" fill="${col}" opacity=".14"/><path d="${line}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="${col}"/></svg>`;
}

function toast(icon,title,sub,kind){

  t.innerHTML=`<span class="tic">${ic(icon,22)}</span><span class="tt"><b>${esc(title)}</b>${sub?`<span>${esc(sub)}</span>`:''}</span>`;

}

function newGame(pl){

  });
  // şehirler
  ISO.forEach(i=>{
    const d=CDATA[i]; const list=d.c; let W=0;
    const ws=list.map(c=>{const w=Object.entries(c[4]).reduce((s,[k,l])=>s+l*(SECT[k]?SECT[k].v:1),0)*Math.sqrt(c[3]+.2); W+=w; return w;});
    list.forEach((c,j)=>{
      const sec={}; Object.entries(c[4]).forEach(([k,l])=>{ if(SECT[k]) sec[k]=l; });
      const gdp=d.gdp*ws[j]/W;
      const pts=Object.entries(sec).reduce((s,[k,l])=>s+l*SECT[k].v,0)||1;
      g.cities.push({id:g.cities.length,n:c[0],lat:c[1],lon:c[2],pop:c[3],sec,home:i,own:i,cap:j===0,gdp,prod:gdp/pts,infra:1,fort:j===0?1:0,unrest:0,build:null,coastal:!!(sec.lim||sec.gem)});
    });

  });
  const me=g.C[pl];
  // başlangıç ittifak ve ticaret
  ISO.forEach(i=>{ if(i===pl) return; if(defPartners[pl].has(i)){ g.C[i].ally=true; g.C[i].rel=Math.max(g.C[i].rel,55); g.C[i].base=Math.max(g.C[i].base,45);} });
  ISO.filter(i=>i!==pl&&g.C[i].base>=20).sort((a,b)=>CDATA[b].gdp-CDATA[a].gdp).slice(0,10).forEach(i=>g.C[i].trade=true);
  // oyuncu ordusu bütçeye göre ölçekle

  if(up>inc*.4){ const f=inc*.4/up; me.kara*=f; me.hava*=f; me.deniz*=f; }
  me.kara=Math.max(1,Math.round(me.kara)); me.hava=Math.round(me.hava); me.deniz=Math.round(me.deniz);

  return g;
}

const myCities=()=>G.cities.filter(c=>c.own===G.player);
const citiesOf=i=>G.cities.filter(c=>c.own===i);
function cityOut(c){ // yıllık GSYH katkısı
  return c.gdp*(1+.06*(c.infra-1))*(1-c.unrest/200);
}
function countryGdp(i){ return citiesOf(i).reduce((s,c)=>s+cityOut(c),0); }
function secLevels(k){ return myCities().reduce((s,c)=>s+(c.sec[k]||0),0); }
function unitCost(u){
  const d=UNITS[u].disc.reduce((s,k)=>s+secLevels(k),0);
  return UNITS[u].cost*(1-clamp(d*.012,0,.45));
}
function upkeep(){ const m=G.C[G.player]; return m.kara*UNITS.kara.up+m.hava*UNITS.hava.up+m.deniz*UNITS.deniz.up; }
function tradeIncome(){
  const my=countryGdp(G.player); let t=0;
  ISO.forEach(i=>{ const c=G.C[i]; if(i!==G.player&&c.trade&&c.alive&&!c.war) t+=Math.min(my,countryGdp(i))*.0005; });
  return t;
}
function embargoLoss(){ const my=countryGdp(G.player); let t=0; ISO.forEach(i=>{ const c=G.C[i]; if(c.emb&&c.alive) t+=Math.min(my,countryGdp(i))*.0003; }); return t; }
function income(){
  const gdp=countryGdp(G.player);
  let gross=gdp*G.tax/100/12;
  if(G.stab<25) gross*=.75;
  const tr=tradeIncome(), emb=embargoLoss(), up=upkeep();
  const wars=ISO.filter(i=>G.C[i].war).length;
  const warCost=wars? gross*.06*wars:0;
  return {gdp,gross,tr,emb,up,warCost,net:gross+tr-emb-up-warCost};
}
function power(i){ const c=G.C[i]; return c.kara*UNITS.kara.pw+c.hava*UNITS.hava.pw+c.deniz*UNITS.deniz.pw; }

/* ================== HABERLER ================== */
function news(t,cls){ G.news.unshift({m:G.month,t,cls}); if(G.news.length>120) G.news.length=120; }
const flagN=i=>`${CDATA[i].f} ${CDATA[i].n}`;
const L=i=>G.C[i].ld;

/* ================== DİPLOMASİ ================== */
const REPLY={
 compl:[ _t('rp_compl1'),_t('rp_compl2'),_t('rp_compl3')],
 complCold:[ _t('rp_complCold1'),_t('rp_complCold2')],
 insult:[ _t('rp_insult1'),_t('rp_insult2'),_t('rp_insult3')],
 insultHard:[ _t('rp_insultHard1'),_t('rp_insultHard2')],
 gift:[ _t('rp_gift1'),_t('rp_gift2')],
 tradeY:[ _t('rp_tradeY1')],
 tradeN:[ _t('rp_tradeN1')],
 allyY:[ _t('rp_allyY1')],
 allyN:[ _t('rp_allyN1'),_t('rp_allyN2')],
 breakA:[ _t('rp_breakA1')],
 emb:[ _t('rp_emb1')],
 war:[ _t('rp_war1'),_t('rp_war2')],
 peaceY:[ _t('rp_peaceY1')],
 peaceN:[ _t('rp_peaceN1'),_t('rp_peaceN2')],
};
function say(i,key,extra){ const t=pick(REPLY[key]); G.C[i].msgs.unshift({m:G.month,t}); G.C[i].msgs.length=Math.min(G.C[i].msgs.length,4); return t; }
function adjRel(i,d){ const c=G.C[i]; c.rel=clamp(c.rel+d,-100,100); }
function friendsOf(i){ return ISO.filter(j=>j!==i&&j!==G.player&&G.C[j].alive&&(defPartners[i].has(j)||baseRel(i,j)>=45)); }
function rivalsOf(i){ return ISO.filter(j=>j!==i&&j!==G.player&&G.C[j].alive&&baseRel(i,j)<=-40); }
function onCool(i,a){ return (G.C[i].cool[a]||-99)>G.month; }
function setCool(i,a,n){ G.C[i].cool[a]=G.month+n; }

const ACT={
 compl(i){ const c=G.C[i]; c.cc=(c.cc||0)+1; const d=Math.round(9/c.cc+2); adjRel(i,d); c.base=clamp(c.base+1,-100,90); c.grudge=Math.max(0,c.grudge-6);
   rivalsOf(i).forEach(j=>adjRel(j,-1)); setCool(i,'compl',2);
   const t=say(i,c.rel>-20?'compl':'complCold'); news(_t('n_compl',{a:flagN(G.player),b:CDATA[i].n,l:L(i),q:t})); return _t('res_rel_plus',{d}); },
 insult(i){ const c=G.C[i]; adjRel(i,-20); c.grudge+=22; c.base=clamp(c.base-4,-100,100);
   friendsOf(i).forEach(j=>adjRel(j,-5)); rivalsOf(i).forEach(j=>adjRel(j,+4)); setCool(i,'insult',1);
   const t=say(i,c.grudge>45?'insultHard':'insult'); news(_t('n_insult',{a:flagN(G.player),b:CDATA[i].n,l:L(i),q:t}),'w');
   if(c.trade&&c.rel<-30){ c.trade=false; news(_t('n_trade_susp',{a:flagN(i)}),'w'); }
   return _t('res_insult'); },
 gift(i){ const amt=giftAmt(i); if(G.tre<amt) return null; G.tre-=amt; const d=Math.round(clamp(amt/Math.max(1,G.C[i].gdp)*600,6,25)); adjRel(i,d); G.C[i].grudge=Math.max(0,G.C[i].grudge-12); setCool(i,'gift',4);
   const t=say(i,'gift'); news(_t('n_gift',{a:flagN(G.player),b:CDATA[i].n,m:money(amt),l:L(i),q:t}),'g'); return _t('res_rel_plus',{d}); },
 trade(i){ const c=G.C[i]; setCool(i,'trade',3); const p=c.rel>=15?clamp((c.rel+20)/80,0,.97):0;
   if(Math.random()<p){ c.trade=true; c.emb=false; adjRel(i,5); const t=say(i,'tradeY'); news(_t('n_fta',{a:flagN(G.player),b:flagN(i)}),'g'); return _t('res_acc'); }
   say(i,'tradeN'); return _t('res_rej'); },
 embargo(i){ const c=G.C[i]; c.trade=false; c.emb=true; adjRel(i,-25); c.grudge+=10; friendsOf(i).forEach(j=>adjRel(j,-3)); say(i,'emb'); news(_t('n_emb',{a:flagN(G.player),b:flagN(i)}),'w'); return _t('res_emb_on'); },
 liftEmb(i){ const c=G.C[i]; c.emb=false; adjRel(i,8); news(_t('n_emb_off',{a:flagN(G.player),b:CDATA[i].n})); return _t('res_emb_off'); },
 ally(i){ const c=G.C[i]; setCool(i,'ally',6); const myP=power(G.player), hisP=power(i);
   let p=c.rel>=50?clamp((c.rel-40)/55+(myP>hisP?.1:0),0,.95):0;
   if(rivalsOf(G.player).length&&0) p-=.1;
   if(Math.random()<p){ c.ally=true; adjRel(i,8); say(i,'allyY'); news(_t('n_ally',{a:flagN(G.player),b:flagN(i)}),'g'); return _t('res_ally'); }
   say(i,'allyN'); return _t('res_rej'); },
 breakAlly(i){ const c=G.C[i]; c.ally=false; adjRel(i,-30); c.base-=15; c.grudge+=10; say(i,'breakA'); news(_t('n_break',{a:flagN(G.player),b:flagN(i)}),'w'); return _t('res_break'); },
 peace(i,offer){ return tryPeace(i,offer); },
};
function giftAmt(i){ return Math.max(.2, Math.min(G.C[i].gdp*.01, 40)); }

/* ================== SAVAŞ ================== */
function declareWar(i,byAI){
  const c=G.C[i]; const me=G.player;
  c.war=true; c.trade=false; c.ally=false; c.warM=0; c.rel=Math.min(c.rel,-80);
  if(!byAI){
    c.grudge+=40;
    ISO.forEach(j=>{ if(j===me||j===i||!G.C[j].alive) return; adjRel(j, CDATA[j].b.includes(me)?-10:-5); });
    say(i,'war');
    news(_t('n_war',{a:flagN(me),b:flagN(i)}),'r'); toast('swords',_t('t_war',{n:CDATA[i].n}),_t('t_mobil'),'r');
  } else {
    news(_t('n_aiwar',{a:flagN(i),b:flagN(me),l:L(i)}),'r');
  }
  // Hedefin müttefikleri
  const joinedEnemy=[], joinedMe=[];
  ISO.forEach(j=>{
    const cj=G.C[j]; if(j===me||j===i||!cj.alive||cj.war) return;
    const linkedI=defPartners[i].has(j)||(baseRel(i,j)>=55);
    if(linkedI){
      if(cj.ally){ // hem bize hem ona bağlı: ittifak bozulur
        if(!byAI){ cj.ally=false; adjRel(j,-35); news(_t('n_ally_susp',{a:flagN(j)}),'w'); }
        return;
      }
      if(defPartners[i].has(j) && !byAI && Math.random()<clamp(.55-cj.rel/200,0,.9)){ cj.war=true; cj.trade=false; cj.warM=0; cj.rel=Math.min(cj.rel,-70); joinedEnemy.push(j); }
      else adjRel(j,-25);
    }
    if(cj.ally && !linkedI){ const p=byAI?.85:clamp((cj.rel-30)/70,0,.8); if(Math.random()<p){ cj.cobel=(cj.cobel||[]); if(!cj.cobel.includes(i)) cj.cobel.push(i); joinedMe.push(j);} else { adjRel(j,-8); } }
  });
  if(joinedEnemy.length) news(_t('n_join_enemy',{a:joinedEnemy.map(flagN).join(', '),b:CDATA[i].n}),'r');
  if(joinedMe.length) news(_t('n_join_me',{a:joinedMe.map(flagN).join(', ')}),'g');
  G.wars=ISO.filter(j=>G.C[j].war);
}
function landTerritory(){ const s=new Set(myCities().map(c=>c.home)); return s; }
function reachable(city){
  const me=G.player; const terr=landTerritory();
  if(terr.has(city.home)) return {ok:true,how:'kara'};
  for(const t of terr) if(CDATA[t].b.includes(city.home)) return {ok:true,how:'kara'};
  if(G.C[me].deniz>=3 && city.coastal) return {ok:true,how:'deniz'};
  if(G.C[me].deniz>=6 && !CDATA[city.home].ll) return {ok:true,how:'deniz'};
  if(G.C[me].hava>=8) return {ok:true,how:'hava',weak:true};
  return {ok:false};
}
function allySupport(enemy){ return ISO.reduce((s,j)=>{ const c=G.C[j]; return s+((c.cobel||[]).includes(enemy)&&c.ally&&c.alive?power(j)*.06:0); },0); }
function enemyCoSupport(enemy){ return ISO.reduce((s,j)=>{ const c=G.C[j]; return s+(j!==enemy&&c.war&&c.alive?power(j)*.05:0); },0); }
function cityDefense(city){
  const o=city.own; const c=G.C[o];
  const nCities=citiesOf(o).length;
  let share=city.cap&&city.home===o?.4:clamp(1.6/nCities,.08,.35);
  let d=power(o)*share;
  d+=enemyCoSupport(o);
  return d*(1+.25*city.fort)*(1+city.infra*.02);
}
function attackCity(id,pk,ph,pd){
  const city=G.cities[id]; const me=G.C[G.player]; const enemy=city.own; const r=reachable(city);
  const k=me.kara*pk, h=me.hava*ph, d=(r.how==='deniz'||city.coastal)?me.deniz*pd:0;
  if(k+h+d<=0) return;
  const tech=1+clamp(secLevels('sav')*.01,0,.3);
  let A=(k*UNITS.kara.pw+h*UNITS.hava.pw+d*UNITS.deniz.pw)*tech*rnd(.85,1.15)+allySupport(enemy);
  if(r.how==='hava') A*=.7;
  const D=cityDefense(city)*rnd(.85,1.15);
  const ratio=A/Math.max(.01,D);
  const win=ratio>1;
  const myLoss=clamp((win?.25:.45)/ratio,.04,.65);
  me.kara-=k*myLoss; me.hava-=h*myLoss*.7; me.deniz-=d*myLoss*.6;
  const e=G.C[enemy]; const eLossFrac=clamp((win?.45:.25)*Math.min(ratio,2),.03,.7)*(D/Math.max(1,power(enemy)+enemyCoSupport(enemy)));
  e.kara*=1-eLossFrac; e.hava*=1-eLossFrac*.8; e.deniz*=1-eLossFrac*.6;
  ['kara','hava','deniz'].forEach(u=>{ me[u]=Math.max(0,me[u]); });
  const rep={city:city.n,enemy,A,D,win,myLoss:{k:k*myLoss,h:h*myLoss*.7,d:d*myLoss*.6}};
  if(win){
    captureCity(city,G.player);
    news(_t('n_city_fell',{c:city.n,a:flagN(G.player),b:CDATA[enemy].n}),'r');
    if(city.cap && city.home===enemy){ capitulate(enemy); rep.capit=true; }
  } else news(_t('n_atk_fail',{c:city.n,b:CDATA[enemy].n}),'w');
  G.C[enemy].warScore=(G.C[enemy].warScore||0)+(win?10:-4);
  return rep;
}
function captureCity(city,to){
  const from=city.own; city.own=to; city.unrest=to===city.home?0:60; city.build=null; city.fort=Math.max(0,city.fort-1);
  if(from!==G.player) G.C[from].lost++;
  if(from===G.player && city.id===G.capital){ // başkent taşı
    const rest=myCities().sort((a,b)=>cityOut(b)-cityOut(a));
    if(rest.length){ G.capital=rest[0].id; news(_t('n_gov_move',{c:rest[0].n}),'w'); }
  }
}
function capitulate(i){
  const c=G.C[i];
  citiesOf(i).forEach(ct=>captureCity(ct,G.player));
  c.alive=false; c.war=false; c.trade=false; c.ally=false;
  news(_t('n_capit',{a:flagN(i),l:L(i),b:CDATA[G.player].n}),'r');
  ISO.forEach(j=>{ const cj=G.C[j]; if(cj.alive&&j!==G.player) adjRel(j, defPartners[i].has(j)?-30:-8); });
  // Teslim olan ülke için savaşan müttefikler devam etsin mi?
  ISO.forEach(j=>{ const cj=G.C[j]; if(cj.war&&cj.alive&&j!==i&&!ISO.some(k=>k!==j&&G.C[k].war&&G.C[k].alive&&defPartners[k].has(j))&&Math.random()<.6){ makePeace(j,_t('why_ally_surr')); } });
  G.wars=ISO.filter(j=>G.C[j].war);
}
function makePeace(i,why){
  const c=G.C[i]; c.war=false; c.warM=0; c.base=Math.min(c.base,-20); c.rel=clamp(c.rel+25,-100,-10); c.grudge=Math.max(10,c.grudge*.5);
  ISO.forEach(j=>{ const cj=G.C[j]; if(cj.cobel) cj.cobel=cj.cobel.filter(x=>x!==i); });
  news(_t('n_peace',{a:flagN(G.player),b:flagN(i),w:why||''}),'g'); toast('dove',_t('t_peace',{n:CDATA[i].n}),why||_t('t_guns_silent'),'g');
  G.wars=ISO.filter(j=>G.C[j].war);
}
function peaceChance(i,demand){
  const c=G.C[i];
  const lostFrac=c.lost/Math.max(1,c.orig);
  const ratio=power(G.player)/Math.max(1,power(i)+enemyCoSupport(i));
  let s=.15+lostFrac*.9+clamp(ratio-1,-.5,1.2)*.25+c.warM*.025-c.grudge*.004+(c.warScore||0)*.004;
  if(demand) s-=.25;
  return clamp(s,0,.95);
}
function tryPeace(i,demand){
  const c=G.C[i]; setCool(i,'peace',2);
  if(Math.random()<peaceChance(i,demand)){
    say(i,'peaceY');
    let extra='';
    if(demand){ // en yakın sınır şehrini iste
      const cand=citiesOf(i).filter(ct=>!(ct.cap&&ct.home===i)).sort((a,b)=>b.gdp-a.gdp);
      if(cand.length){ captureCity(cand[cand.length>1?1:0],G.player); extra=' '+_t('x_ceded',{c:cand[cand.length>1?1:0].n}); }
    }
    // kendi işgal ettiğimiz şehirler bizde kalır; onların işgal ettikleri onlarda kalır
    makePeace(i,extra); return _t('res_acc')+extra;
  }
  say(i,'peaceN'); return _t('res_rej');
}

/* ================== AY DÖNGÜSÜ ================== */
function endTurn(){
  const me=G.C[G.player];
  const inc=income();
  G.tre+=inc.net;
  // inşaat
  myCities().forEach(c=>{
    if(c.build){ c.build.left--; if(c.build.left<=0){ finishBuild(c); } }
    if(c.unrest>0) c.unrest=Math.max(0,c.unrest-2.5);
    c.gdp*=1+(.0012+(G.stab-50)/60000); // organik büyüme
    c.pop*=1.0007;
  });
  // AI ekonomileri
  ISO.forEach(i=>{ if(i===G.player) return; const c=G.C[i]; if(!c.alive) return;
    const gr=1+rnd(.0005,.0035)-(c.war?.003:0);
    citiesOf(i).forEach(ct=>{ ct.gdp*=gr; ct.pop*=1.0006; if(ct.unrest>0) ct.unrest=Math.max(0,ct.unrest-2); });
    c.gdp=countryGdp(i);
    const tgt=Math.pow(CDATA[i].mil,1.6)/10*(c.gdp/CDATA[i].gdp);
    const regen=c.war?.02:.01;
    if(c.kara<tgt) c.kara+=tgt*regen; if(c.hava<tgt*.4) c.hava+=tgt*.4*regen; if(!CDATA[i].ll&&c.deniz<tgt*.25) c.deniz+=tgt*.25*regen*.6;
  });
  // istikrar
  let ds=(20-G.tax)*.12 + (G.tre<0?-2:0) - G.wars.length*1.1 + (70-G.stab)*.03;
  const occ=myCities().filter(c=>c.unrest>30).length; ds-=occ*.15;
  G.stab=clamp(G.stab+ds,0,100);
  if(G.tre<0){ // borç: ordu dağılır
    me.kara*=.97; me.hava*=.98; me.deniz*=.98;
    if(G.month%3===0) news(_t('n_debt'),'w');
  }
  // ilişki dinamiği
  ISO.forEach(i=>{ if(i===G.player) return; const c=G.C[i]; if(!c.alive) return;
    c.grudge=Math.max(0,c.grudge-.8);
    c.cc=Math.max(0,(c.cc||0)-.25);
    let target=c.base+(c.trade?8:0)+(c.ally?12:0)-(c.emb?25:0)-c.grudge*.5;
    if(!c.war) c.rel+= (target-c.rel)*.06;
    c.rel=clamp(c.rel,-100,100);
    if(c.war) c.warM++;
  });
  aiDecisions();
  aiWarMoves();
  worldNews();
  G.hist=G.hist||[]; G.hist.push({g:Math.round(income().gdp),t:Math.round(G.tre),p:Math.round(power(G.player)),s:Math.round(G.stab)}); if(G.hist.length>240) G.hist.shift();
  G.month++;
  save();
  render();
  showNextEvent();
}
function finishBuild(c){
  const b=c.build; c.build=null;
  if(b.t==='sec'){ const old=c.sec[b.k]||0; c.sec[b.k]=old+1; c.gdp+=b.gain; news(old?_t('n_sec_up',{c:c.n,s:SECT[b.k].n,l:old+1,g:money(b.gain)}):_t('n_sec_new',{c:c.n,s:SECT[b.k].n,g:money(b.gain)}),'g');
    const nt=tierIdx(old+1)!==tierIdx(old)||!old; toast(b.k,`${c.n} · ${SECT[b.k].n} ${old+1}`,nt?_t('t_newtier',{t:tierName(old+1),g:money(b.gain)}):_t('t_gdp_gain',{g:money(b.gain)}),'g'); }
  if(b.t==='infra'){ c.infra++; news(_t('n_infra',{c:c.n,l:c.infra}),'g'); toast('infra',`${c.n} · ${_t('infra')} ${c.infra}`,_t('t_infra_sub'),'g'); }
  if(b.t==='fort'){ c.fort++; news(_t('n_fort',{c:c.n,l:c.fort}),'g'); toast('fort',`${c.n} · ${_t('fort')} ${c.fort}`,_t('t_fort_sub'),'g'); }
}
function aiDecisions(){
  const me=G.player;
  ISO.forEach(i=>{ if(i===me) return; const c=G.C[i]; if(!c.alive||c.war) return;
    // provokasyona dayalı savaş: SADECE oyuncunun hakaret/saldırganlığı ile biriken kin
    if(c.grudge>=60 && c.rel<=-80){
      const myP=power(me)+ISO.reduce((s,j)=>s+(G.C[j].ally&&G.C[j].alive?power(j)*.3:0),0);
      const theirP=power(i)+friendsOf(i).reduce((s,j)=>s+power(j)*.2,0);
      if(!c.ultim){ c.ultim=G.month; G.events.push({type:'ultim',i}); return; }
      if(G.month-c.ultim>=2 && theirP>myP*.55 && Math.random()<.5){ declareWar(i,true); G.events.push({type:'aiwar',i}); return; }
    } else if(c.ultim && c.rel>-60) c.ultim=0;
    if(c.grudge>=30 && c.rel<-50 && !c.emb && c.trade && Math.random()<.3){ c.trade=false; news(_t('n_ai_trade_susp',{a:flagN(i),b:CDATA[me].n,l:L(i)}),'w'); }
    // olumlu teklifler
    if(!c.ally && c.rel>=72 && !onCool(i,'aiAlly') && Math.random()<.05){ setCool(i,'aiAlly',18); G.events.push({type:'allyOffer',i}); }
    else if(!c.trade && !c.emb && c.rel>=35 && !onCool(i,'aiTrade') && Math.random()<.04){ setCool(i,'aiTrade',12); G.events.push({type:'tradeOffer',i}); }
  });
  // savaştaki düşmanların barış teklifi
  ISO.forEach(i=>{ const c=G.C[i]; if(!c.war||!c.alive||onCool(i,'aiPeace')) return;
    if(peaceChance(i,false)>.6 && Math.random()<.35){ setCool(i,'aiPeace',6); G.events.push({type:'peaceOffer',i}); } });
}
function aiWarMoves(){
  const me=G.player;
  ISO.forEach(i=>{ const c=G.C[i]; if(!c.war||!c.alive) return;
    if(Math.random()>.45) return;
    const mine=myCities(); if(mine.length<=1) return;
    const terr=new Set(citiesOf(i).map(x=>x.home));
    let targets=mine.filter(ct=>terr.has(ct.home)||[...terr].some(t=>CDATA[t].b.includes(ct.home)));
    if(!targets.length && c.deniz>=4) targets=mine.filter(ct=>ct.coastal);
    if(!targets.length) return;
    const ec=citiesOf(i); const dist=ct=>Math.min(...ec.map(e=>(e.lat-ct.lat)**2+(e.lon-ct.lon)**2));
    targets.sort((a,b)=>dist(a)-dist(b));
    const t=Math.random()<.7?targets[0]:pick(targets.slice(0,3));
    const A=power(i)*rnd(.18,.32)+enemyCoSupport(i)*.5;
    const myN=mine.length;
    const D=(power(me)*(t.id===G.capital?.4:clamp(1.6/myN,.08,.35))+allySupport(i))*(1+.25*t.fort)*rnd(.85,1.15);
    const ratio=A/Math.max(.01,D);

function ownerOfFeature(f){
  const iso=f.p; if(!CDATA[iso]) return null;
  const cap=G.cities.find(c=>c.home===iso&&c.cap);
  return cap?cap.own:iso;
}
function countryTip(f){
  const iso=f.p; if(!CDATA[iso]) return f.id;
  const o=ownerOfFeature(f);
  let s=`${CDATA[iso].f} <b>${esc(CDATA[iso].n)}</b>`;
  if(o!==iso) s+=` <span style="color:var(--brass)">· ${_t('under_ctrl',{n:esc(CDATA[o].n)})}</span>`;
  else if(iso!==G.player){ const c=G.C[iso]; s+=` · ${relLabel(c.rel)} <span class="num">${Math.round(c.rel)}</span>${c.war?' · <b style="color:var(--war)">'+_t('war_caps')+'</b>':c.ally?' · '+_t('ally_lc'):''}`; }
  return s;
}
function colorFor(iso,owner){
  const me=G.player;
  if(owner===me) return '#d99a33';

  if(G.mode==='eco'){ const v=Math.log10(Math.max(1,countryGdp(owner))); return d3.interpolateRgb('#22343a','#5fb0d4')(clamp((v-.5)/4,0,1)); }

function topSec(c){ let b=null,bl=-1; for(const [k,l] of Object.entries(c.sec)) if(l*SECT[k].v>bl){bl=l*SECT[k].v;b=k;} return b; }

    </div>
    <div class="sec"><h3>${ic('hand',14)} ${_t('relations')}</h3>
      ${wars.length?`<div class="rlab war">${ic('swords',14)} ${_t('at_war')}</div>${flagList(wars,'war')}`:''}
      <div class="rlab ally">${ic('shieldp',14)} ${_t('allies')} · ${allies.length}</div>${flagList(allies,'ally')}
      <div class="rlab trade">${ic('lim',14)} ${_t('partners')} · ${trade.length}</div>${flagList(trade,'trade')}
    </div>
    <div class="sec"><h3>${ic('build',14)} ${_t('your_cities')} · ${cs.length}</h3><div class="clist">${cityRows}</div></div>
  </div>`);
  paintMap();
  if(!keep) zoomHome();
}
window.openMine=openMine;
window.recruit=function(u,n){ const me=G.C[G.player]; if(n<0){ me[u]=Math.max(0,me[u]+n); } else { const c=unitCost(u)*n; if(G.tre<c) return; G.tre-=c; me[u]+=n; } save(); render(); openMine(true); };
function openNews(keep){ sel={t:'news'}; openPanel(header('📰',_t('world_agenda'),_t('recent'))+`<div class="pb"><div class="list">${G.news.map(n=>`<div style="padding:6px 0;border-bottom:1px solid #ffffff0f"><span class="num note">${dateStr(n.m)}</span><br>${esc(n.t)}</div>`).join('')}</div></div>`); }

/* ================== ÜST ŞERİT ================== */
function render(){
  if(!G) return;
  const me=G.C[G.player], d=CDATA[G.player]; const inc=income();
  $('#meFlag').textContent=d.f; $('#meName').textContent=d.n;
  const ph=(G.hist||[])[(G.hist||[]).length-2]; const tr=(v,p)=>p===undefined?'':v>p*1.0005?'<i class="up">▲</i>':v<p*.9995?'<i class="dn">▼</i>':'';
  $('#sTre').innerHTML=money(G.tre)+(ph?tr(G.tre,ph.t):''); $('#sTre').style.color=G.tre<0?'var(--hostile)':'';
  $('#sInc').textContent=(inc.net>=0?'+':'')+money(inc.net); $('#sInc').style.color=inc.net<0?'var(--hostile)':'var(--good)';
  $('#sGdp').innerHTML=money(inc.gdp)+(ph?tr(inc.gdp,ph.g):'');
  $('#sStab').textContent=pct(Math.round(G.stab)); $('#sStab').style.color=G.stab<30?'var(--hostile)':'';
  $('#sPow').innerHTML=Math.round(power(G.player))+(G.wars.length?' ⚔'+G.wars.length:'')+(ph?tr(power(G.player),ph.p):'');
  $('#sDate').textContent=dateStr(G.month);
  $('#ticker').innerHTML=G.news.slice(0,12).map(n=>`<div><span class="d">${dateStr(n.m)}</span>${n.cls==='r'?'<b>':''}${esc(n.t)}${n.cls==='r'?'</b>':''}</div>`).join('');
  $('#playBtn').textContent=G.auto?'⏸':'▶'; $('#spdBtn').textContent=G.spd+'×';
  document.querySelectorAll('#modes .btn').forEach(b=>b.classList.toggle('on',b.dataset.m===G.mode));
  paintMap(); rerender();
}

/* ================== KAYIT ================== */
const KEY='dunya-duzeni-kayit-v1';
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(G)); }catch(e){} }
function loadSaved(){ try{ const s=localStorage.getItem(KEY); return s?JSON.parse(s):null; }catch(e){ return null; } }

/* ================== OTOMATİK ================== */
let timer=null;
function startAuto(){ G.auto=true; clearInterval(timer); timer=setInterval(()=>{ if(!$('#ovl').hidden) return; endTurn(); },[0,2200,1100,450][G.spd]); render(); }
function stopAuto(){ if(!G) return; G.auto=false; clearInterval(timer); timer=null; $('#playBtn').textContent='▶'; }

/* ================== BAŞLANGIÇ EKRANI ================== */
function startScreen(){
  const s=$('#start'); s.hidden=false;
  const saved=loadSaved();
  const list=ISO.slice().sort((a,b)=>CDATA[b].gdp-CDATA[a].gdp);
  s.innerHTML=`<div class="wrap">
    <div class="langrow">${sgLangBtnHtml('langBtn')}</div>
    <h1>${_t('h1')}</h1>
    <p class="lead">${_t('lead')}</p>
    <div class="rules">
      <div><b>${_t('r1_t')}</b>${_t('r1')}</div>
      <div><b>${_t('r2_t')}</b>${_t('r2',{n:G0cities()})}</div>
      <div><b>${_t('m_dip')}</b>${_t('r3')}</div>
      <div><b>${_t('r4_t')}</b>${_t('r4')}</div>
    </div>
    ${saved?`<div><button class="btn pri" id="contBtn">${_t('continue_saved')} · ${CDATA[saved.player].f} ${esc(CDATA[saved.player].n)} · ${dateStr(saved.month)}</button></div>`:''}
    <div class="searchrow"><input type="text" id="srch" placeholder="${esc(_t('search_ph',{a:CDATA.TUR.n,b:CDATA.JPN.n,c:CDATA.BRA.n}))}" aria-label="${_t('search_aria')}"><span class="note">${_t('countries_sorted',{n:list.length})}</span></div>
    <div class="pick" id="pickList"></div>
    <p class="note">${_t('data_note')}</p>
  </div>`;
  const fill=q=>{ q=(q||'').toLocaleLowerCase(SG_LANG);
    $('#pickList').innerHTML=list.filter(i=>!q||CDATA[i].n.toLocaleLowerCase(SG_LANG).includes(q)||CDATA[i].ld.toLocaleLowerCase(SG_LANG).includes(q)).map(i=>{ const d=CDATA[i];
      return `<button class="pc" data-i="${i}"><span class="flag">${d.f}</span><span class="t"><b>${esc(d.n)}</b><span>${esc(d.ld)}</span><span class="num">${money(d.gdp)} · ${_t('power_lc')} ${Math.round(Math.pow(d.mil,1.6)/10*2.5)} · ${_t('n_cities',{n:d.c.length})}</span><span class="cicons">${topSecsOf(d).map(k=>ic(k,13)).join('')}</span></span></button>`; }).join(''); };
  fill('');
  $('#langBtn').onclick=sgOpenLangPicker;
  $('#srch').oninput=e=>fill(e.target.value);
  $('#pickList').onclick=e=>{ const b=e.target.closest('.pc'); if(!b) return; confirmPick(b.dataset.i); };
  if(saved) $('#contBtn').onclick=()=>{ G=saved; begin(); };
}
function topSecsOf(d){ const m={}; d.c.forEach(c=>Object.entries(c[4]).forEach(([k,l])=>{ if(SECT[k]) m[k]=(m[k]||0)+l*SECT[k].v*Math.sqrt(c[3]+.2); })); return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0]); }
function G0cities(){ return ISO.reduce((s,i)=>s+CDATA[i].c.length,0); }
function confirmPick(i){
  const d=CDATA[i]; const saved=loadSaved();
  $('#ovl').hidden=true;
  modal(`${d.f} ${d.n}`,`<p>${_t('replace_ld',{t:esc(d.t),l:'<b>'+esc(d.ld)+'</b>'})}</p><p class="note">${_t('gdp')} ${money(d.gdp)} · ${_t('pop_lc')} ${fmtPop(d.pop)} · ${_t('n_cities',{n:d.c.length})}${bloc[i].length?' · '+bloc[i].map(blocName).join(', '):''}</p>${saved?'<p class="note">'+_t('save_overwrite')+'</p>':''}`,
    [[_t('start_game'),()=>{ newGame(i); begin(); },'pri'],[_t('back'),()=>{}]]);
}
function begin(){
  document.querySelectorAll('[data-ic]').forEach(e=>{ if(!e.querySelector('svg')) e.insertAdjacentHTML('afterbegin',ic(e.dataset.ic,11)); });
  $('#start').hidden=true; $('#start').innerHTML='';
  if(!G.events) G.events=[]; if(!G.hist) G.hist=[];
  sgLocalizeState(G);
  initMap(); render(); setTimeout(zoomHome,60);
  if(window.innerWidth>760) setTimeout(()=>openMine(true),700);
  save();
}

/* ================== OLAY BAĞLARI ================== */
$('#nextBtn').onclick=()=>{ endTurn();
  // Birkaç ayda bir, ay sonunda: ödüllü geçiş reklamı (tanıtım + Atla)
  if(window.AdKit&&!G.auto&&$('#ovl').hidden){ const amt=Math.max(1,income().gross*2);
    AdKit.levelDone({title:_t('ad_fund_t'),reward:_t('ad_treas',{m:money(amt)})}).then(ok=>{ if(ok){ G.tre+=amt; save(); render(); toast('cash',_t('ad_fund'),_t('ad_added',{m:money(amt)}),'g'); } }); }
};
// Ödüllü reklam: dış yardım (+3 aylık vergi geliri)
$('#aidBtn').onclick=()=>{ if(!window.AdKit||!G) return; stopAuto(); const amt=Math.max(1,income().gross*3);
  AdKit.offer({title:_t('ad_aid_t'),text:_t('ad_aid_txt'),reward:_t('ad_treas',{m:money(amt)}),button:_t('ad_watch'),decline:_t('ad_decline')})
    .then(ok=>{ if(ok){ G.tre+=amt; save(); render(); toast('cash',_t('ad_aid_ok'),_t('ad_added',{m:money(amt)}),'g'); } }); };
$('#playBtn').onclick=()=>{ G.auto?stopAuto():startAuto(); };
$('#spdBtn').onclick=()=>{ G.spd=G.spd%3+1; if(G.auto) startAuto(); else render(); };
$('#meBtn').onclick=()=>openMine();
$('#menuBtn').onclick=()=>{ stopAuto();
  modal(_t('menu'),`<p class="note">${_t('menu_note')}</p><textarea id="saveTxt" rows="4" aria-label="${_t('save_code')}" spellcheck="false"></textarea>`,
  [[_t('news'),()=>openNews()],[_t('copy_save'),()=>{}],[_t('load_code'),()=>{}],[_t('new_game'),()=>{ startScreen(); }],[_t('close'),()=>{}],['🌐 '+sgLangName(),()=>sgOpenLangPicker()]]);
  const ta=$('#saveTxt'); const btns=$('#modal').querySelectorAll('.acts button');
  btns[1].onclick=()=>{ ta.value=btoa(unescape(encodeURIComponent(JSON.stringify(G)))); ta.select(); navigator.clipboard?.writeText(ta.value).then(()=>{btns[1].textContent=_t('copied');},()=>{btns[1].textContent=_t('selected_copy');}); };
  btns[2].onclick=()=>{ try{ const g=JSON.parse(decodeURIComponent(escape(atob(ta.value.trim())))); if(!g.player||!g.C) throw 0; G=g; $('#ovl').hidden=true; begin(); }catch(e){ ta.setCustomValidity(_t('bad_code')); ta.reportValidity(); } };
};
$('#modes').onclick=e=>{ const b=e.target.closest('.btn'); if(!b) return; G.mode=b.dataset.m; render(); };
$('#zin').onclick=()=>svg.transition().call(zoom.scaleBy,1.6);
$('#zout').onclick=()=>svg.transition().call(zoom.scaleBy,1/1.6);
$('#zhome').onclick=()=>zoomHome();
document.addEventListener('keydown',e=>{ if(!G||$('#start').hidden===false) return; if(e.target.matches('input,textarea,select')) return;
  if(e.key===' '){ e.preventDefault(); if($('#ovl').hidden) endTurn(); } if(e.key==='Escape'){ if(!$('#ovl').hidden) return; closePanel(); } });
let rT; window.addEventListener('resize',()=>{ clearTimeout(rT); rT=setTimeout(()=>{ if(G&&$('#start').hidden){ const t=d3.zoomTransform(svg.node()); initMap(); paintMap(); svg.call(zoom.transform,t);} },200); });
window.G_=()=>G;

function boot(data){
  try{ window.claude?.hot?.snapshot?.(()=>({g:G})); }catch(e){}
  if(data&&data.g&&data.g.player){ G=data.g; begin(); } else startScreen();
}
if(window.claude?.hot?.ready) window.claude.hot.ready(boot); else boot(window.claude?.hot?.data??{});
</script>

</body></html>
