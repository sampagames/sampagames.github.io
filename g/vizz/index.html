/* Layout: full-bleed game stage; slim HUD strip on top; paper-card overlays for the route map, pause and results */
:root{
  --ink:#122429; --ink-2:#1c3439; --ink-3:#28474d;
  --paper:#f7f0dc; --paper-2:#ece2c6; --muted:#4e6a64;
  --marigold:#ffc93c; --tomato:#ff6a4d; --mint:#8fe3c4;
  --display:"Rammetto One","Arial Black",system-ui,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--paper);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none}
#app{position:relative;height:100%;width:100%;overflow:hidden}
canvas#game{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px;pointer-events:none;
  background:linear-gradient(to bottom,rgba(18,36,41,.82),rgba(18,36,41,0))}
.hud>*{pointer-events:auto}
.stat{display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.lives{display:flex;gap:3px}
.lives svg{width:22px;height:16px}
.lives svg.lost{opacity:.22}
.cube{width:14px;height:14px;border-radius:3px;background:var(--paper);box-shadow:inset -3px -3px 0 rgba(0,0,0,.18)}
.track-wrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.room{font-family:var(--display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--marigold);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{position:relative;height:8px;border-radius:8px;background:rgba(247,240,220,.16)}
.track i{position:absolute;top:0;bottom:0;width:2px;background:rgba(247,240,220,.35)}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:var(--marigold)}

<script>

'use strict';
const H=600, FLOOR=520, FLY_MAX_Y=505, G=1900;

// ---------- canvas ----------

const DFONT='"Rammetto One", "Arial Black", system-ui, sans-serif';

// ---------- precomputed decor ----------
const DECOR=(()=>{const R=srand(7),d={};

  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02);}

const AD_SECONDS=5, AD_NOFILL=.04;

const Ads={
  log(e,pl){WAL.log.push({t:Date.now(),e,p:pl});if(WAL.log.length>60)WAL.log.splice(0,WAL.log.length-60);
    try{console.info('[vizz-ad]',e,pl);}catch(_){}try{if(window.VizzAnalytics&&window.VizzAnalytics.track)window.VizzAnalytics.track(e,{placement:pl});}catch(_){}},
  bump(pl,k){const s=WAL.stats[pl]||(WAL.stats[pl]={});s[k]=(s[k]||0)+1;},
  offered(pl){this.bump(pl,'o');this.log('offer_shown',pl);saveW();},
  left(pl){ensureDay();const c=AD_RULES.caps[pl],per=c&&c.perDay?c.perDay:Infinity;return Math.max(0,Math.min(per-(WAL.ads.byPl[pl]||0),AD_RULES.daily-WAL.ads.day));},
  canShow(pl){return this.left(pl)>0;},
  async show(pl,rewardText){ensureDay();this.log('ad_requested',pl);
    if(!this.canShow(pl)){this.log('ad_capped',pl);return{ok:false,reason:'cap'};}
    this.bump(pl,'s');if(buzzG)buzzG.gain.value=0;let r;
    try{const br=window.VizzAdsBridge;r=br&&br.show?await br.show(pl,{reward:rewardText}):await mockShow(pl,rewardText);}catch(e){r='failed';}
    if(r==='rewarded'){WAL.ads.day++;WAL.ads.byPl[pl]=(WAL.ads.byPl[pl]||0)+1;WAL.ads.total=(WAL.ads.total||0)+1;this.bump(pl,'c');this.log('ad_rewarded',pl);saveW();return{ok:true};}
    this.bump(pl,r==='dismissed'?'d':'f');this.log(r==='dismissed'?'ad_dismissed':'ad_failed',pl);saveW();return{ok:false,reason:r};}
};
function offerHTML(pl,title,sub){const ok=Ads.canShow(pl);Ads.offered(pl);
  return `<button class="offer" id="of_${pl}" ${ok?'':'disabled'}><span class="play">${ICON.play}</span><span><b>${title}</b><small>${ok?sub:t('ad_capped_sub')}</small></span><span class="cap">${t('ad')}</span></button>`;}
async function runAd(pl,rewardText,grant,after){const r=await Ads.show(pl,rewardText);
  if(r.ok){grant();Ads.log('reward_granted',pl);saveW();sfx.win();}
  else if(r.reason==='failed')toast(t('ad_fail_t'),t('ad_fail_s'));
  else if(r.reason==='cap')toast(t('ad_cap_t'),t('ad_cap_s'));
  else if(r.reason==='dismissed')toast(t('ad_dis_t'),t('ad_dis_s'));
  if(after)after(r);}
function mockShow(pl,rewardText){return new Promise(res=>{
  const ad=$('ad'),foot=$('adFoot'),right=$('adRight');let left=AD_SECONDS,phase='load',paused=false,raf=0,iv=null,done=false;
  ad.hidden=false;$('adReward').textContent=t('ad_reward',{r:rewardText});right.innerHTML='';foot.innerHTML='<p>'+t('ad_loading')+'</p>';
  const finish=r=>{if(done)return;done=true;cancelAnimationFrame(raf);clearInterval(iv);ad.hidden=true;res(r);};
  const playing='<p>'+t('ad_playing')+'</p>';
  setTimeout(()=>{if(done)return;
    if(Math.random()<AD_NOFILL){phase='load';foot.innerHTML='<p>'+t('ad_none')+'</p><button class="btn" id="adOk">'+t('ok')+'</button>';$('adOk').onclick=()=>finish('failed');$('adOk').focus();return;}
    phase='play';Ads.log('ad_started',pl);foot.innerHTML=playing;
    right.innerHTML=`<span class="adctl"><span class="count" id="adCount">${left}</span><button class="x" id="adX" aria-label="${t('ad_close')}">✕</button></span>`;
    $('adX').onclick=()=>{if(left<=0)return;paused=true;foot.innerHTML='<div class="confirm"><b>'+t('ad_warn')+'</b><div class="row"><button class="btn" id="adBack">'+t('ad_back')+'</button><button class="btn ghost" id="adQuit">'+t('ad_quit')+'</button></div></div>';
      $('adBack').onclick=()=>{paused=false;foot.innerHTML=playing;};$('adQuit').onclick=()=>finish('dismissed');$('adBack').focus();};
    iv=setInterval(()=>{if(paused)return;left--;const c=$('adCount');if(c)c.textContent=Math.max(0,left);
      if(left<=0){clearInterval(iv);right.innerHTML='';foot.innerHTML=`<p>${t('ad_done')}</p><button class="btn" id="adClaim">${t('ad_claim',{r:rewardText})}</button>`;$('adClaim').onclick=()=>finish('rewarded');$('adClaim').focus();}},1000);
  },700);
  const draw=()=>{drawAdCreative(performance.now()/1000,phase);raf=requestAnimationFrame(draw);};draw();});}

function updGoal(h,dt){h.pt+=dt*(h.spd||1);
  if(h.style==='alafranga'){const D=[2.4,.3,1.7,.3];if(h.pt>D[h.phase]){h.pt=0;h.phase=(h.phase+1)%4;}const p=h.pt/D[h.phase];h.open=[1,1-p,0,p][h.phase];}
  else{const D=[2.6,.6,1.3];if(h.pt>D[h.phase]){h.pt=0;h.phase=(h.phase+1)%3;if(h.phase===2&&near(h.x))sfx.flush();}h.open=h.phase===2?0:1;
    if(h.phase===2){const hg=170*Math.sin(Math.PI*h.pt/1.3);if(Math.abs(fly.x-h.x)<22+fly.r*.5&&fly.y>516-hg)hitFly(t('hit_splash'));
      if(Math.random()<.5)parts.push({x:h.x+(Math.random()-.5)*30,y:516-hg,vx:(Math.random()-.5)*160,vy:-60-Math.random()*80,life:.5,max:.5,r:2+Math.random()*2,col:'rgba(160,215,245,.9)'});}}}
function goalReached(g){if(!g)return false;if(g.style==='alafranga')return g.open>.82&&fly.x>g.x+18&&fly.x<g.x+145&&fly.y>396;
  return g.phase<2&&Math.abs(fly.x-g.x)<44&&fly.y>FLY_MAX_Y-14;}
function updColumn(h,dt){h.t+=dt;const c=cyc(h);
  if(c.ph==='act'){if(!h.fired){h.fired=true;if(near(h.x))(h.style==='fire'?sfx.flame:sfx.splash)();}
    if(h.style==='fire'){for(let i=0;i<2;i++)parts.push({x:h.x+(Math.random()-.5)*h.w,y:h.y1-Math.random()*60,vx:(Math.random()-.5)*30,vy:-120-Math.random()*120,life:.6,max:.6,r:1.5+Math.random()*2,col:'rgba(255,190,80,.9)'});
      const hg=(h.y1-h.y0)*Math.min(1,c.k*4);if(Math.abs(fly.x-h.x)<h.w/2+fly.r*.4&&fly.y>h.y1-hg&&fly.y<h.y1+10)hitFly(t('hit_fire'));}
    else{const front=h.y0+(h.y1-h.y0)*Math.min(1,c.k*5);if(front>=h.y1-2&&Math.random()<.6)parts.push({x:h.x+(Math.random()-.5)*30,y:h.y1-4,vx:(Math.random()-.5)*140,vy:-80-Math.random()*90,life:.45,max:.45,r:2+Math.random()*2,col:'rgba(170,220,245,.9)'});
      if(Math.abs(fly.x-h.x)<h.w/2+fly.r*.5&&fly.y>h.y0&&fly.y<front)hitFly(t('hit_splash'));}}
  else h.fired=false;}
function updDrip(h,dt){h.t+=dt;const c=cyc(h);h.dy=null;
  if(c.ph==='act'){const ta=c.k*h.act,y=h.y0+8+.5*1500*ta*ta;if(y<h.yF){h.dy=y;h.splashed=false;}
    else if(!h.splashed){h.splashed=true;if(near(h.x))sfx.drip();for(let i=0;i<8;i++){const a=-Math.PI*(.1+.8*Math.random());parts.push({x:h.x,y:h.yF-4,vx:Math.cos(a)*120,vy:Math.sin(a)*140,life:.4,max:.4,r:2,col:'rgba(160,215,245,.9)'});}}}
  if(h.dy!==null&&hyp(fly.x-h.x,fly.y-h.dy)<8+fly.r*.6)hitFly(t('hit_drip'));}
function updSuck(h,dt){h.t+=dt;if(h.flash>0)h.flash-=dt;
  if(h.style==='robovac'){h.x+=h.dir*h.speed*dt;if(h.x>h.maxX){h.x=h.maxX;h.dir=-1;}if(h.x<h.minX){h.x=h.minX;h.dir=1;}}
  const cy=h.style==='robovac'?FLOOR-18:h.y;
  if(hyp(fly.x-h.x,fly.y-cy)<h.kill&&!fly.dead&&S.invuln<=0&&S.mode==='play'){if(h.style==='zapper'){h.flash=.33;sfx.zap();}hitFly(h.style==='zapper'?t('hit_zap'):t('hit_suck'));}}
function updThrower(h,dt){h.t+=dt*(h.spd||1);const hx=h.x+24,hy=h.y-100,d=hyp(fly.x-hx,fly.y-hy),alive=!fly.dead&&S.mode==='play';
  switch(h.state){
    case 'sleep':if(alive&&d<h.wake){h.state='wake';h.t=0;sfx.grunt();texts.push({x:h.x+10,y:h.y-70,s:t('hit_huh'),life:.9,col:'#f7f0dc'});}break;
    case 'wake':if(h.t>.5){h.state='aim';h.t=0;}break;
    case 'aim':if(h.t>.7){const tx=fly.x+fly.vx*.32,ty=fly.y+fly.vy*.32,ox=h.x+4,oy=h.y-140,dx=tx-ox,dy=ty-oy-30,l=hyp(dx,dy)||1;
        h.proj.push({x:ox,y:oy,vx:dx/l*580,vy:dy/l*580-60,a:0,life:1.8});sfx.whoosh();h.state='cool';h.t=0;}break;
    case 'cool':if(h.t>1.1){if(alive&&d<h.wake+170){h.state='aim';h.t=0;}else{h.state='sleep';h.t=0;}}break;
  }
  for(const p of h.proj){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=240*dt;p.a+=dt*14;p.life-=dt;if(hyp(fly.x-p.x,fly.y-p.y)<20)hitFly(t('hit_bonk'));}
  h.proj=h.proj.filter(p=>p.life>0&&p.y<FLOOR-6);}
function updBubbles(h,dt){h.t+=dt;if(h.t>h.rate){h.t=0;h.list.push({x:h.x+(Math.random()-.5)*h.spread,y:h.y,r:10+Math.random()*12,vy:-(36+Math.random()*30),ph:Math.random()*6,life:0});}
  for(const b of h.list){b.life+=dt;b.y+=b.vy*dt;b.x+=Math.sin(b.life*2+b.ph)*26*dt;
    if(!fly.dead&&S.invuln<=0&&S.mode==='play'&&hyp(fly.x-b.x,fly.y-b.y)<b.r+fly.r*.5){hitFly(t('hit_blop'));b.pop=true;}
    if(b.y<h.top)b.pop=true;
    if(b.pop){sfx.blop&&near(b.x)&&S.mode==='play'&&Math.random()<.3&&sfx.blop();for(let i=0;i<6;i++){const a=i/6*TAU;parts.push({x:b.x,y:b.y,vx:Math.cos(a)*70,vy:Math.sin(a)*70,life:.3,max:.3,r:1.6,col:'rgba(255,255,255,.9)'});}}}
  h.list=h.list.filter(b=>!b.pop);}
function updBall(h,dt){const s=h.spd||1;h.x+=h.vx*s*dt;if(h.x<h.minX){h.x=h.minX;h.vx=Math.abs(h.vx);}else if(h.x>h.maxX){h.x=h.maxX;h.vx=-Math.abs(h.vx);}
  h.vy+=1500*dt;h.y+=h.vy*dt;if(h.y>FLOOR-h.r){h.y=FLOOR-h.r;h.vy=-h.bounce;if(near(h.x)&&S.mode==='play'&&Math.random()<.5)sfx.blop();}
  h.a+=h.vx*s*dt/h.r;if(hyp(fly.x-h.x,fly.y-h.y)<h.r+fly.r*.6)hitFly(t('hit_goal'));}
function updateHazards(dt){
  for(const h of hazards){
    switch(h.type){
      case 'cat':updateCat(h,dt);break;
      case 'owner':updateOwner(h,dt);break;
      case 'spray':{const prev=cyc(h).ph;h.t+=dt;const st=cyc(h);
        if(st.ph==='act'){if(prev!=='act'&&near(h.x)&&S.mode==='play')sfx.hiss();
          for(let i=0;i<3;i++){const a=(h.kind==='fresh'?Math.PI/2:-Math.PI/2)+(Math.random()-.5)*1.2,v=120+Math.random()*160;
            parts.push({x:h.kind==='fresh'?h.x:h.x-6,y:h.kind==='fresh'?h.y+18:h.y-58,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.9,max:.9,r:8+Math.random()*10,col:h.kind==='fresh'?'rgba(214,170,240,.5)':'rgba(190,240,200,.5)',grow:1});}
          if(hyp(fly.x-h.cx,fly.y-h.cy)<h.R*Math.min(1,st.k*3))hitFly(t('hit_cough'));}break;}
      case 'fan':{h.a+=dt*9;const dy=fly.y-(h.y+4),dx=fly.x-h.x;
        if(Math.abs(dy)<12&&Math.abs(dx)<118){for(let k=0;k<4;k++){const ext=Math.cos(h.a+k*Math.PI/2)*112;if(Math.sign(ext)===Math.sign(dx)&&Math.abs(dx)<=Math.abs(ext)+6){hitFly(t('hit_fan'));break;}}}break;}
      case 'paper':{const sw=Math.sin(S.t*1.4+h.ph)*.05,bx=h.x+sw*(fly.y-48);if(fly.y<48+h.len+fly.r&&Math.abs(fly.x-bx)<8+fly.r)hitFly(t('hit_stuck'));break;}
      case 'spider':{h.t=(h.t+dt*(h.spd||1))%2.85;const st=h.t;h.y=st<1.2?90:st<1.55?90+380*((st-1.2)/.35)**2:st<1.95?470:470-380*((st-1.95)/.9);if(hyp(fly.x-h.x,fly.y-h.y)<16+fly.r)hitFly(t('hit_snap'));break;}
      case 'door':h.open=clamp(.42+.56*Math.sin(S.t*h.speed+h.phase),0,.95);break;
      case 'goal':updGoal(h,dt);break;
      case 'column':updColumn(h,dt);break;
      case 'drip':updDrip(h,dt);break;
      case 'suck':updSuck(h,dt);break;
      case 'thrower':updThrower(h,dt);break;
      case 'bubbles':updBubbles(h,dt);break;
      case 'ball':updBall(h,dt);break;
    }}}
function resetFoes(){for(const h of hazards){
  if(h.type==='cat'){h.x=h.hx;h.y=h.hy;h.state=h.sleep?'sleep':'idle';h.cd=1;h.vx=h.vy=0;}
  else if(h.type==='owner'){h.x=h.hx;h.state='idle';h.cd=1;}
  else if(h.type==='thrower'){h.state='sleep';h.proj=[];h.t=0;}
  else if(h.type==='bubbles')h.list=[];
  else if(h.type==='ball'){h.x=h.hx;h.y=h.hy;h.vy=0;}}}
function update(dt){
  S.t+=dt;S.time+=dt;if(S.invuln>0)S.invuln-=dt;if(S.shake>0)S.shake-=dt;
  if(fly.dead){fly.deadT-=dt;fly.spin+=dt*14;fly.vy+=600*dt;fly.y=Math.min(FLY_MAX_Y,fly.y+fly.vy*dt);
    if(fly.deadT<=0){if(S.lives<=0){gameOver();return;}placeFly(L.rooms[S.cp].cp);S.invuln=1.6;resetFoes();}}
  else{
    if(S.limit&&S.time>S.limit&&S.mode==='play'){S.limit+=20;const sh=S.shield;S.shield=0;S.invuln=0;hitFly(t('time_up'));S.shield=sh;toast(t('time_up'),t('time_up_s'));}
    const iv=inputVec();let slow=1;
    for(const h of hazards){if(h.type==='web'&&hyp(fly.x-h.x,fly.y-h.y)<h.R)slow=Math.min(slow,.38);
      else if(h.type==='strips'&&fly.x>h.x0-6&&fly.x<h.x1+6&&fly.y>h.y0&&fly.y<h.y1)slow=Math.min(slow,.5);}
    const maxV=310*slow*(S.speed?1.2:1);
    if(S.speed&&hyp(fly.vx,fly.vy)>200&&Math.random()<.5)parts.push({x:fly.x-fly.face*12,y:fly.y+(Math.random()-.5)*8,vx:-fly.vx*.15,vy:0,life:.25,max:.25,r:2,col:'#ffc93c'});
    fly.vx+=(iv.x*maxV-fly.vx)*Math.min(1,dt*6);fly.vy+=(iv.y*maxV-fly.vy)*Math.min(1,dt*6);
    for(const h of hazards){
      if(h.type==='fan'){if(Math.abs(fly.x-h.x)<135&&fly.y>h.y+15)fly.vy+=560*dt;}
      else if(h.type==='steam'){if(fly.x>h.x0&&fly.x<h.x1&&fly.y<h.y1&&fly.y>h.y0-80)fly.vy-=760*dt;}
      else if(h.type==='suck'&&S.invuln<=0){const cy=h.style==='robovac'?FLOOR-18:h.y,dx=h.x-fly.x,dy=cy-fly.y,d=hyp(dx,dy);
        if(d<h.R&&d>1){const s=h.pull*(1.25-d/h.R);fly.vx+=dx/d*s*dt;fly.vy+=dy/d*s*dt;}}}
    if(L.wind){const ph=S.t%L.wind.period,g=ph>L.wind.period-L.wind.dur;if(g){fly.vx-=L.wind.force*dt;if(!S.gust){S.gust=true;sfx.whoosh();}}else S.gust=false;}
    fly.x+=fly.vx*dt;fly.y+=fly.vy*dt;if(Math.abs(fly.vx)>15)fly.face=fly.vx>0?1:-1;
    const ceil=L.ceil(fly.x);if(fly.y<ceil+fly.r){fly.y=ceil+fly.r;fly.vy=Math.max(0,fly.vy);}
    if(fly.y>FLY_MAX_Y){fly.y=FLY_MAX_Y;fly.vy=Math.min(0,fly.vy);}
    if(fly.x<fly.r){fly.x=fly.r;fly.vx=0;}if(fly.x>L.worldW-fly.r)fly.x=L.worldW-fly.r;
    collide();
    for(const c of crumbs)if(!c.got&&hyp(fly.x-c.x,fly.y-c.y)<24){c.got=true;S.crumbs++;sfx.crumb();updateHud(true);
      texts.push({x:c.x,y:c.y-16,s:'+1',life:.6,col:'#ffc93c',small:1});
      for(let i=0;i<8;i++){const a=i/8*TAU;parts.push({x:c.x,y:c.y,vx:Math.cos(a)*90,vy:Math.sin(a)*90,life:.4,max:.4,r:2.5,col:'#ffc93c'});}}
    if(S.magnet)for(const c of crumbs){if(c.got)continue;const dx=fly.x-c.x,dy=fly.y-c.y,d=hyp(dx,dy);if(d<130&&d>1){const m=Math.min(d,280*dt);c.x+=dx/d*m;c.y+=dy/d*m;}}
    fly.trail.push(fly.x,fly.y);if(fly.trail.length>20)fly.trail.splice(0,2);
    const ri=roomAt(fly.x);if(ri>S.cp&&fly.x>L.rooms[ri].x0+10){S.cp=ri;toast(L.rooms[ri].name,L.rooms[ri].hint);}
    if(goalReached(hazards.find(h=>h.type==='goal'))){win();return;}
  }
  updateHazards(dt);stepFx(dt);
  if(AC&&buzzG){const sp=hyp(fly.vx,fly.vy);buzzO.frequency.setTargetAtTime(170+sp*.25+Math.sin(S.t*30)*6,AC.currentTime,.05);buzzG.gain.setTargetAtTime(muted||fly.dead?0:.018+sp/310*.03,AC.currentTime,.08);}
  updateHud();
}
function stepFx(dt){for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;if(p.grow)p.r+=dt*14;}
  parts=parts.filter(p=>p.life>0);for(const t of texts){t.life-=dt;t.y-=30*dt;}texts=texts.filter(t=>t.life>0);}

// ---------- drawing: hazards ----------
function warn(x,y){warnQ.push(x,y);}
function bubbleMark(x,y){rr(x-13,y-30,26,30,9);fillE('#ff6a4d');ctx.beginPath();ctx.moveTo(x-5,y-1);ctx.lineTo(x,y+8);ctx.lineTo(x+5,y-1);ctx.fill();
  txt('!',x,y-14,'400 20px '+DFONT,'#fff');}
function drawFan(h){
  line([h.x,40,h.x,h.y-8],'#6b6f73',6);rr(h.x-22,h.y-14,44,24,10);fillE('#4a4f54');
  const bl=[];for(let k=0;k<4;k++){const a=h.a+k*Math.PI/2;bl.push({e:Math.cos(a)*112,z:Math.sin(a)});}bl.sort((a,b)=>a.z-b.z);
  for(const b of bl){ctx.fillStyle=b.z<0?'#7a5636':'#a0703f';ctx.beginPath();ctx.moveTo(h.x,h.y);ctx.lineTo(h.x+b.e,h.y+b.z*3-3);ctx.lineTo(h.x+b.e,h.y+b.z*3+5);ctx.lineTo(h.x,h.y+7);ctx.fill();}
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;for(let i=0;i<5;i++){const x=h.x-100+i*50,y=200+((S.t*160+i*57)%260);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+26);ctx.stroke();ctx.beginPath();ctx.moveTo(x-5,y+18);ctx.lineTo(x,y+26);ctx.lineTo(x+5,y+18);ctx.stroke();}
}
function drawPaper(h){const sw=Math.sin(S.t*1.4+h.ph)*.05;ctx.save();ctx.translate(h.x,48);ctx.rotate(-sw);
  rr(-9,-2,18,14,3);fillE('#c4453a');ctx.fillStyle='#e8a92a';ctx.beginPath();ctx.moveTo(-8,12);ctx.lineTo(8,12);ctx.lineTo(7,h.len);ctx.lineTo(-7,h.len);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(-6,14,3,h.len-18);
  ctx.fillStyle='#2a2a2a';for(let y=40;y<h.len-10;y+=53){circ(-2+((y*7)%9)-4,y,2.6);ctx.fill();}ctx.restore();}
function drawSteam(h){const w=(h.x1-h.x0)/2;for(let i=0;i<6;i++){const k=((S.t*.6+i/6)%1),y=h.base-k*240,x=h.x+Math.sin(S.t*2+i*1.7)*w*.3;ctx.fillStyle=`rgba(255,255,255,${.5*(1-k)})`;circ(x,y,12+k*18*(w/55));ctx.fill();}
  ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=2;for(let i=0;i<3;i++){const x=h.x-w*.55+i*w*.55,y=h.base-20-((S.t*140+i*70)%200);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-22);ctx.stroke();ctx.beginPath();ctx.moveTo(x-5,y-14);ctx.lineTo(x,y-22);ctx.lineTo(x+5,y-14);ctx.stroke();}}
function drawSpray(h){const st=cyc(h);
  if(h.kind==='bottle'){const j=st.ph==='warn'?Math.sin(S.t*60)*2:0;ctx.save();ctx.translate(h.x+j,h.y);
    rr(-16,-44,32,44,8);fillE('#6fc7d8');ctx.fillStyle='#f7f0dc';ctx.fillRect(-12,-32,24,14);txt(t('s_poison'),0,-25,'800 8px Rubik, system-ui, sans-serif','#c4453a','center',23);
    rr(-8,-58,16,16,3);fillE('#2f3a3f');rr(-18,-58,12,6,2);fillE('#2f3a3f');ctx.restore();}
  if(st.ph==='warn'){ctx.fillStyle=`rgba(255,106,77,${.22+.22*Math.sin(S.t*30)})`;circ(h.cx,h.cy,h.R);ctx.fill();warn(h.x,h.kind==='fresh'?h.y-30:h.y-80);}
  if(st.ph==='act'){ctx.fillStyle=h.kind==='fresh'?'rgba(214,170,240,.28)':'rgba(190,240,200,.3)';circ(h.cx,h.cy,h.R*Math.min(1,st.k*3));ctx.fill();}}
function drawWeb(h){ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=1.5;
  for(let k=0;k<=6;k++){const a=k/6*Math.PI/2;ctx.beginPath();ctx.moveTo(h.x,h.y);ctx.lineTo(h.x+Math.cos(a)*h.R,h.y+Math.sin(a)*h.R);ctx.stroke();}
  for(let r=22;r<h.R;r+=20){ctx.beginPath();for(let k=0;k<=6;k++){const a=k/6*Math.PI/2,r2=r+(k%2)*4,x=h.x+Math.cos(a)*r2,y=h.y+Math.sin(a)*r2;k?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();}}
function drawSpider(h){const y=h.y;line([h.x,48,h.x,y],'rgba(255,255,255,.8)',1.5);
  ctx.strokeStyle='#1d1d1d';ctx.lineWidth=2.5;for(let s=-1;s<=1;s+=2)for(let k=0;k<4;k++){const a=-.9+k*.55;ctx.beginPath();ctx.moveTo(h.x,y);ctx.lineTo(h.x+s*Math.cos(a)*14,y+Math.sin(a)*14-4);ctx.lineTo(h.x+s*Math.cos(a)*22,y+Math.sin(a)*14+8);ctx.stroke();}
  circ(h.x,y-6,9);fillE('#1d1d1d');circ(h.x,y+8,12);fillE('#2a2a2a');circ(h.x,y+8,4);fillE('#c4453a');circ(h.x-3,y-8,2);fillE('#ff6a4d');circ(h.x+3,y-8,2);fillE('#ff6a4d');
  if(h.t>.9&&h.t<1.2)warn(h.x+28,y-10);}
function drawStrips(h){const n=Math.round((h.x1-h.x0)/7);for(let i=0;i<n;i++){const x=h.x0+3+i*7,dx=fly.x-x;let bend=0;
  if(!fly.dead&&Math.abs(dx)<40&&fly.y>h.y0&&fly.y<h.y1)bend=-Math.sign(dx)*(40-Math.abs(dx))*.6;const sw=Math.sin(S.t*1.6+i)*3;
  ctx.strokeStyle=h.cols[i%h.cols.length];ctx.lineWidth=5;ctx.lineCap='butt';ctx.beginPath();ctx.moveTo(x,h.y0);ctx.quadraticCurveTo(x+sw+bend*.4,(h.y0+h.y1)/2,x+sw+bend,h.y1-6);ctx.stroke();}}
function catHead(x,y,r,col,dark,eyes){
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x-r*.85,y-r*.4);ctx.lineTo(x-r*.7,y-r*1.45);ctx.lineTo(x-r*.05,y-r*.85);ctx.fill();
  ctx.beginPath();ctx.moveTo(x+r*.85,y-r*.4);ctx.lineTo(x+r*.75,y-r*1.45);ctx.lineTo(x+r*.05,y-r*.85);ctx.fill();
  ctx.fillStyle='#f2a7a0';ctx.beginPath();ctx.moveTo(x+r*.6,y-r*.65);ctx.lineTo(x+r*.68,y-r*1.15);ctx.lineTo(x+r*.25,y-r*.85);ctx.fill();

function drawDarkness(){

      g.addColorStop(0,`rgba(0,0,0,${l.a})`);g.addColorStop(1,`rgba(0,0,0,${l.a*.3})`);sctx.fillStyle=g;sctx.beginPath();sctx.moveTo(x-w1,y0);sctx.lineTo(x+w1,y0);sctx.lineTo(x+w2+sk,y1);sctx.lineTo(x-w2+sk,y1);sctx.fill();continue;}

    sctx.fillStyle=g;sctx.fillRect(x-r,y-r,2*r,2*r);}
  ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(shadeCv,0,0);ctx.globalCompositeOperation='lighter';
  for(const l of lights){if(!l.col)continue;
    if(l.beam){const x=X(l.x);if(x<-400||x>Wd+400)continue;const y0=Y(l.y0||48),y1=Y(FLOOR),w1=l.w1*k,w2=l.w2*k,sk=(l.skew||0)*k,g=ctx.createLinearGradient(0,y0,0,y1);
      g.addColorStop(0,`rgba(${l.col},${l.glow})`);g.addColorStop(1,`rgba(${l.col},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x-w1,y0);ctx.lineTo(x+w1,y0);ctx.lineTo(x+w2+sk,y1);ctx.lineTo(x-w2+sk,y1);ctx.fill();continue;}

  ctx.restore();}
function initAmb(){amb=[];const haze=L.ambient==='haze',n=haze?10:34;

// ---------- render ----------
const hzX=h=>h.x!==undefined?h.x:h.x0;
function drawWorld(x0,x1){
  const vis=(a,b)=>b>x0&&a<x1;
  for(const r of L.rooms)if(vis(r.x0-40,r.x1+40))r.draw(r);
  L.walls();
  if(L.lamps)for(const x of L.lamps)if(vis(x-40,x+40))drawLamp(x);
  for(const h of hazards)if((h.type==='web'||h.type==='steam')&&vis(hzX(h)-320,hzX(h)+320))drawHazard(h);
  for(const h of hazards){if(h.type==='web'||h.type==='steam'||h.type==='cat'||h.type==='strips')continue;if(h.type==='thrower'||vis(hzX(h)-320,hzX(h)+320))drawHazard(h);}
  for(const c of crumbs)if(!c.got&&vis(c.x-20,c.x+20))drawCrumb(c);
  for(const h of hazards)if(h.type==='cat'&&vis(h.x-200,h.x+200))drawCat(h);
  for(const h of hazards)if(h.type==='strips'&&vis(h.x0-50,h.x1+50))drawStrips(h);
}
function render(){

  const wt=[dpr*scale,0,0,dpr*scale,(-S.camX+sx)*dpr*scale,(offY+sy*scale)*dpr];
  ctx.setTransform(...wt);warnQ.length=0;
  drawWorld(S.camX-50,S.camX+viewW+50);

  drawDarkness();ctx.setTransform(...wt);

  if(L.wind&&S.mode==='play'){const W2=L.wind,ph=S.t%W2.period,gust=ph>W2.period-W2.dur,pre=!gust&&ph>W2.period-W2.dur-1;
    if(gust||pre){ctx.strokeStyle=`rgba(255,255,255,${gust?.45:.18})`;ctx.lineWidth=2;for(let i=0;i<16;i++){const yy=80+((i*67)%420),xx=S.camX+viewW-((S.t*(gust?1300:300)+i*157)%(viewW+200));ctx.beginPath();ctx.moveTo(xx,yy);ctx.lineTo(xx+(gust?90:40),yy);ctx.stroke();}}
    if(pre&&!fly.dead)warnQ.push(fly.x,fly.y-30);}
  if(S.mode!=='win')drawFly();
  for(let i=0;i<warnQ.length;i+=2)bubbleMark(warnQ[i],warnQ[i+1]);
  for(const t of texts){ctx.globalAlpha=Math.min(1,t.life*2);ctx.font=`400 ${t.small?16:24}px ${DFONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineWidth=6;ctx.strokeStyle='#122429';ctx.strokeText(t.s,t.x,t.y);ctx.fillStyle=t.col;ctx.fillText(t.s,t.x,t.y);}ctx.globalAlpha=1;

    circ(joy.ox-r.left,joy.oy-r.top,58);ctx.strokeStyle='rgba(247,240,220,.45)';ctx.lineWidth=3;ctx.stroke();circ(joy.x-r.left,joy.y-r.top,24);fillE('rgba(255,201,60,.6)');}
}
function renderThumb(lv,c){

    <p class="note" style="text-align:center">${t('collected',{n:r.base})}${r.stars?' · '+t('new_stars',{n:r.stars}):''}${r.first?' · '+t('first_clear',{n:25}):''} · ${t('bank',{n:WAL.sugar})}</p>
    ${offer}
    <div class="results"><div><b>${fmt(S.time)}</b><small>${d.rec?t('new_rec'):t('time')}</small></div><div><b>${S.crumbs}/${crumbs.length}</b><small>${t('sugar')}</small></div><div><b>${S.lives}/3</b><small>${t('lives')}</small></div></div>
    ${nextOk?`<p>${t('next_stop',{name:LEVELS[S.li+1].name,time:SG_LANG==='de'?LEVELS[S.li+1].time:LEVELS[S.li+1].time.toLocaleLowerCase(SG_LANG)})}</p>`:`<p>${t('all_done',{n:LEVELS.length})}</p>`}
    <div class="row">${nextOk?'<button class="btn" id="nextBtn">'+t('next_lvl')+'</button>':''}<button class="btn${nextOk?' ghost':''}" id="againBtn">${t('fly_again')}</button><button class="btn ghost" id="mapBtn">${t('map')}</button></div>`);
  if(nextOk)$('nextBtn').onclick=()=>{const nx=S.li+1;if(window.AdKit)AdKit.levelDone({reward:t('plus_sugar',{n:20}),title:t('lvl_bonus')}).then(ok=>{if(ok){WAL.sugar+=20;saveW();}showPrep(nx);});else showPrep(nx);};$('againBtn').onclick=()=>startLevel(S.li);$('mapBtn').onclick=showMap;
  const o=$('of_double');if(o)o.onclick=()=>{o.disabled=true;runAd('double',t('plus_sugar',{n:r.total}),()=>{WAL.sugar+=r.total;d.doubled=true;},()=>renderWin(false));};
  if(firstShow)d.earned.forEach((on,k)=>{if(on)setTimeout(()=>sfx.star(k),k*280);});}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.mode==='play')togglePause();});

// ---------- loop ----------
let last=performance.now();
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;
  if(S.mode==='play')update(dt);
  else if(S.mode!=='paused'){S.t+=dt;updateHazards(dt);stepFx(dt);if(S.mode==='win')for(const p of parts)p.vy+=300*dt;}
  render();requestAnimationFrame(loop);}
window.__vizz={S,fly,LEVELS,startLevel,showMap,WAL,get hazards(){return hazards;},get crumbs(){return crumbs;}};
resize();loadLevel(0);showMap();requestAnimationFrame(loop);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(S.mode==='map')showMap();});
})();
</script>

</body></html>
