,"en":"In winter we gather around the fire, in summer under the trees. We want lots of trees, lights for the evenings and a spot where everyone can sit. Dad adores maples.","es":"En invierno nos reunimos junto al fuego y en verano bajo los árboles. Queremos muchos árboles, luz para las noches y un rincón donde todos puedan sentarse. A papá le encantan los arces.","pt":"No inverno nos reunimos em volta do fogo, no verão debaixo das árvores. Queremos muitas árvores, luz para a noite e um cantinho onde todos possam sentar. Meu pai adora bordos.","de":"Im Winter sitzen wir am Feuer, im Sommer unter den Bäumen. Wir wünschen uns viele Bäume, Licht für den Abend und eine Ecke, in der alle Platz finden. Papa liebt Ahorn.","fr":"L'hiver, on se réunit autour du feu, l'été sous les arbres. On veut beaucoup d'arbres, de la lumière pour le soir et un coin où tout le monde peut s'asseoir. Papa adore les érables.","id":"Saat musim dingin kami berkumpul di dekat api, saat musim panas di bawah pohon. Kami ingin banyak pohon, lampu untuk malam hari, dan sudut tempat semua orang bisa duduk. Ayah sangat suka pohon maple.","ru":"Зимой мы собираемся у огня, летом — под деревьями. Хотим много деревьев, свет по вечерам и уголок, где поместятся все. Папа обожает клёны."},"r4_connect":{"tr":"Kapıdan avlu kapısına yol","en":"Path from door to yard gate","es":"Camino de la puerta al portón","pt":"Caminho da porta ao portão do quintal","de":"Weg von der Tür zum Hoftor","fr":"Allée de la porte au portail de la cour","id":"Jalan dari pintu ke gerbang halaman","ru":"Дорожка от двери до ворот"},"r4_grass":{"tr":"%45 çim","en":"45% grass","es":"45% de césped","pt":"45% de grama","de":"45 % Rasen","fr":"45 % de gazon","id":"45% rumput","ru":"45% газона"},"r4_trees":{"tr":"6 ağaç","en":"6 trees","es":"6 árboles","pt":"6 árvores","de":"6 Bäume","fr":"6 arbres","id":"6 pohon","ru":"6 деревьев"},"r4_life":{"tr":"Ateş çukuru ya da çardak","en":"Fire pit or pergola","es":"Fogata o pérgola","pt":"Fogueira o <style>
/* Layout: full-bleed 3D yard; HUD strip on top, tool tray pinned to the bottom, client wish card on the left */
:root{
  --moss:#15281e; --moss2:#21392c; --panel:rgba(17,33,25,.88); --line:rgba(214,232,196,.14);

}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--moss);color:var(--paper);font-family:var(--f-body);font-size:14px;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0}
#c{display:block;width:100%;height:100%;touch-action:none;outline:none}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.pn{background:var(--panel);border:1px solid var(--line);border-radius:14px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

#hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;display:flex;gap:8px;align-items:stretch;pointer-events:none}
#hud>*{pointer-events:auto}
.hb{padding:7px 12px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.lvl b{font-family:var(--f-disp);font-weight:400;font-size:17px;line-height:1.2;white-space:nowrap}
.lvl span{font-size:12px;color:var(--mute);white-space:nowrap}
.budget{flex:1 1 auto;max-width:330px}
.bt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.bt b{font-size:17px;letter-spacing:0;text-transform:none;color:var(--paper);font-variant-numeric:tabular-nums;font-weight:600}
.bar{position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.1);margin-top:5px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--leaf);border-radius:3px;transition:width .25s,background .25s}
.bar i.low{background:var(--clay)}
.sat{width:118px}
.sat .bar{overflow:visible}
.sat .bar::after{content:"";position:absolute;left:70%;top:-3px;bottom:-3px;width:2px;background:var(--paper);opacity:.55}

.sp{flex:1}

.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib:disabled{opacity:.35;cursor:default}
#bWish{display:none;width:auto;padding:0 12px;gap:6px;grid-auto-flow:column;font-size:13px;font-variant-numeric:tabular-nums}

#wish{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 74px);width:282px;max-height:calc(100% - 340px);overflow:auto;padding:14px 16px}

.rq{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:start;font-size:13.5px;line-height:1.35;padding:7px 0;border-top:1px solid var(--line)}
.ck{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--mute);margin-top:1px;display:grid;place-items:center}
.ck svg{width:10px;height:10px;stroke:var(--moss);stroke-width:3;fill:none;opacity:0}
.rq.ok .ck{background:var(--leaf);border-color:var(--leaf)}
.rq.ok .ck svg{opacity:1}
.rq.ok .t{color:var(--mute)}
.rq .v{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.loves{font-size:12px;color:var(--mute);margin-top:10px;padding-top:9px;border-top:1px solid var(--line);line-height:1.45}

#dock{position:absolute;left:0;right:0;bottom:0;padding:0 12px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;flex-direction:column;gap:8px;pointer-events:none}

#ctx .tx b{color:var(--paper);font-weight:600}
.cb{background:var(--moss2);border:1px solid var(--line);border-radius:9px;padding:6px 11px;min-height:34px;font-size:13px;cursor:pointer;white-space:nowrap}
.cb.warn{color:#ffb3a1;border-color:rgba(227,105,75,.45)}
#present{background:var(--sun);color:#2a1c04;font-weight:600;border:0;border-radius:14px;padding:0 18px;min-height:46px;font-size:15px;cursor:pointer;white-space:nowrap;box-shadow:0 6px 18px rgba(243,178,58,.25)}
#tray{padding:6px 8px 8px}

#tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:var(--mute);padding:6px 11px;border-radius:8px;font-size:13px;white-space:nowrap;cursor:pointer}
.tab.on{background:var(--moss2);color:var(--paper)}
#pal{display:flex;gap:8px;overflow-x:auto;padding-top:6px;touch-action:pan-x;scrollbar-width:thin;scrollbar-color:var(--moss2) transparent}
.pc{flex:0 0 86px;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:12px;padding:5px 5px 7px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:grab;touch-action:pan-x;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;position:relative}
.pc img,.pc .ico{width:58px;height:58px;pointer-events:none;-webkit-user-drag:none;border-radius:8px}
.pc .ico{display:grid;place-items:center;background:var(--moss2)}
.pc .ico svg{width:28px;height:28px;stroke:var(--paper);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pc .n{font-size:12px;line-height:1.15;text-align:center;min-height:2.3em;display:flex;align-items:center}
.pc .p{font-size:12px;color:var(--sun);font-variant-numeric:tabular-nums;font-weight:500}
.pc.on{border-color:var(--sun);background:rgba(243,178,58,.13)}
.pc.poor{opacity:.42}
.pc .bd{position:absolute;top:4px;left:4px;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:1px 5px;border-radius:5px;background:var(--leaf);color:var(--moss);font-weight:600}
.pc .bd.lv{background:var(--sun)}

#toast{position:absolute;top:calc(env(safe-area-inset-top,0px) + 72px);left:50%;transform:translateX(-50%);padding:9px 14px;font-size:13.5px;max-width:calc(100% - 32px);text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;z-index:15}
#toast.on{opacity:1}
#toast.bad{border-color:rgba(227,105,75,.5)}
#cine{position:absolute;top:calc(env(safe-area-inset-top,0px) + 22px);left:50%;transform:translateX(-50%);padding:10px 18px;font-family:var(--f-disp);font-size:18px;white-space:nowrap}
body.presenting #hud,body.presenting #dock,body.presenting #wish{display:none}

#modal{position:absolute;inset:0;background:rgba(8,16,12,.58);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;justify-content:center;align-items:flex-start;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow:auto;z-index:20}
.card{width:100%;max-width:580px;margin:auto 0;background:var(--moss);border:1px solid var(--line);border-radius:18px;padding:26px 24px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--leaf);font-weight:500}
.card h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(36px,9vw,52px);line-height:1;margin:8px 0 10px;text-wrap:balance}
.card h2{font-family:var(--f-disp);font-weight:400;font-size:26px;line-height:1.15;margin:6px 0 4px;text-wrap:balance}
.card p{line-height:1.55;margin:0 0 12px;max-width:62ch}
.mut{color:var(--mute)}

.lv{display:grid;gap:8px;margin:18px 0}
.lrow{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;text-align:left;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer}
.lrow:disabled{cursor:default;opacity:.45}
.lrow .no{font-family:var(--f-disp);font-size:22px;color:var(--sun)}
.lrow .nm{font-weight:600}
.lrow .sub{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.stars{display:flex;gap:2px}
.st{width:16px;height:16px;fill:none;stroke:var(--sun);stroke-width:1.6}
.st.on{fill:var(--sun)}
.big .st{width:34px;height:34px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.btn{border:1px solid var(--line);background:var(--moss2);border-radius:12px;padding:12px 18px;cursor:pointer;font-weight:500;min-height:46px}
.btn.pri{background:var(--sun);color:#2a1c04;border-color:var(--sun);font-weight:600}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:16px 0}
.fact{border-top:1px solid var(--line);padding-top:8px}
.fact span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.fact b{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.ul{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.ul li{display:flex;gap:10px;line-height:1.4}
.ul li::before{content:"";flex:0 0 6px;height:6px;border-radius:50%;background:var(--leaf);margin-top:7px}
.newi{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.newi div{display:flex;flex-direction:column;align-items:center;width:74px;font-size:11.5px;text-align:center;gap:2px}
.newi img{width:56px;height:56px;border-radius:8px;background:var(--moss2)}
.score{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:8px 0 6px}
.score .pct{font-family:var(--f-disp);font-size:68px;line-height:.9}
.brk{display:grid;gap:9px;margin:14px 0}
.brk div{display:grid;grid-template-columns:96px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.brk em{font-style:normal;text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
.ledger{border-top:1px solid var(--line);margin-top:6px}
.ledger div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.ledger div.tot{font-weight:600;color:var(--sun);border-bottom:0}
.small{font-size:12.5px}
.conf{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:25}
.conf i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

@media (max-width:760px){
  .lvl{display:none}
  #bWish{display:grid}
  #wish{display:none;left:12px;right:12px;width:auto;max-height:calc(100% - 320px)}
  #wish.open{display:block}
  .sat{width:96px}
  .hb{padding:6px 10px}
  .bt b{font-size:15px}
  #present{padding:0 14px;font-size:14px}
}
@media (max-width:440px){
  .sat{display:none}
  #hud{gap:6px}
  .ib{width:42px}
}
@media (prefers-reduced-motion:reduce){.conf{display:none}}

function fenceSeg(g,s,type,color){const [x1,z1,x2,z2]=s,len=Math.hypot(x2-x1,z2-z1);if(len<.05)return;

 if(type==='wall'){add(sg,box(len,.75,.3),m,0,.375,0);add(sg,box(len+.04,.08,.38),M('#c9bfae'),0,.79,0);return;}
 const rail=type==='iron'?[.25,1.0]:[.32,.7];rail.forEach(y=>add(sg,box(len,.05,.05),m,0,y,0));
 const step=type==='iron'?.2:.26,n=Math.max(1,Math.round(len/step));
 for(let i=0;i<=n;i++){const x=-len/2+i*len/n;if(type==='iron')add(sg,geo('ib',()=>box(.025,1.1,.025)),m,x,.55,0);else add(sg,geo('pk',()=>box(.1,.88,.035)),m,x,.44,.03);}
 const pn=Math.max(1,Math.round(len/2));for(let i=0;i<=pn;i++)add(sg,geo('fp'+type,()=>box(.1,type==='iron'?1.15:.95,.1)),m,-len/2+i*len/pn,type==='iron'?.575:.475,0);}

 const vs=surfMats[s],h=SURF[s].h,hash=(i*2654435761)>>>0;const m=new THREE.Mesh(tileGeo,vs[hash%vs.length]);m.scale.set(1,h,1);
 const c=i%W,r=(i/W)|0;m.position.set(cellX(c),h/2,cellZ(r));m.rotation.y=(hash>>4)%4*Math.PI/2;m.receiveShadow=true;surfRoot.add(m);surfMeshes[i]=m;}
function buildItem(id,seed){const it=ITEM[id];const inner=it.build(mulberry(seed*7919+13));inner.userData.anim=it.anim||null;return inner;}
function footY(o){const it=ITEM[o.id],[fw,fd]=fp(it,o.rot);let y=0;for(let r=o.r;r<o.r+fd;r++)for(let c=o.c;c<o.c+fw;c++)y=Math.max(y,SURF[surf[r*W+c]].h);return y;}
function placeRoot(root,o,c,r){const it=ITEM[o.id],[fw,fd]=fp(it,o.rot);c=c??o.c;r=r??o.r;root.position.set(c+fw/2-W/2,0,r+fd/2-D/2);root.rotation.y=-o.rot*Math.PI/2;}

 if(it.glow){const sp=new THREE.Sprite(glowMats[it.glow.k]);sp.position.set(0,it.glow.y,0);sp.scale.setScalar(it.glow.s);sp.raycast=()=>{};inner.add(sp);}
 root.userData={uid:o.uid,inner,ph:(o.uid*1.37)%6.28,pop:pop?0:1};placeRoot(root,o);root.position.y=footY(o);objRoot.add(root);objMap.set(o.uid,root);return root;}

const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),gPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0);ray.camera=camera;
function setRay(cx,cy){const b=canvas.getBoundingClientRect();ndc.set((cx-b.left)/b.width*2-1,-(cy-b.top)/b.height*2+1);ray.setFromCamera(ndc,camera);}

function anchorFor(it,rot,p){const [fw,fd]=fp(it,rot);return [Math.round(p.x+W/2-fw/2),Math.round(p.z+D/2-fd/2)];}

 const p=groundAt(cx,cy);if(p){const ce=cellAt(p);if(ce&&occ[ce[1]*W+ce[0]])return occ[ce[1]*W+ce[0]];}return null;}

function snapshot(){return {surf:Array.from(surf),objs:objs.map(o=>Object.assign({},o)),uid:uidSeq};}
function pushUndo(){undoStack.push(snapshot());if(undoStack.length>60)undoStack.shift();$('#bUndo').disabled=false;}
function undo(){const s=undoStack.pop();if(!s)return;surf=Uint8Array.from(s.surf);objs=s.objs;uidSeq=s.uid;selected=null;rebuildAll();afterChange();toast(T('toast_undone'));}

function tryPlace(id,cx,cy,rot){const it=ITEM[id],p=groundAt(cx,cy);if(!p)return false;const [c,r]=anchorFor(it,rot,p);
 const err=canPlace(it,c,r,rot,0);if(err){toast(err,true);sfx(180,.12,'triangle');return false;}
 if(it.cost>remaining()){toast(T('toast_need',{need:fmt(it.cost),left:fmt(remaining())}),true);sfx(180,.12,'triangle');budgetOffer();return false;}
 pushUndo();const o={uid:uidSeq++,id,c,r,rot};objs.push(o);computeOcc();addObjMesh(o,true);afterChange();sfx(520,.09);return true;}
function removeObj(uid,silent){const i=objs.findIndex(o=>o.uid===uid);if(i<0)return;const o=objs[i];objs.splice(i,1);removeObjMesh(uid);computeOcc();if(selected===uid)selected=null;if(!silent)toast(T('toast_removed',{name:ITEM[o.id].name,x:fmt(ITEM[o.id].cost)}));}

 if(canPlace(it,o.c,o.r,nr,o.uid)){toast(T('toast_no_rot'),true);return;}pushUndo();o.rot=nr;const root=objMap.get(o.uid);placeRoot(root,o);root.position.y=footY(o);afterChange();showSel();}
let paintMsgT=0;
function paintCell(c,r){const i=r*W+c,t=tool.s;
 if(t==='erase'){if(occ[i]){removeObj(occ[i],true);return true;}if(surf[i]){surf[i]=0;setSurfMesh(i);return true;}return false;}
 if(occ[i]){if(Date.now()-paintMsgT>1500){toast(T('toast_remove_first'),true);paintMsgT=Date.now();}return false;}
 if(surf[i]===t)return false;const delta=SURF[t].cost-SURF[surf[i]].cost;
 if(delta>remaining()){if(Date.now()-paintMsgT>1500){toast(T('toast_budget_over'),true);paintMsgT=Date.now();budgetOffer();}return false;}
 surf[i]=t;setSurfMesh(i);return true;}
let lastPaint=null;
function paintAt(cx,cy){const p=groundAt(cx,cy);if(!p)return;const ce=cellAt(p);if(!ce)return;
 const cells=[];if(lastPaint){let [x0,y0]=lastPaint;const [x1,y1]=ce;const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;
  for(let k=0;k<200;k++){cells.push([x0,y0]);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}}else cells.push(ce);
 let ch=false;cells.forEach(([c,r])=>{if(paintCell(c,r))ch=true;});lastPaint=ce;setHL(ce[0],ce[1],1,1,true);

function moveTo(cx,cy){if(!moving)return;const p=groundAt(cx,cy);if(!p)return;const o=moving.o,it=ITEM[o.id],[c,r]=anchorFor(it,o.rot,p);

/* ================= EVALUATION ================= */
function connected(){const st=L.door,en=(D-1)*W+L.gate;const ok=i=>SURF[surf[i]].walk&&!occ[i];if(!ok(st)||!ok(en))return false;
 const seen=new Uint8Array(W*D),q=[st];seen[st]=1;while(q.length){const i=q.shift();if(i===en)return true;const c=i%W,r=(i/W)|0;
  [[c+1,r],[c-1,r],[c,r+1],[c,r-1]].forEach(([x,y])=>{if(x<0||y<0||x>=W||y>=D)return;const j=y*W+x;if(!seen[j]&&ok(j)){seen[j]=1;q.push(j);}});}return false;}
function symmetry(){if(!objs.length)return 0;let m=0;for(const o of objs){const [fw]=fp(ITEM[o.id],o.rot),mc=W-o.c-fw;if(mc===o.c||objs.some(p=>p!==o&&p.id===o.id&&p.r===o.r&&p.c===mc))m++;}return m/objs.length;}
function evaluate(){const cnt={},cat={},ids=new Set();let beauty=0;
 for(const o of objs){const it=ITEM[o.id];cnt[o.id]=(cnt[o.id]||0)+1;cat[it.cat]=(cat[it.cat]||0)+1;ids.add(o.id);beauty+=it.beauty*(L.loves.includes(o.id)?1.5:1);}
 const sc=[0,0,0,0,0];for(let i=0;i<surf.length;i++)sc[surf[i]]++;sc.forEach((n,i)=>{if(i&&n){beauty+=n*SURF[i].beauty;ids.add('s'+i);}});
 const reqs=L.reqs.map(q=>{let v=0,t=1,txt='';
  if(q.t==='connect'){v=connected()?1:0;txt=v?T('ok'):T('missing');}
  else if(q.t==='surf'){v=sc[q.s]/(W*D);t=q.pct;txt=T('pct',{n:Math.round(v*100)})+' / '+T('pct',{n:Math.round(t*100)});}
  else if(q.t==='surfN'){v=sc[q.s];t=q.n;txt=v+' / '+t+' '+T('m2');}
  else if(q.t==='cat'){v=cat[q.cat]||0;t=q.n;txt=v+' / '+t;}
  else if(q.t==='item'){v=q.ids.reduce((a,id)=>a+(cnt[id]||0),0);t=q.n;txt=v+' / '+t;}
  else if(q.t==='variety'){v=ids.size;t=q.n;txt=v+' / '+t;}
  else if(q.t==='sym'){v=symmetry();t=q.pct;txt=T('pct',{n:Math.round(v*100)});}
  const p=Math.min(1,t?v/t:0);return {label:q.label,p,done:p>=1,txt};});
 const req=reqs.reduce((a,r)=>a+r.p,0)/reqs.length,bS=Math.min(1,beauty/L.beautyTarget),vS=Math.min(1,ids.size/L.variety);
 const sat=Math.round(100*(.55*req+.3*bS+.15*vS));const stars=sat>=95?3:sat>=85?2:sat>=70?1:0;
 return {reqs,req,beauty,bS,variety:ids.size,vS,sat,stars};}

let ac=null;function sfx(f,d,type,v){if(!progress.sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.5,t+d);g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02);}catch(e){}}

const cam={theta:.45,phi:.9,r:20,tTheta:.45,tPhi:.9,tR:20,target:new THREE.Vector3()};
function orbit(dx,dy){cam.tTheta-=dx*.0065;cam.tPhi=clamp(cam.tPhi-dy*.005,.28,1.38);}
const ptrs=new Map();let mode=null,md=null,gest=null;
function gInfo(){const a=[...ptrs.values()];return {mx:(a[0].x+a[1].x)/2,my:(a[0].y+a[1].y)/2,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};}
function endSingle(){if(mode==='move')cancelMove();if(mode==='paint'){lastPaint=null;afterChange();}md=null;}
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('pointerdown',e=>{if(presenting||modalOpen)return;canvas.focus({preventScroll:true});try{canvas.setPointerCapture(e.pointerId);}catch(_){}
 ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===2){endSingle();mode='gesture';gest=gInfo();hideGhost();return;}if(ptrs.size>2)return;
 md={sx:e.clientX,sy:e.clientY,moved:false};
 if(e.button===2||e.button===1){mode='orbit';return;}
 if(tool&&tool.kind==='paint'){pushUndo();mode='paint';lastPaint=null;paintAt(e.clientX,e.clientY);return;}
 if(tool&&tool.kind==='obj'){mode='placePending';return;}
 const uid=pickAt(e.clientX,e.clientY);if(uid){mode='objPending';md.uid=uid;}else mode='orbitPending';});
canvas.addEventListener('pointermove',e=>{if(pdrag)return;const p=ptrs.get(e.pointerId);
 if(!p){if(e.pointerType==='mouse'&&!presenting&&!modalOpen){if(tool&&tool.kind==='obj')hoverGhost(e.clientX,e.clientY);else if(tool&&tool.kind==='paint'){const q=groundAt(e.clientX,e.clientY),ce=q&&cellAt(q);if(ce)setHL(ce[0],ce[1],1,1,tool.s!=='erase');else hl.visible=false;}}return;}
 const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
 if(mode==='gesture'){if(ptrs.size<2)return;const g=gInfo();cam.tTheta-=(g.mx-gest.mx)*.0065;cam.tPhi=clamp(cam.tPhi-(g.my-gest.my)*.005,.28,1.38);if(gest.d>10)cam.tR=clamp(cam.tR*gest.d/g.d,5,Math.max(W,D)*2.6+8);gest=g;return;}
 if(!md)return;if(Math.hypot(e.clientX-md.sx,e.clientY-md.sy)>7)md.moved=true;
 if(mode==='orbit')orbit(dx,dy);
 else if(mode==='orbitPending'){if(md.moved)mode='orbit';}
 else if(mode==='placePending'){if(md.moved){mode='orbit';hideGhost();}else if(e.pointerType==='mouse')hoverGhost(e.clientX,e.clientY);}
 else if(mode==='objPending'){if(md.moved&&beginMove(md.uid)){mode='move';moveTo(e.clientX,e.clientY);}}
 else if(mode==='move')moveTo(e.clientX,e.clientY);
 else if(mode==='paint')paintAt(e.clientX,e.clientY);});
function pUp(e){if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
 if(mode==='gesture'){if(!ptrs.size){mode=null;gest=null;}return;}
 if(!md){mode=null;return;}
 if(e.type==='pointercancel'){endSingle();mode=null;return;}
 if(mode==='placePending'&&!md.moved){tryPlace(tool.id,e.clientX,e.clientY,ghostRot);if(e.pointerType!=='mouse')hideGhost();}
 else if(mode==='objPending'&&!md.moved){select(md.uid);sfx(400,.05);}
 else if(mode==='orbitPending'&&!md.moved)select(null);
 else if(mode==='move')commitMove();
 else if(mode==='paint'){lastPaint=null;if(e.pointerType!=='mouse')hl.visible=false;const s=undoStack[undoStack.length-1];if(s&&s.surf.every((v,i)=>v===surf[i])&&s.objs.length===objs.length)undoStack.pop();afterChange();}
 mode=null;md=null;}
canvas.addEventListener('pointerup',pUp);canvas.addEventListener('pointercancel',pUp);
canvas.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&!ptrs.size&&!pdrag)hideGhost();});
canvas.addEventListener('wheel',e=>{e.preventDefault();cam.tR=clamp(cam.tR*(1+e.deltaY*.0012),5,Math.max(W,D)*2.6+8);},{passive:false});
function hoverGhost(cx,cy){if(!tool||tool.kind!=='obj')return;const it=ITEM[tool.id],p=groundAt(cx,cy);if(!p){hideGhost();return;}
 const [c,r]=anchorFor(it,ghostRot,p),[fw,fd]=fp(it,ghostRot),ok=!canPlace(it,c,r,ghostRot,0)&&it.cost<=remaining();
 const g=ensureGhost(tool.id,ghostRot);g.visible=true;g.position.set(c+fw/2-W/2,.02,r+fd/2-D/2);setHL(c,r,fw,fd,ok);}

 if(!pd.active){if(dy<-12&&Math.abs(dy)>Math.abs(dx)*1.1&&pd.k.startsWith('o:')){pd.active=true;pdrag=true;pd.prevTool=tool;tool={kind:'obj',id:pd.k.slice(2)};selected=null;showSel();updatePalStates();renderCtx();}else return;}

window.addEventListener('pointerup',e=>{if(!pd||e.pointerId!==pd.id)return;const s=pd;pd=null;

function endPresent(){presenting=false;document.body.classList.remove('presenting');gridLines.visible=true;}
$('#modal').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='close'){closeModal();}
 else if(a==='lvl'){endPresent();loadLevel(+b.dataset.i);showBrief();}
 else if(a==='title'){endPresent();showTitle();}
 else if(a==='sound'){progress.sound=!progress.sound;saveProgress();b.textContent=T('sound',{v:progress.sound?T('on'):T('off')});}
 else if(a==='lang'){showLang();}
 else if(a==='setlang'){clearTimeout(saveT);if(L&&surf){progress.designs[L.n]={surf:Array.from(surf),objs,uid:uidSeq};}saveProgress();SG_setLang(b.dataset.l);}
 else if(a==='next'){endPresent();closeModal();const nx=LI+1;
  const go=ok=>{loadLevel(nx);if(ok){bonusBudget=Math.round(L.budget*.1/100)*100;refresh();}showBrief();if(ok)toast(T('toast_bonus',{x:fmt(bonusBudget)}));};
  if(window.AdKit){modalOpen=true;AdKit.levelDone({title:T('newclient_title'),reward:T('newclient_reward')}).then(go);}else go(false);}
 else if(a==='edit'){endPresent();closeModal();cam.tR=baseR();}
 else if(a==='reset'){endPresent();pushUndo();surf=new Uint8Array(W*D);objs=[];rebuildAll();afterChange();closeModal();toast(T('toast_reset'));}});
function confetti(){if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=document.createElement('div');c.className='conf';const cols=['#f3b23a','#a8d37f','#e3694b','#f1eee3','#9b7fd6'];
 for(let i=0;i<70;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=cols[i%5];p.style.animationDuration=(1.6+Math.random()*1.6)+'s';p.style.animationDelay=Math.random()*.5+'s';p.style.transform=`rotate(${Math.random()*360}deg)`;c.appendChild(p);}
 $('#app').appendChild(c);setTimeout(()=>c.remove(),4000);}

/* ================= LOOP ================= */
function baseR(){const a=camera.aspect||1;return (Math.max(W,D)*1.25+6)*(a<.8?1.5:a<1.1?1.2:1);}
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/Math.max(1,h);camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const easeBack=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
let tm=0,last=performance.now(),lastNK=-1;
function applyNight(k){hemi.intensity=.85-.63*k;sun.intensity=1-.82*k;sun.color.copy(dayC).lerp(moonC,k);scene.background.copy(skyC).lerp(nightSky,k);scene.fog.color.copy(scene.background);
 bulbMat.emissiveIntensity=.25+2.4*k;winMat.emissiveIntensity=k*1.1;glowMats.warm.opacity=k*.9;glowMats.fire.opacity=.3+.6*k;waterMat.emissiveIntensity=.05+.4*k;}
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;tm+=dt;
 if(presenting)cam.tTheta+=dt*.55;const k=Math.min(1,dt*9);cam.theta+=(cam.tTheta-cam.theta)*k;cam.phi+=(cam.tPhi-cam.phi)*k;cam.r+=(cam.tR-cam.r)*k;
 const sp=Math.sin(cam.phi);camera.position.set(cam.target.x+cam.r*sp*Math.sin(cam.theta),cam.target.y+cam.r*Math.cos(cam.phi),cam.target.z+cam.r*sp*Math.cos(cam.theta));camera.lookAt(cam.target);
 nightK+=((night?1:0)-nightK)*Math.min(1,dt*3);if(Math.abs(nightK-lastNK)>.002){applyNight(nightK);lastNK=nightK;}
 if(objRoot)for(const root of objRoot.children){const u=root.userData,inn=u.inner;
  if(u.pop<1){u.pop=Math.min(1,u.pop+dt*3.2);inn.scale.setScalar(Math.max(.01,easeBack(u.pop)));}
  const a=inn.userData.anim;if(!a)continue;
  if(a==='sway'&&!reduce){inn.rotation.z=Math.sin(tm*1.3+u.ph)*.02;inn.rotation.x=Math.cos(tm*1.1+u.ph)*.014;}
  else if(a==='fire')inn.userData.flames.forEach((f,i)=>f.scale.set(1,.75+.35*Math.sin(tm*9+i*2+u.ph)+.15*Math.sin(tm*23+i),1));
  else if(a==='fountain')inn.userData.drops.forEach(d=>{const s=(tm*.7+d.ph)%1;let rr,y;if(d.tier===0){rr=.05+.36*s;y=1.8+.2*Math.sin(Math.PI*s)-.5*s*s;}else{rr=.42+.45*s;y=1.3-.92*s*s;}d.m.position.set(Math.cos(d.a)*rr,y,Math.sin(d.a)*rr);});}
 if(selMesh.visible)selMesh.material.opacity=.25+.15*Math.sin(tm*5);
 renderer.render(scene,camera);}

/* ================= BOOT ================= */
makeThumbs();
resize();
loadLevel(Math.min(progress.unlocked,LEVELS.length)-1);
showTitle();
requestAnimationFrame(loop);
})();
</script>

</body></html>
