/* Tek görünüm: koyu orman, lake kırmızısı ve altın. 3B sahne + 2B yazı katmanı + HTML HUD. */
:root{

  --gold:#d9b25a; --red:#b8322a; --hp:#c8402f; --mp:#3f7fc4; --exp:#d9b25a;
  --text:#ece4cf; --muted:#a69d86;

  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--text);font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
#game,#ui{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{pointer-events:none;z-index:1}
.hud{position:fixed;pointer-events:none;z-index:2}
#status{top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;display:flex;gap:10px;align-items:center}
.crest{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a2a20,#120c09);
  border:2px solid var(--gold);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:22px;color:var(--gold);
  box-shadow:0 2px 8px #0008}
.bars{display:flex;flex-direction:column;gap:4px;width:min(46vw,190px)}
.bar{height:11px;background:#0009;border:1px solid var(--line);border-radius:2px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0;transform-origin:left;transition:transform .15s}
.bar.hp i{background:linear-gradient(#e0593f,var(--hp))}
.bar.mp i{background:linear-gradient(#5d9be0,var(--mp))}
.bar.ex{height:5px} .bar.ex i{background:var(--exp)}
.bar b{position:absolute;inset:0;font:700 9px/11px var(--body);text-align:center;color:#fff;text-shadow:0 1px 1px #000}
#purse{font:700 13px var(--body);color:var(--gold);display:flex;gap:10px;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000}
#purse span{color:var(--text);font-weight:500;opacity:.8}
#mapwrap{top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;text-align:center}
#mini{width:104px;height:104px;border-radius:50%;border:2px solid var(--gold);background:#0b100d;box-shadow:0 2px 8px #0008}
#zone{font:600 12px var(--display);color:var(--gold);margin-top:2px;text-shadow:0 1px 2px #000;letter-spacing:.04em}

.btn:active{filter:brightness(1.4)}

.btn .lbl{position:relative}
.btn small{display:block;font-weight:500;color:var(--muted);font-size:9px}
#bAtk{width:92px;height:92px;right:0;bottom:0;font:700 15px var(--display);background:radial-gradient(circle at 40% 35%,#7a2a22,#2a0d0a)}
#bS1{width:58px;height:58px;right:100px;bottom:2px}

#bS3{width:58px;height:58px;right:22px;bottom:104px}
#bPot{width:46px;height:46px;right:130px;bottom:118px;border-color:var(--hp)}
#talk{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 128px);z-index:3;
  pointer-events:auto;border:2px solid var(--gold);background:var(--panel);color:var(--gold);font:700 16px var(--display);
  padding:10px 22px;border-radius:4px;letter-spacing:.06em}

#log div{transition:opacity 1s}
#overlay{position:fixed;inset:0;z-index:5;background:#000a;display:grid;place-items:center;padding:16px}
.card{width:min(100%,380px);max-height:86vh;overflow:auto;background:var(--panel);border:2px solid var(--gold);border-radius:6px;
  padding:18px;box-shadow:0 10px 40px #000;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font:700 26px var(--display);color:var(--gold);text-wrap:balance;letter-spacing:.03em}
.card p{margin:0;color:var(--muted);line-height:1.45;font-size:14px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--panel-2);border:1px solid var(--line);

.row strong{color:var(--text);text-align:right} .row em{font-style:normal;color:var(--gold)}
.act{font:700 15px var(--body);border:1px solid var(--gold);background:linear-gradient(#7a2a22,#4a1612);color:var(--text);
  border-radius:4px;padding:11px 14px;cursor:pointer;touch-action:manipulation}
.act:disabled{opacity:.4;cursor:default}
.act.ghost{background:transparent;color:var(--muted);border-color:var(--line)}
.act:focus-visible{outline:2px solid #fff;outline-offset:2px}
.weapon{font:700 34px var(--display);color:var(--gold);text-align:center}
.result{min-height:20px;text-align:center;font-weight:700}
.ok{color:#8fd16a}.bad{color:#e0593f}
.keys{font-size:12px;color:var(--muted)}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.langs .act{padding:10px 8px;font-size:14px}
.langs .act.cur{background:linear-gradient(#a8862f,#6e5418);color:#fff}

#langBtn{padding:6px 10px;font-size:13px;color:var(--gold);white-space:nowrap}
#loading{position:fixed;inset:0;z-index:6;display:grid;place-items:center;background:var(--ink);font:700 22px var(--display);color:var(--gold)}

<script src="lib/three.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
if(!window.THREE){$('loading').textContent=t('noEngine');return}
const cv=$('game'),uc=$('ui'),ux=uc.getContext('2d'),mini=$('mini'),mctx=mini.getContext('2d');
let W=0,H=0,DPR=1;
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:(window.devicePixelRatio||1)<2,powerPreference:'high-performance'});
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene();const SKY=0x9db7c0;scene.background=new THREE.Color(SKY);scene.fog=new THREE.Fog(SKY,38,92);
const camera=new THREE.PerspectiveCamera(50,1,.5,220);
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(1.75,window.devicePixelRatio||1);renderer.setPixelRatio(DPR);renderer.setSize(W,H,false);
  uc.width=W*DPR;uc.height=H*DPR;camera.aspect=W/H;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

/* ---------- dünya ölçüleri (mantık piksel cinsinden, 3B = px/20) ---------- */
const WS=3200,C={x:1600,y:1600},VR=260,U=1/20;
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(7);
function hAt(x,z){const a=x*U,b=z*U;
  let h=Math.sin(a*.11)*Math.cos(b*.09)*1.4+Math.sin(a*.031+1.3)*Math.sin(b*.027+.4)*3.2+Math.sin(a*.23+b*.19)*.35;
  const d=Math.hypot(x-C.x,z-C.y),f=Math.min(1,Math.max(0,(d-VR-40)/260));h=h*f+(1-f)*.05;
  const e=Math.min(x,z,WS-x,WS-z);if(e<320)h+=Math.pow((320-e)/320,2)*16;return h}
const ZONES=t('zones');
function zoneAt(x,y){const d=Math.hypot(x-C.x,y-C.y);if(d<VR)return 0;return Math.min(7,1+Math.floor((d-VR)/300))}
const farFromVillage=(x,y,m)=>Math.hypot(x-C.x,y-C.y)>VR+m;
const onRoad=(x,y)=>{const dx=Math.abs(x-C.x),dy=Math.abs(y-C.y),d=Math.hypot(x-C.x,y-C.y);return d<VR+520&&(dx<34||dy<34)};

/* ---------- ışık ---------- */
scene.add(new THREE.HemisphereLight(0xdfeaf0,0x3b4a2c,.75));
const sun=new THREE.DirectionalLight(0xffe0b0,.95);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-26,right:26,top:26,bottom:-26,near:1,far:80});sun.shadow.bias=-.0015;sun.shadow.camera.updateProjectionMatrix();scene.add(sun);scene.add(sun.target);
const stoneLights=[0,1,2].map(()=>{const l=new THREE.PointLight(0xff4a2a,0,14,2);scene.add(l);return l});

/* ---------- malzeme yardımcıları ---------- */
const phong=(c,o)=>new THREE.MeshPhongMaterial(Object.assign({color:c,flatShading:true,shininess:6},o||{}));
const SH={grass:phong(0x4f7a3e),trunk:phong(0x4a3324),rock:phong(0x7a7d72),dark:phong(0x1b1a1f),wall:phong(0xc9b28a),roof:phong(0x8a2a22),
  wood:phong(0x5a3f2a),stoneG:phong(0x6a6a62),water:phong(0x2c4f63,{shininess:60}),lamp:phong(0xffd27a,{emissive:0xffb040,emissiveIntensity:.9})};

/* ---------- arazi ---------- */
(function terrain(){const N=200,S=WS*U;const g=new THREE.PlaneGeometry(S,S,N,N);g.rotateX(-Math.PI/2);g.translate(S/2,0,S/2);
  const pos=g.attributes.position,cols=[];const c=new THREE.Color();
  for(let i=0;i<pos.count;i++){const x=pos.getX(i)/U,z=pos.getZ(i)/U,h=hAt(x,z);pos.setY(i,h);
    const n=(Math.sin(x*.013)*Math.cos(z*.017)+Math.sin(x*.041+z*.03))*.5,zo=zoneAt(x,z),d=Math.hypot(x-C.x,z-C.y);
    if(d<VR+10)c.setRGB(.47+n*.03,.38,.26);
    else if(onRoad(x,z))c.setRGB(.44,.36,.25);
    else if(h>7)c.setRGB(.42+n*.04,.43,.4);
    else if(zo>=6)c.setRGB(.33+n*.04,.33+n*.03,.25);
    else if(zo>=4)c.setRGB(.25+n*.04,.36+n*.05,.2);
    else c.setRGB(.27+n*.05,.44+n*.06,.22);
    cols.push(c.r,c.g,c.b)}
  g.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));g.computeVertexNormals();
  const m=new THREE.Mesh(g,phong(0xffffff,{vertexColors:true}));m.receiveShadow=true;scene.add(m);
  const out=new THREE.Mesh(new THREE.PlaneGeometry(700,700),phong(0x3d4a36));out.rotation.x=-Math.PI/2;out.position.set(S/2,10,S/2);out.position.y=-.6;scene.add(out);
})();

/* ---------- örneklenmiş doğa ---------- */
const trees=[],rocks=[];
for(let i=0;i<900;i++){const x=40+R()*(WS-80),y=40+R()*(WS-80);if(farFromVillage(x,y,90)&&!onRoad(x,y)&&hAt(x,y)<9)trees.push({x,y,s:.8+R()*.7,k:R()<.55?0:1,c:R()})}
for(let i=0;i<380;i++){const x=R()*WS,y=R()*WS;if(farFromVillage(x,y,30)&&!onRoad(x,y))rocks.push({x,y,s:.3+R()*.7,r:R()*6})}
(function nature(){const mtx=new THREE.Matrix4(),q=new THREE.Quaternion(),sc=new THREE.Vector3(),p=new THREE.Vector3(),col=new THREE.Color();
  const pine=trees.filter(t=>t.k===0),round=trees.filter(t=>t.k===1);
  const inst=(geo,mat,list,fn,shadow)=>{const im=new THREE.InstancedMesh(geo,mat,list.length);list.forEach((t,i)=>{fn(t,i,im)});im.castShadow=!!shadow;im.receiveShadow=true;
    im.instanceMatrix.needsUpdate=true;if(im.instanceColor)im.instanceColor.needsUpdate=true;scene.add(im);return im};
  const set=(im,i,x,y,z,s,ry,c)=>{q.setFromAxisAngle(new THREE.Vector3(0,1,0),ry||0);sc.set(s,s,s);p.set(x,y,z);mtx.compose(p,q,sc);im.setMatrixAt(i,mtx);if(c!=null){col.set(c);im.setColorAt(i,col)}};
  const trunkG=new THREE.CylinderGeometry(.16,.24,1.8,6);trunkG.translate(0,.9,0);
  inst(trunkG,SH.trunk,trees,(t,i,im)=>set(im,i,t.x*U,hAt(t.x,t.y),t.y*U,t.s,t.c*6),true);
  const coneA=new THREE.ConeGeometry(1.5,2.6,7);coneA.translate(0,2.6,0);const coneB=new THREE.ConeGeometry(1.1,2.1,7);coneB.translate(0,3.9,0);
  const pc=['#24432c','#2b4d31','#1f3b28','#30553a'];
  inst(coneA,phong(0xffffff),pine,(t,i,im)=>set(im,i,t.x*U,hAt(t.x,t.y),t.y*U,t.s,t.c*6,pc[Math.floor(t.c*4)]),true);
  inst(coneB,phong(0xffffff),pine,(t,i,im)=>set(im,i,t.x*U,hAt(t.x,t.y),t.y*U,t.s,t.c*6,pc[Math.floor(t.c*4+1)%4]),true);
  const ball=new THREE.IcosahedronGeometry(1.5,0);ball.translate(0,2.9,0);const rc=['#3e6a35','#4a7a3a','#355e30','#5a7f3a'];
  inst(ball,phong(0xffffff),round,(t,i,im)=>set(im,i,t.x*U,hAt(t.x,t.y),t.y*U,t.s,t.c*6,rc[Math.floor(t.c*4)]),true);
  const ball2=new THREE.IcosahedronGeometry(1,0);ball2.translate(.6,3.8,.2);
  inst(ball2,phong(0xffffff),round,(t,i,im)=>set(im,i,t.x*U,hAt(t.x,t.y),t.y*U,t.s,t.c*6,rc[Math.floor(t.c*4+2)%4]),true);
  const rockG=new THREE.DodecahedronGeometry(.8,0);rockG.scale(1,.6,1);
  inst(rockG,SH.rock,rocks,(t,i,im)=>set(im,i,t.x*U,hAt(t.x,t.y)+.1,t.y*U,t.s,t.r),true);
  const tuftG=new THREE.ConeGeometry(.12,.55,3);tuftG.translate(0,.25,0);const tufts=[];
  for(let i=0;i<2600;i++){const x=R()*WS,y=R()*WS;if(farFromVillage(x,y,10)&&!onRoad(x,y)&&hAt(x,y)<7)tufts.push({x,y,c:R()})}
  const tc=['#5d8a44','#4c7a3a','#6b9446','#c9a23f','#b9605a'];
  inst(tuftG,phong(0xffffff),tufts,(t,i,im)=>set(im,i,t.x*U,hAt(t.x,t.y),t.y*U,.7+t.c*.8,t.c*6,tc[t.c>.96?3:t.c>.93?4:Math.floor(t.c*3)]),false);
})();

/* ---------- köy ---------- */
const NPCS=[{id:'smith',name:t('npcSmith'),x:C.x-70,y:C.y-40,body:0x6d4f3a,hat:0x2a2420},{id:'shop',name:t('npcShop'),x:C.x+70,y:C.y-40,body:0x3f5f7a,hat:0x7a2a22}];
(function village(){const box=(w,h,d,m,x,y,z,ry,g)=>{const me=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);me.position.set(x,y,z);me.rotation.y=ry||0;me.castShadow=me.receiveShadow=true;(g||scene).add(me);return me};
  // sur
  const posts=[];for(let a=0;a<Math.PI*2;a+=.045){if(Math.abs(Math.sin(a*2))<.32)continue;posts.push(a)}
  const pg=new THREE.CylinderGeometry(.22,.26,2.6,6);pg.translate(0,1.3,0);const tip=new THREE.ConeGeometry(.24,.5,6);tip.translate(0,2.85,0);
  const mtx=new THREE.Matrix4();[pg,tip].forEach(geo=>{const im=new THREE.InstancedMesh(geo,SH.wood,posts.length);posts.forEach((a,i)=>{const x=C.x+Math.cos(a)*VR,z=C.y+Math.sin(a)*VR;
    mtx.makeTranslation(x*U,hAt(x,z)-.1,z*U);im.setMatrixAt(i,mtx)});im.castShadow=true;scene.add(im)});
  // kapı direkleri ve fenerler
  for(let k=0;k<4;k++){const a=k*Math.PI/2;for(const s of[-1,1]){const aa=a+s*.15,x=(C.x+Math.cos(aa)*VR)*U,z=(C.y+Math.sin(aa)*VR)*U;
    box(.45,3.6,.45,SH.roof,x,1.8,z);box(.35,.35,.35,SH.lamp,x,3.8,z)}
    const x=(C.x+Math.cos(a)*VR)*U,z=(C.y+Math.sin(a)*VR)*U;box(Math.abs(Math.cos(a))>.5?.4:4.2,.35,Math.abs(Math.cos(a))>.5?4.2:.4,SH.roof,x,3.7,z)}
  // evler
  const houses=[[-150,-130,0],[90,-150,0],[-170,90,.3],[110,100,-.3],[-30,170,0]];
  for(const [hx,hz,ry] of houses){const g=new THREE.Group();g.position.set((C.x+hx)*U,0,(C.y+hz)*U);g.rotation.y=ry;scene.add(g);
    box(4.2,2.4,3.2,SH.wall,0,1.2,0,0,g);box(4.4,.3,3.4,SH.wood,0,.15,0,0,g);
    const roof=new THREE.Mesh(new THREE.ConeGeometry(3.6,1.8,4),SH.roof);roof.rotation.y=Math.PI/4;roof.scale.set(1.2,1,.95);roof.position.y=3.3;roof.castShadow=true;g.add(roof);
    box(.9,1.5,.1,SH.wood,0,.75,1.61,0,g);box(.6,.5,.1,SH.lamp,-1.3,1.5,1.61,0,g);box(.6,.5,.1,SH.lamp,1.3,1.5,1.61,0,g)}
  // kuyu
  const well=new THREE.Mesh(new THREE.CylinderGeometry(1,1.1,.9,10,1,true),SH.stoneG);well.position.set(C.x*U,.45,(C.y+70)*U);well.castShadow=true;scene.add(well);
  const wt=new THREE.Mesh(new THREE.CircleGeometry(.95,10),SH.water);wt.rotation.x=-Math.PI/2;wt.position.set(C.x*U,.6,(C.y+70)*U);scene.add(wt);
  box(.15,2.2,.15,SH.wood,C.x*U-1,1.1,(C.y+70)*U);box(.15,2.2,.15,SH.wood,C.x*U+1,1.1,(C.y+70)*U);
  const wr=new THREE.Mesh(new THREE.ConeGeometry(1.6,.8,4),SH.roof);wr.rotation.y=Math.PI/4;wr.position.set(C.x*U,2.5,(C.y+70)*U);scene.add(wr);
  // demirci örsü ve ocak, tüccar tezgahı
  box(.8,.6,.5,SH.dark,(C.x-70)*U+1.4,.3,(C.y-40)*U);box(1.4,1.1,1.2,SH.stoneG,(C.x-70)*U-1.6,.55,(C.y-40)*U-.5);
  const fire=box(.8,.25,.6,SH.lamp,(C.x-70)*U-1.6,1.15,(C.y-40)*U-.5);
  box(2.4,.9,.9,SH.wood,(C.x+70)*U,.45,(C.y-40)*U+1.1);box(2.6,.1,1.4,SH.roof,(C.x+70)*U,2.3,(C.y-40)*U+.9);
  box(.1,2.3,.1,SH.wood,(C.x+70)*U-1.2,1.15,(C.y-40)*U+1.5);box(.1,2.3,.1,SH.wood,(C.x+70)*U+1.2,1.15,(C.y-40)*U+1.5);
  const fl=new THREE.PointLight(0xff8a3a,1.2,9,2);fl.position.set((C.x-70)*U-1.6,1.8,(C.y-40)*U-.5);scene.add(fl);
})();

/* ---------- modeller ---------- */

  else{const ph=Math.floor(e.hp/e.mhp*4);if(ph<e.phase&&e.hp>0){e.phase=ph;e.m.cracks.forEach((c,i)=>c.visible=i<4-ph);shake=.35;

    const m=makeEnemy(list[i%list.length],e.x+Math.cos(i*2.1)*80,e.y+Math.sin(i*2.1)*80,Math.max(1,e.L-1));m.aggro=1;E.push(m);addFx('ring',m.x,m.y,0xff4a2a)}float(e.x,e.y,t('stoneCrack'),'#ff8a6a',1,5.4)}}

  const coins=e.type==='tas'?7:1,val=Math.round((e.type==='tas'?(40+e.L*8):(2+e.L*1.6))*(.7+Math.random()*.6));

  if(e.type==='tas'){const n=1+(Math.random()<.4?1:0);for(let i=0;i<n;i++)addDrop('soul',1,e.x+(Math.random()-.5)*30,e.y+(Math.random()-.5)*30);

  addFx('slash',P.x,P.y,0xf5e6c0,P.dir);

    const cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw);const mx=jx*cy+jy*sy,my=-jx*sy+jy*cy;

    else if(ml>.1){const sp=180*(P.swing>0?.5:1);P.x+=mx*sp*dt;P.y+=my*sp*dt;if(P.swing<=0){P.dir=Math.atan2(my,mx)}P.walk+=dt*11*ml;P.moving=ml}
    P.x=Math.max(140,Math.min(WS-140,P.x));P.y=Math.max(140,Math.min(WS-140,P.y));

    const inV=Math.hypot(P.x-C.x,P.y-C.y)<VR;
    P.mp=Math.min(maxMp(),P.mp+dt*(inV?12:3));if(P.hurtT>4)P.hp=Math.min(maxHp(),P.hp+dt*maxHp()*(inV?.12:.012));

      const wx=e.wx-e.x,wy=e.wy-e.y,wd=Math.hypot(wx,wy);if(wd>8){e.x+=wx/wd*e.t.spd*.35*dt;e.y+=wy/wd*e.t.spd*.35*dt;e.dir=Math.atan2(wy,wx);e.walk+=dt*5;e.moving=.5}}

}

function drawUI(){ux.setTransform(DPR,0,0,DPR,0,0);ux.clearRect(0,0,W,H);ux.textAlign='center';ux.lineJoin='round';
  for(const e of E){if(!e.m.g.visible)continue;const d=Math.hypot(e.x-P.x,e.y-P.y);if(d>700&&e.type!=='tas')continue;
    const s=toScreen(e.x,e.y,e.type==='tas'?5.2:e.type==='ayi'?2.6:e.t.beast?1.8:2.5);if(!s)continue;
    ux.font=`${e.type==='tas'?700:600} 12px "Alegreya Sans",sans-serif`;ux.lineWidth=3;ux.strokeStyle='#000b';
    const lbl=t('lvAbbr',{n:e.L})+' '+e.t.name;ux.fillStyle=e.type==='tas'?'#ff8a6a':(e.aggro?'#ffb39e':'#ece4cf');ux.strokeText(lbl,s[0],s[1]);ux.fillText(lbl,s[0],s[1]);
    if(e.hp<e.mhp||e.type==='tas'){const w=e.type==='tas'?72:40;ux.fillStyle='#000c';ux.fillRect(s[0]-w/2-1,s[1]+4,w+2,6);ux.fillStyle='#c8402f';ux.fillRect(s[0]-w/2,s[1]+5,w*Math.max(0,e.hp/e.mhp),4)}}
  for(const n of NPCS){const s=toScreen(n.x,n.y,2.6);if(!s)continue;ux.font='700 13px "Cormorant SC",serif';ux.lineWidth=3;ux.strokeStyle='#000b';ux.fillStyle='#d9b25a';
    ux.strokeText(n.name,s[0],s[1]);ux.fillText(n.name,s[0],s[1]);ux.font='700 18px serif';ux.strokeText('!',s[0],s[1]-16+Math.sin(time*4)*2);ux.fillText('!',s[0],s[1]-16+Math.sin(time*4)*2)}
  if(!P.dead){const s=toScreen(P.x,P.y,2.75);if(s){ux.font='700 12px "Alegreya Sans",sans-serif';ux.lineWidth=3;ux.strokeStyle='#000b';ux.fillStyle='#ece4cf';ux.strokeText(t('hero'),s[0],s[1]);ux.fillText(t('hero'),s[0],s[1])}}
  for(const f of floats){const s=toScreen(f.x,f.y,f.h+f.t*1.6);if(!s)continue;ux.globalAlpha=Math.min(1,(1.1-f.t)*2.5);
    const sc=f.big?1+Math.max(0,.25-f.t)*2:1;ux.font=`800 ${Math.round((f.big?20:14)*sc)}px "Alegreya Sans",sans-serif`;ux.lineWidth=4;ux.strokeStyle='#000c';ux.fillStyle=f.col;
    ux.strokeText(f.txt,s[0],s[1]);ux.fillText(f.txt,s[0],s[1])}ux.globalAlpha=1;
  if(joy.id!==null){ux.strokeStyle='#d9b25a88';ux.lineWidth=2;ux.fillStyle='#0006';ux.beginPath();ux.arc(joy.ox,joy.oy,55,0,7);ux.fill();ux.stroke();
    ux.fillStyle='#d9b25acc';ux.beginPath();ux.arc(joy.ox+joy.x*55,joy.oy+joy.y*55,22,0,7);ux.fill()}
  else if(time<14&&ov.hidden){ux.globalAlpha=.55*(1-time/14);ux.strokeStyle='#d9b25a';ux.lineWidth=2;ux.beginPath();ux.arc(90,H-110,55,0,7);ux.stroke();
    ux.font='600 12px "Alegreya Sans",sans-serif';ux.fillStyle='#ece4cf';ux.fillText(t('drag'),90,H-106);ux.globalAlpha=1}
  if(P.dead){ux.fillStyle='rgba(60,0,0,.4)';ux.fillRect(0,0,W,H)}
  else if(P.hp<maxHp()*.25){const g=ux.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.7);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(160,20,10,${.3+Math.sin(time*6)*.1})`);ux.fillStyle=g;ux.fillRect(0,0,W,H)}
}
function drawMini(){mctx.setTransform(1,0,0,1,0,0);mctx.clearRect(0,0,208,208);mctx.save();mctx.beginPath();mctx.arc(104,104,104,0,7);mctx.clip();
  mctx.translate(104,104);mctx.rotate(cam.yaw);mctx.translate(-104,-104);
  const scale=208/1400,ox=P.x-700,oy=P.y-700;const M=(x,y)=>[(x-ox)*scale,(y-oy)*scale];
  mctx.fillStyle='#1d3022';mctx.fillRect(-100,-100,408,408);
  for(let z=7;z>=1;z--){const [cx,cy]=M(C.x,C.y);mctx.fillStyle=z%2?'#1f3524':'#243c28';mctx.beginPath();mctx.arc(cx,cy,(VR+z*300)*scale,0,7);mctx.fill()}
  const [vx,vy]=M(C.x,C.y);mctx.fillStyle='#75634a';mctx.beginPath();mctx.arc(vx,vy,VR*scale,0,7);mctx.fill();
  mctx.strokeStyle='#5a4a36';mctx.lineWidth=68*scale;mctx.beginPath();mctx.moveTo(vx-(VR+520)*scale,vy);mctx.lineTo(vx+(VR+520)*scale,vy);mctx.moveTo(vx,vy-(VR+520)*scale);mctx.lineTo(vx,vy+(VR+520)*scale);mctx.stroke();
  mctx.fillStyle='#0009';const [a0,b0]=M(140,140),[a1,b1]=M(WS-140,WS-140);mctx.beginPath();mctx.rect(-300,-300,808,808);mctx.rect(a0,b0,a1-a0,b1-b0);mctx.fill('evenodd');
  for(const e of E){let [x,y]=M(e.x,e.y);if(e.type==='tas')continue;mctx.fillStyle=e.aggro?'#ff9a7a':'#c8402f';mctx.fillRect(x-2,y-2,4,4)}
  for(const n of NPCS){const [x,y]=M(n.x,n.y);mctx.fillStyle='#d9b25a';mctx.fillRect(x-2.5,y-2.5,5,5)}
  mctx.restore();mctx.save();
  for(const e of E){if(e.type!=='tas')continue;let dx=(e.x-P.x)*scale,dy=(e.y-P.y)*scale;const c=Math.cos(cam.yaw),s=Math.sin(cam.yaw);let rx=dx*c-dy*s,ry=dx*s+dy*c;
    const d=Math.hypot(rx,ry);if(d>92){rx*=92/d;ry*=92/d}const x=104+rx,y=104+ry;mctx.fillStyle='#ff5a3c';mctx.strokeStyle='#000';mctx.lineWidth=1;
    mctx.beginPath();mctx.moveTo(x,y-7);mctx.lineTo(x+6,y);mctx.lineTo(x,y+7);mctx.lineTo(x-6,y);mctx.closePath();mctx.fill();mctx.stroke()}
  mctx.fillStyle='#fff';mctx.translate(104,104);mctx.rotate(P.face+cam.yaw);mctx.beginPath();mctx.moveTo(8,0);mctx.lineTo(-5,-5);mctx.lineTo(-5,5);mctx.fill();mctx.restore()}

let hudT=0;
function hud(){const mh=maxHp(),mm=maxMp(),ne=needExp(P.lv);
  $('hpI').style.transform=`scaleX(${P.hp/mh})`;$('hpT').textContent=Math.ceil(P.hp)+' / '+mh;
  $('mpI').style.transform=`scaleX(${P.mp/mm})`;$('mpT').textContent=Math.floor(P.mp)+' / '+mm;
  $('exI').style.transform=`scaleX(${P.exp/ne})`;$('lv').textContent=P.lv;$('gold').textContent=P.gold;$('soul').textContent=P.soul;$('potN').textContent=t('potN',{n:P.pot});
  const z=zoneAt(P.x,P.y);$('zone').textContent=ZONES[z]+(z?' · '+t('lvAbbr',{n:(z-1)*4+1})+'+':'');
  for(const [id,k,m,mp] of[['bS1','s1',4,20],['bS2','s2',3,15],['bS3','s3',20,30],['bPot','potCd',1.5,0]]){const b=$(id);b.querySelector('.cd').style.transform=`scaleY(${P[k]/m})`;b.style.opacity=(mp&&P.mp<mp)?.55:1}}

let last=0,time=0,running=false;
function loop(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;time+=dt;shake=Math.max(0,shake-dt);
  if(hitStop>0){hitStop-=dt;dt*=.15}
  if(ov.hidden)update(dt);sync(dt);renderer.render(scene,camera);drawUI();
  hudT-=dt;if(hudT<=0){hudT=.08;hud();drawMini()}requestAnimationFrame(loop)}
function start(data){if(running)return;running=true;load(data||stored());for(let i=0;i<14;i++)spawnEnemy();hud();
  $('loading').hidden=true;intro();requestAnimationFrame(loop)}
try{window.claude?.hot?.snapshot?.(()=>snap())}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data&&Object.keys(window.claude.hot.data).length?window.claude.hot.data:null);
addEventListener('pagehide',save);
})();
</script>
