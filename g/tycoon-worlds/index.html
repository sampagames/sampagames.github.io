<style>
/* Layout: full-screen isometric 3D yard; chunky toy HUD floats over it; splash, worlds and dialogs as sheets */
:root{
  --sky:#8fd0ff; --ink:#14203a; --cash:#3fcf5c; --cash-d:#23963a; --gold:#ffcf3a; --gold-d:#c8961a;
  --pink:#ff4f7e; --glass:rgba(16,26,48,.62); --card:#ffffff; --muted:#5c6886;
  --display:"Lilita One","Arial Black",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--body);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#stage{position:fixed;inset:0;z-index:0}
#stage canvas{display:block;width:100%;height:100%}
button{font-family:var(--body);cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* HUD */
#hud{position:fixed;inset:0;z-index:1;pointer-events:none}
#hud button{pointer-events:auto}
.top{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.lcol{display:grid;gap:7px;justify-items:start}
.money{display:flex;align-items:center;gap:8px;background:var(--glass);border-radius:16px;padding:5px 14px 5px 6px;color:#fff;
  font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums;transition:transform .12s}
.money.bump{transform:scale(1.12)}
.bill{width:38px;height:24px;border-radius:5px;background:var(--cash);box-shadow:inset 0 0 0 3px var(--cash-d),0 3px 0 var(--cash-d);
  display:grid;place-items:center;font-family:var(--display);font-size:15px;color:#fff;transform:rotate(-8deg)}
.bag{display:flex;align-items:center;gap:8px;background:var(--glass);border-radius:12px;padding:4px 10px;color:#fff;font-weight:900;font-size:13px;font-variant-numeric:tabular-nums}
.bag .cap{color:var(--gold)}
.bag.full .cap{color:#ff8fa8}
.goals{background:var(--glass);border-radius:14px;padding:7px 10px 8px;color:#fff;min-width:178px;max-width:56vw}
.goals b{display:flex;justify-content:space-between;gap:10px;font-family:var(--display);font-weight:400;font-size:15px;letter-spacing:.02em}
.goals b span:last-child{color:var(--gold)}
.goals ul{list-style:none;margin:5px 0 0;padding:0;display:grid;gap:3px}
.goals li{display:grid;grid-template-columns:16px 1fr auto;gap:6px;align-items:center;font-weight:800;font-size:12px;font-variant-numeric:tabular-nums}
.goals li i{width:14px;height:14px;border-radius:4px;border:2px solid rgba(255,255,255,.7);box-sizing:border-box;display:grid;place-items:center;font-style:normal;font-size:10px}
.goals li.ok{opacity:.7}
.goals li.ok i{background:var(--cash);border-color:var(--cash)}
.goals li em{font-style:normal;color:#cfe0ff}
.right{display:flex;gap:8px;align-items:center}
.chip{border:0;display:flex;align-items:center;gap:6px;background:var(--glass);color:#fff;border-radius:14px;padding:8px 12px;
  font-weight:900;font-size:14px;white-space:nowrap;max-width:40vw;overflow:hidden;text-overflow:ellipsis}
.chip .dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 2px #fff}
.round{border:0;width:40px;height:40px;border-radius:14px;background:var(--glass);color:#fff;display:grid;place-items:center;flex:none}
.round svg{width:22px;height:22px}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 88px);
  background:#fff;color:var(--ink);font-weight:900;font-size:15px;padding:8px 16px;border-radius:999px;box-shadow:0 4px 0 rgba(0,0,0,.18);
  text-align:center;width:max-content;max-width:min(80vw,420px);text-wrap:balance}
.boost{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
  border:0;border-radius:18px;background:var(--gold);color:var(--ink);box-shadow:0 5px 0 var(--gold-d);padding:8px 14px 8px 10px;
  display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:20px}
.boost:active{transform:translateY(4px);box-shadow:0 1px 0 var(--gold-d)}
.boost .tv{width:30px;height:24px;border-radius:6px;background:var(--ink);display:grid;place-items:center}
.boost .tv svg{width:12px;height:12px}
.boost small{display:block;font-family:var(--body);font-weight:900;font-size:11px;line-height:1;opacity:.8}
.boost.on{background:var(--cash);box-shadow:0 5px 0 var(--cash-d);color:#fff}
.boost.on .tv{display:none}
#labels{position:absolute;inset:0;overflow:hidden}
.tag{position:absolute;left:0;top:0;font-family:var(--display);font-size:18px;color:#fff;background:var(--pink);padding:1px 10px;border-radius:10px;
  box-shadow:0 3px 0 rgba(0,0,0,.2);will-change:transform;white-space:nowrap}
.pop{position:absolute;left:0;top:0;font-family:var(--display);font-size:24px;color:#fff;white-space:nowrap;will-change:transform,opacity;
  -webkit-text-stroke:2px var(--cash-d);paint-order:stroke fill;text-shadow:0 2px 0 var(--cash-d)}
.toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 140px);transform:translateX(-50%);background:var(--glass);color:#fff;
  font-weight:900;padding:8px 16px;border-radius:999px;font-size:14px;white-space:nowrap;opacity:0;transition:opacity .25s}
.toast.on{opacity:1}
.big{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:92%;text-align:center;font-family:var(--display);color:#fff;
  font-size:clamp(30px,9vw,54px);line-height:1.05;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);text-wrap:balance}
.big small{display:block;font-family:var(--body);font-weight:900;font-size:18px;-webkit-text-stroke:0;text-shadow:0 2px 0 var(--ink);margin-top:8px}
.big.go{animation:bigin .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes bigin{from{transform:translate(-50%,-50%) scale(.4);opacity:0}}
.joy{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:3px solid rgba(255,255,255,.55);background:rgba(255,255,255,.14)}
.joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.85)}

/* sheets */
.screen{position:fixed;inset:0;z-index:3;overflow-y:auto;display:flex;flex-direction:column;align-items:center;box-sizing:border-box;touch-action:pan-y;
  padding-block:calc(env(safe-area-inset-top,0px) + 18px) calc(env(safe-area-inset-bottom,0px) + 24px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#splash{background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(20,32,58,.12) 40%,rgba(20,32,58,.85) 100%)}
.langs{align-self:flex-end;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.langs button{border:0;border-radius:10px;padding:6px 10px;font-weight:900;font-size:13px;background:rgba(20,32,58,.45);color:#fff}
.langs button.on{background:#fff;color:var(--ink)}
.logo{margin:auto 0 0;font-family:var(--display);font-weight:400;font-size:clamp(56px,17vw,96px);line-height:.86;color:#fff;text-align:center;
  -webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 var(--ink);transform:rotate(-4deg)}
.logo span{color:var(--gold)}
.tagline{margin:18px 0 0;color:#fff;font-weight:900;font-size:17px;text-align:center;text-shadow:0 2px 0 var(--ink);max-width:340px;text-wrap:balance}
.play{margin-top:22px;border:0;border-radius:22px;background:var(--gold);color:var(--ink);font-family:var(--display);font-size:36px;
  padding:10px 0;width:min(100%,320px);box-shadow:0 7px 0 var(--gold-d),0 12px 20px rgba(0,0,0,.25);letter-spacing:.04em}
.play:active{transform:translateY(5px);box-shadow:0 2px 0 var(--gold-d)}
.play.green{background:var(--cash);color:#fff;box-shadow:0 7px 0 var(--cash-d)}
.foot{margin:16px 0 auto;color:#e7eefc;font-weight:800;font-size:13px;text-align:center;max-width:320px}
.dim{background:rgba(12,20,40,.55);justify-content:center}
.card{background:var(--card);border-radius:24px;padding:20px 18px;width:100%;max-width:400px;box-sizing:border-box;box-shadow:0 8px 0 rgba(0,0,0,.2);text-align:center;margin-block:auto}
.card h3{margin:0;font-family:var(--display);font-weight:400;font-size:30px;color:var(--ink);text-wrap:balance}
.card p{margin:8px 0 0;color:var(--muted);font-weight:800;font-size:15px;line-height:1.4}
.card .amt{margin:14px auto 0;display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-size:38px;color:var(--cash-d);font-variant-numeric:tabular-nums}
.btns{display:grid;gap:10px;margin-top:18px}
.btns .play{margin:0;width:100%;font-size:24px;display:flex;align-items:center;justify-content:center;gap:10px}
.ghost{border:0;background:transparent;color:var(--muted);font-weight:900;font-size:16px;padding:8px}
.worlds{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px;text-align:left}
.world{width:100%;border:0;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:#f2f5fb;border-radius:16px;padding:8px 12px 8px 8px}
.world .sw{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-size:26px}
.world b{display:block;font-family:var(--display);font-weight:400;font-size:20px;color:var(--ink)}
.world small{font-weight:800;font-size:12px;color:var(--muted)}
.world .stars{color:var(--gold-d);letter-spacing:1px;font-size:14px}
.world .st{font-weight:900;font-size:13px;color:var(--muted)}
.world.cur{box-shadow:inset 0 0 0 3px var(--gold);background:#fff9e3}
.world:disabled{opacity:.55;cursor:default}
.set{display:grid;gap:10px;margin-top:14px}
.set .row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#f2f5fb;border-radius:14px;padding:10px 12px;font-weight:900}
.set .langs{align-self:auto;flex-wrap:wrap;justify-content:flex-end;max-width:62%}
.set .langs button{background:#dfe5f1;color:var(--ink)}
.set .langs button.on{background:var(--ink);color:#fff}
.tog{border:0;border-radius:999px;padding:6px 14px;font-weight:900;background:var(--cash);color:#fff}
.tog.off{background:#c9d0de;color:var(--ink)}
</style>
</head>

</div>

      <button class="ghost" id="away1x" data-t="collect"></button>

  </div>
</div>

function rnd(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let x=Math.imul(seed^seed>>>15,1|seed);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296;};}

function noiseTex(base,kind,seed){
  const c=document.createElement("canvas");c.width=c.height=256;const x=c.getContext("2d"),r=rnd(seed);
  const col=new THREE.Color(base);x.fillStyle=hex(base);x.fillRect(0,0,256,256);
  const tone=f=>{const k=col.clone().multiplyScalar(f);return "rgb("+Math.min(255,k.r*255|0)+","+Math.min(255,k.g*255|0)+","+Math.min(255,k.b*255|0)+")";};
  if(kind==="grass"){for(let i=0;i<900;i++){x.fillStyle=tone(.86+r()*.3);x.fillRect(r()*256,r()*256,2+r()*3,2+r()*3);}
    x.lineWidth=2;for(let i=0;i<80;i++){x.strokeStyle=tone(.76);const px=r()*256,py=r()*256;x.beginPath();x.moveTo(px,py);x.lineTo(px-3,py-7);x.moveTo(px,py);x.lineTo(px+3,py-6);x.stroke();}}
  else if(kind==="tile"){x.strokeStyle=tone(.9);x.lineWidth=3;for(let i=0;i<=256;i+=64){x.beginPath();x.moveTo(i,0);x.lineTo(i,256);x.stroke();x.beginPath();x.moveTo(0,i);x.lineTo(256,i);x.stroke();}
    for(let i=0;i<300;i++){x.fillStyle=tone(.95+r()*.1);x.fillRect(r()*256,r()*256,2,2);}}
  else{for(let i=0;i<1400;i++){x.fillStyle=tone(.88+r()*.24);const s=1+r()*3;x.fillRect(r()*256,r()*256,s,s);}}
  const tx=new THREE.CanvasTexture(c);tx.wrapS=tx.wrapT=THREE.RepeatWrapping;tx.anisotropy=4;return tx;
}

      camera.position.copy(camPos);camera.lookAt(camLook);
      const full=player.stack.length>=capP();fullTag.hidden=!full;
      if(full){tmp.set(player.x,2.3+stackH(player,player.stack.length)*.6,player.z).project(camera);
        fullTag.textContent=t("full");fullTag.style.transform=`translate(${((tmp.x+1)/2*innerWidth).toFixed(1)}px,${((1-tmp.y)/2*innerHeight).toFixed(1)}px) translate(-50%,-100%)`;}
      sun.position.set(player.x+14,30,player.z+10);sun.target.position.set(player.x,0,player.z);
      updAmbient(dt,now,player.x,player.z);
    } else {
      menuAng+=dt*.08;camera.position.set(Math.sin(menuAng)*26,24,Math.cos(menuAng)*26-3);camera.lookAt(0,0,-3);
      carriers.forEach(c=>{if(!c.isPlayer)updWorker(c,dt);});updLines(dt,now);updPile(dt);
      sun.position.set(14,30,7);sun.target.position.set(0,0,-3);updAmbient(dt,now,0,-3);
    }
  }
  renderer.render(scene,camera);requestAnimationFrame(frame);
}

/* ================= flow ================= */
function transition(to,isNew){
  state="trans";const cover=document.createElement("div");
  cover.style.cssText="position:fixed;inset:0;z-index:4;background:#fff;opacity:0;transition:opacity .35s";document.body.appendChild(cover);
  requestAnimationFrame(()=>cover.style.opacity="1");
  setTimeout(()=>{S.cur=to;buildWorld();redrawPads();state="play";save();cover.style.opacity="0";setTimeout(()=>cover.remove(),400);
    if(isNew)showBig(t("newWorld"),t("w"+to),2.4);else showBig(t("w"+to),"",1.4);
    setTimeout(()=>{if(state==="play"&&S.cur===to)adBreak(Math.ceil(goalReward(to,0)));},2600);},380);
}
function startGame(){
  ensureAudio();$("splash").hidden=true;$("hud").hidden=false;state="play";
  camPos.copy(camera.position);camLook.set(0,0,-3);
  if(awayAmt>0){$("awayAmt").textContent=fmt(awayAmt);$("awaySheet").hidden=false;}
  else if(tutStep===0&&S.cur===0)showBig(t("w0"),"",1.6);
}
let awayAmt=0;
(function(){if(!S.t)return;const secs=Math.min(10800,(Date.now()-S.t)/1000);if(secs<60)return;
  const lv=S.lv[S.cur],w=WORLDS[S.cur];
  const vm=(1+.25*lv.qual)*(w.spec==="cotton"?1+.2*lv.spec:1);
  const cw=4+Math.floor(lv.cap/3),dmg=1+.3*lv.axe,spd=3.3*(1+.05*lv.shoes);
  const cycle=2*13/spd+(cw/YIELD)*Math.ceil(w.hp/dmg)*.48+cw*.09+2;
  const wA=lv.mach2>0?Math.ceil(lv.hire/2):lv.hire,wB=lv.hire-wA;
  const rA=Math.min(wA*cw/cycle,(1+.28*lv.mach)/.9)*w.value*(1+.08*lv.mach);
  const rB=lv.mach2>0?Math.min(wB*cw/(cycle*1.2),(1+.28*(lv.mach2-1))/1.15)*w.value*2.6*(1+.08*(lv.mach2-1)):0;
  const pas=["hive","oil","pond"].includes(w.spec)?w.value*1.3*lv.spec:0;
  awayAmt=Math.floor(((rA+rB)*vm+pas)*secs*.5);})();

function showAd(placement){
  if(window.AdKit&&window.AdKit.rewarded)return window.AdKit.rewarded(placement).then(ok=>!!ok,()=>false);
  toast(t("noAd"));return Promise.resolve(false);
}
/* Doğal mola: ödüllü geçiş teklifi (Atla seçenekli) ya da kapı uygunsa kısa geçiş reklamı. Eğitim bitmeden yok. */
const AD_T0=Date.now();let adBreakLast=0;
function adBreak(bonus){
  if(!tutDone||!window.AdKit||!window.AdKit.levelDone)return;
  const now=Date.now();if(now-AD_T0<150e3||now-adBreakLast<60e3||state!=="play")return;adBreakLast=now;
  joy.on=false;joyEl.hidden=true;
  window.AdKit.levelDone({title:t("bonusT"),reward:"+$"+fmt(bonus)}).then(ok=>{if(ok){S.money+=bonus;bump();save();popText("+$"+fmt(bonus),player.x,2.4,player.z,"#ffcf3a");chord([660,880,1320]);}},()=>{});
}

$("boostBtn").addEventListener("click",()=>{if(boostT>0)return;ensureAudio();joy.on=false;joyEl.hidden=true;showAd("boost").then(ok=>{if(ok){boostT=90;updateHud();toast(t("boostOn"));chord([660,880,1320]);}});});
$("away1x").addEventListener("click",()=>{S.money+=awayAmt;S.earned[S.cur]+=awayAmt;awayAmt=0;$("awaySheet").hidden=true;bump();save();chord([523,659,784]);});
$("away2x").addEventListener("click",()=>{showAd("offline2x").then(ok=>{const a=awayAmt*(ok?2:1);S.money+=a;S.earned[S.cur]+=a;awayAmt=0;$("awaySheet").hidden=true;bump();save();chord([523,659,784,1046]);});});

function renderWorlds(){
  const ul=$("worldList");ul.innerHTML="";
  WORLDS.forEach((w,i)=>{const li=document.createElement("li");const b=document.createElement("button");b.className="world"+(i===S.cur?" cur":"");b.disabled=i>S.unlocked;
    const sw=document.createElement("span");sw.className="sw";sw.style.background=w.swatch;sw.textContent=i>S.unlocked?"🔒":w.emoji;
    const mid=document.createElement("span");const nm=document.createElement("b");nm.textContent=t("w"+i);const sm=document.createElement("small");
    const st=document.createElement("span");st.className="stars";const d=S.goals[i].filter(Boolean).length;st.textContent="★".repeat(d)+"☆".repeat(NG-d);
    sm.append(st,document.createTextNode("  "+ITEMS[w.A.item].e+" "+ITEMS[w.B.item].e+" "+SPEC_ICON[w.spec]));mid.append(nm,sm);
    const stt=document.createElement("span");stt.className="st";stt.textContent=i===S.cur?t("here"):i>S.unlocked?t("locked"):t("go")+" ›";
    b.append(sw,mid,stt);b.addEventListener("click",()=>{$("worldsSheet").hidden=true;if(i!==S.cur){S.money+=pileValue();pile=[];transition(i,false);}});
    li.append(b);ul.append(li);});
}
$("worldBtn").addEventListener("click",()=>{renderWorlds();$("worldsSheet").hidden=false;});
$("setBtn").addEventListener("click",()=>{applyLang();$("setSheet").hidden=false;});
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>{b.closest(".screen").hidden=true;}));
$("sndBtn").addEventListener("click",()=>{S.snd=S.snd?0:1;applyLang();save();});
$("gfxBtn").addEventListener("click",()=>{S.gfx=S.gfx?0:1;renderer.shadowMap.enabled=!!S.gfx;
  scene.traverse(o=>{if(o.material){(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.needsUpdate=true);}});applyLang();save();});

function applyLang(){
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
  document.querySelectorAll(".langs button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
  document.documentElement.lang=lang;
  const sb=$("sndBtn");sb.textContent=S.snd?t("on"):t("off");sb.classList.toggle("off",!S.snd);
  const gb=$("gfxBtn");gb.textContent=S.gfx?t("on"):t("off");gb.classList.toggle("off",!S.gfx);
  if(world){redrawPads();updateHud();goalsKey="";renderGoals();}
}
document.querySelectorAll(".langs button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.l;applyLang();save();}));
$("playBtn").addEventListener("click",startGame);

addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);setCamOff();});
document.addEventListener("visibilitychange",()=>{if(document.hidden)save();});
addEventListener("pagehide",save);

applyLang();
buildWorld();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(world)redrawPads();});
window.__tw={get S(){return S;},get player(){return player;},buy,transition,get pads(){return pads;},get lines(){return lines;}};
requestAnimationFrame(frame);
})();
</script>
